private fun logNotebookEligibilityIfChanged(
    context: Context,
    date: LocalDate,
    zone: ZoneId,
    configured: Boolean,
    dailyStartMs: Long,
    dailyEndMs: Long,
    dailyHasSource: Boolean,
    dailyPendingTranscription: Boolean,
    dailyQueueState: String?,
    queueEntries: List<AiQueueStore.Entry>,
    records: List<SegmentRecord>,
    rows: List<NotebookHourlyActionRow>
) {
    val dailyActiveQueue = when (dailyQueueState) {
        AiQueueStore.STATE_RUNNING, AiQueueStore.STATE_QUEUED -> true
        AiQueueStore.STATE_WAITING_DATA, AiQueueStore.STATE_RETRY_WAIT -> !dailyHasSource
        else -> false
    }
    val dateAllowed = date <= LocalDate.now(zone)
    val dailyCanRun = configured && dateAllowed && !dailyActiveQueue &&
        !dailyPendingTranscription && dailyHasSource
    val blockers = JSONArray()
    val blockerSignature = StringBuilder()
    var blockerCount = 0
    for (record in records) {
        if (!notebookRecordOverlaps(record, dailyStartMs, dailyEndMs)) continue
        if (record.status == "CORRUPT") continue
        if (!record.audioAvailable) continue
        val pending = !record.hasTranscript ||
            record.status == "READY" ||
            record.status == "QUEUED" ||
            record.status == "RETRY_WAIT" ||
            record.status == "TRANSCRIBING"
        if (!pending) continue
        blockerCount++
        blockerSignature.append(record.segmentId).append(':')
            .append(record.status).append(':').append(record.reason).append('|')
        if (blockers.length() < 50) {
            blockers.put(JSONObject()
                .put("segmentId", record.segmentId)
                .put("status", record.status)
                .put("reason", record.reason ?: JSONObject.NULL)
                .put("queueState", record.queueState)
                .put("dataState", record.dataState)
                .put("audioAvailable", record.audioAvailable)
                .put("hasTranscript", record.hasTranscript)
                .put("liveOwned", record.liveOwned)
                .put("startedAtMs", record.startedAtMs)
                .put("endedAtMs", record.endedAtMs))
        }
    }
    val dailyEntry = queueEntries.firstOrNull {
        it.kind == AiAnalysisScheduler.KIND_DAILY && it.periodStartMs == dailyStartMs
    }
    val disabledReasons = JSONArray()
    if (!configured) disabledReasons.put("AI_NOT_CONFIGURED")
    if (!dateAllowed) disabledReasons.put("FUTURE_DATE")
    if (dailyActiveQueue) disabledReasons.put("ACTIVE_AI_QUEUE:${dailyQueueState}")
    if (dailyPendingTranscription) disabledReasons.put("PENDING_TRANSCRIPTION")
    if (!dailyHasSource) disabledReasons.put("NO_TRANSCRIPT_SOURCE")

    val dailySignature = listOf(
        configured, dateAllowed, dailyHasSource, dailyPendingTranscription,
        dailyQueueState, dailyCanRun, blockerCount, blockerSignature.toString(),
        dailyEntry?.requestType, dailyEntry?.attempt, dailyEntry?.message
    ).joinToString("|")
    val dailyKey = "daily:$dailyStartMs"
    if (notebookEligibilitySignatures.put(dailyKey, dailySignature) != dailySignature) {
        try {
            AppLogger.event(context, "AI_NOTEBOOK_DAILY_ELIGIBILITY", JSONObject()
                .put("date", date.toString())
                .put("periodStartMs", dailyStartMs)
                .put("periodEndMs", dailyEndMs)
                .put("configured", configured)
                .put("dateAllowed", dateAllowed)
                .put("hasSource", dailyHasSource)
                .put("pendingTranscription", dailyPendingTranscription)
                .put("queueState", dailyQueueState ?: JSONObject.NULL)
                .put("queueRequestType", dailyEntry?.requestType ?: JSONObject.NULL)
                .put("queueAttempt", dailyEntry?.attempt ?: -1)
                .put("queueMessage", dailyEntry?.message ?: JSONObject.NULL)
                .put("activeQueue", dailyActiveQueue)
                .put("canRun", dailyCanRun)
                .put("disabledReasons", disabledReasons)
                .put("blockerCount", blockerCount)
                .put("blockers", blockers))
        } catch (_: Exception) {
        }
    }

    for (row in rows) {
        val activeQueue = when (row.queueState) {
            AiQueueStore.STATE_RUNNING, AiQueueStore.STATE_QUEUED -> true
            AiQueueStore.STATE_WAITING_DATA, AiQueueStore.STATE_RETRY_WAIT -> !row.hasSource
            else -> false
        }
        val canRun = configured && row.periodFinished && !activeQueue && row.hasSource
        val disabled = JSONArray()
        if (!configured) disabled.put("AI_NOT_CONFIGURED")
        if (!row.periodFinished) disabled.put(if (row.periodStarted) "PERIOD_IN_PROGRESS" else "PERIOD_NOT_STARTED")
        if (activeQueue) disabled.put("ACTIVE_AI_QUEUE:${row.queueState}")
        if (!row.hasSource) disabled.put("NO_TRANSCRIPT_SOURCE")
        val signature = listOf(
            configured, row.hasSource, row.hasResult, row.pendingTranscription,
            row.queueState, row.periodFinished, row.periodStarted, canRun
        ).joinToString("|")
        val key = "hourly:${row.periodStartMs}"
        if (notebookEligibilitySignatures.put(key, signature) == signature) continue
        try {
            AppLogger.event(context, "AI_NOTEBOOK_HOURLY_ELIGIBILITY", JSONObject()
                .put("periodStartMs", row.periodStartMs)
                .put("periodEndMs", row.periodEndMs)
                .put("hour", row.hour)
                .put("configured", configured)
                .put("hasSource", row.hasSource)
                .put("hasResult", row.hasResult)
                .put("pendingTranscription", row.pendingTranscription)
                .put("queueState", row.queueState ?: JSONObject.NULL)
                .put("periodFinished", row.periodFinished)
                .put("periodStarted", row.periodStarted)
                .put("activeQueue", activeQueue)
                .put("canRun", canRun)
                .put("disabledReasons", disabled))
        } catch (_: Exception) {
        }
    }
}

