import java.nio.charset.StandardCharsets

def readUtf8070s = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8070s = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce070s = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.70 storage ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}
def replaceBetween070s = { String source, String startMarker, String endMarker, String replacement, String label ->
    int start = source.indexOf(startMarker)
    int secondStart = source.indexOf(startMarker, start + 1)
    if (start < 0 || secondStart >= 0) {
        throw new GradleException("0.7.70 storage ${label}: start marker must match exactly once")
    }
    int end = source.indexOf(endMarker, start)
    if (end < 0) {
        throw new GradleException("0.7.70 storage ${label}: end marker missing")
    }
    source.substring(0, start) + replacement + source.substring(end)
}

