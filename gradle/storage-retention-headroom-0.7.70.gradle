    public static final long LOGICAL_APP_LIMIT_BYTES = 1024L * 1024L * 1024L;
    public static final long EMERGENCY_RESERVE_BYTES = 150L * 1024L * 1024L;
    private static final long AUDIO_CLEANUP_TARGET_BYTES = 570L * 1024L * 1024L;
    private static final long DEVICE_FREE_TARGET_BYTES = 250L * 1024L * 1024L;
''',
'''    public static final long AUDIO_LIMIT_BYTES = 600L * 1024L * 1024L;
    public static final long LOGICAL_APP_LIMIT_BYTES = 1024L * 1024L * 1024L;
    public static final long EMERGENCY_RESERVE_BYTES = 150L * 1024L * 1024L;
    // Do not run day-to-day at the emergency edge. Once retained M4A exceeds 450 MiB, evict only
    // the oldest audio that already has a durable transcript and return to a 400 MiB working set.
    // The 600 MiB hard limit is retained for the Wiki-defined emergency rolling policy, where
    // untranscribed audio may be removed only after safer candidates are exhausted.
    private static final long AUDIO_SOFT_LIMIT_BYTES = 450L * 1024L * 1024L;
    private static final long AUDIO_SOFT_CLEANUP_TARGET_BYTES = 400L * 1024L * 1024L;
    private static final long AUDIO_HARD_CLEANUP_TARGET_BYTES = 570L * 1024L * 1024L;
    private static final long DEVICE_FREE_TARGET_BYTES = 250L * 1024L * 1024L;
''', 'storage thresholds')

def newEnforce070s = '''    public static void enforce(Context context) {
        List<File> files = finalizedAudioFiles(context);
        long audioBytes = files.stream().mapToLong(File::length).sum();
        long appBytes = appDataBytes(context);
        long usable = context.getFilesDir().getUsableSpace();

        long audioBytesBefore = audioBytes;
        long appBytesBefore = appBytes;
        long usableBefore = usable;
        boolean hardPressure = audioBytes > AUDIO_LIMIT_BYTES
                || appBytes > (LOGICAL_APP_LIMIT_BYTES - EMERGENCY_RESERVE_BYTES)
                || usable < EMERGENCY_RESERVE_BYTES;
        boolean softAudioPressure = audioBytes > AUDIO_SOFT_LIMIT_BYTES;
        if (!hardPressure && !softAudioPressure) {
            return;
        }

        long targetAudioBytes = hardPressure
                ? AUDIO_HARD_CLEANUP_TARGET_BYTES : AUDIO_SOFT_CLEANUP_TARGET_BYTES;
        logCleanupCycle(context, "STORAGE_RETENTION_CLEANUP_STARTED",
                hardPressure, softAudioPressure,
                audioBytesBefore, audioBytes, appBytesBefore, appBytes,
                usableBefore, usable, targetAudioBytes, 0, 0, 0L);

        // Wiki order: transcribed audio first. Soft cleanup is deliberately conservative and never
        // removes audio without a durable transcript. Only hard capacity pressure is allowed to
        // progress to the existing data-loss rolling-delete tier.
        files.sort(Comparator
                .comparingInt((File file) -> isTranscribed(context, file) ? 0 : 1)
                .thenComparingLong(File::lastModified));

        int deletedTranscribedCount = 0;
        int deletedUntranscribedCount = 0;
        long deletedBytes = 0L;
        for (File file : files) {
            boolean audioTargetMet = audioBytes <= targetAudioBytes;
            boolean appTargetMet = appBytes <= (LOGICAL_APP_LIMIT_BYTES - EMERGENCY_RESERVE_BYTES);
            boolean freeTargetMet = usable >= DEVICE_FREE_TARGET_BYTES;
            if (audioTargetMet && (!hardPressure || (appTargetMet && freeTargetMet))) {
                break;
            }

            String segmentId = extractSegmentId(file.getName());
            boolean transcribed = TranscriptionRepository.exists(context, segmentId);
            if (!hardPressure && !transcribed) {
                // Every transcribed file sorts before this row, so no safe soft-cleanup candidate
                // remains. Leave the rest intact until hard pressure or a transcript is produced.
                break;
            }

            long size = file.length();
            long modified = file.lastModified();
            if (file.delete()) {
                audioBytes -= size;
                appBytes -= size;
                deletedBytes += size;
                usable = context.getFilesDir().getUsableSpace();
                if (transcribed) {
                    deletedTranscribedCount++;
                    SegmentRepository.append(context, segmentId, file, modified,
                            System.currentTimeMillis(), "DELETED",
                            hardPressure
                                    ? "STORAGE_PRESSURE_TRANSCRIBED_RETENTION"
                                    : "STORAGE_HEADROOM_TRANSCRIBED_RETENTION");
                    logTranscribedEviction(context, file, segmentId, size,
                            audioBytes, appBytes, usable);
                } else {
                    deletedUntranscribedCount++;
                    logDataLoss(context, file, segmentId, size, audioBytes, appBytes, usable);
                }
            }
        }

        logCleanupCycle(context, "STORAGE_RETENTION_CLEANUP_FINISHED",
                hardPressure, softAudioPressure,
                audioBytesBefore, audioBytes, appBytesBefore, appBytes,
                usableBefore, usable, targetAudioBytes,
                deletedTranscribedCount, deletedUntranscribedCount, deletedBytes);
    }

'''
