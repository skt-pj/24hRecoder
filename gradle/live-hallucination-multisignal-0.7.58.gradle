// Keep the 0.7.26 protection for quiet genuine speech, but add a second-stage decision that
// combines pre-denoise acoustics, Silero evidence and Whisper confidence. Known outro phrases are
// only a risk signal; phrase text by itself never causes suppression.
def guardFile058 = rootProject.file('app/src/main/java/com/sktpj/recorder24h/transcription/LiveWhisperNoSpeechGuard.java')
def guard058 = readUtf8058(guardFile058)
def guardMethod058 = '''    static Output filterWithEvidence(Context context, String route,
                                     AudioPreprocessor.Result front,
                                     StreamingVadStore.Snapshot vad,
                                     String text, JSONArray segments) {
        String safeText = text == null ? "" : text.trim();
        JSONArray safeSegments = segments == null ? new JSONArray() : segments;
        if (safeText.isEmpty() || safeSegments.length() == 0 || front == null || vad == null) {
            return new Output(safeText, safeSegments);
        }

        long speechMs = 0L;
        for (StreamingVadStore.Range range : vad.ranges) {
            speechMs += Math.max(0L, range.endMs - range.startMs);
        }
        long sourceMs = Math.max(1L, front.samples.length * 1000L / 16_000L);
        double speechFraction = Math.min(1.0, speechMs / (double) sourceMs);

        double tokenProbabilitySum = 0.0;
        int tokenProbabilityCount = 0;
        double noSpeechSum = 0.0;
        int noSpeechCount = 0;
        double maxNoSpeech = 0.0;
        for (int i = 0; i < safeSegments.length(); i++) {
            JSONObject row = safeSegments.optJSONObject(i);
            if (row == null || row.optString("text", "").trim().isEmpty()) continue;
            if (row.has("avgTokenProbability")) {
                double value = row.optDouble("avgTokenProbability", -1.0);
                if (value >= 0.0) {
                    tokenProbabilitySum += value;
                    tokenProbabilityCount++;
                }
            }
            if (row.has("noSpeechProbability")) {
                double value = row.optDouble("noSpeechProbability", -1.0);
                if (value >= 0.0) {
                    noSpeechSum += value;
                    noSpeechCount++;
                    maxNoSpeech = Math.max(maxNoSpeech, value);
                }
            }
        }
        double meanTokenProbability = tokenProbabilityCount > 0
                ? tokenProbabilitySum / tokenProbabilityCount : -1.0;
        double meanNoSpeech = noSpeechCount > 0 ? noSpeechSum / noSpeechCount : -1.0;

        boolean lowSnr = front.snrProxyDb < 6.0 || front.boostSuppressedForLowSnr;
        boolean weakVad = vad.meanDetectedSpeechProbability >= 0.0
                && vad.meanDetectedSpeechProbability < 0.68;
        boolean sparseVad = vad.aboveThresholdFraction >= 0.0
                && vad.aboveThresholdFraction < 0.055;
        boolean shortSpeech = speechMs > 0L && speechMs < 1_500L;
        boolean lowTokenConfidence = meanTokenProbability >= 0.0 && meanTokenProbability < 0.52;
        boolean elevatedNoSpeech = meanNoSpeech >= 0.35 || maxNoSpeech >= 0.50;
        boolean weakAcousticActivity = front.activeFrameFraction < 0.08;
        boolean knownOutro = isKnownOutroHallucination(safeText);

        int risk = 0;
        if (lowSnr) risk++;
        if (weakVad) risk++;
        if (sparseVad) risk++;
        if (shortSpeech) risk++;
        if (lowTokenConfidence) risk++;
        if (elevatedNoSpeech) risk++;
        if (weakAcousticActivity) risk++;
        if (knownOutro) risk += 2;

        boolean suppressKnownOutro = knownOutro && risk >= 4
                && (lowSnr || weakVad || sparseVad)
                && (lowTokenConfidence || elevatedNoSpeech || weakAcousticActivity || shortSpeech);
        boolean suppressGeneral = !knownOutro && risk >= 5
                && (lowTokenConfidence || elevatedNoSpeech)
                && (weakVad || sparseVad || lowSnr);
        boolean suppress = suppressKnownOutro || suppressGeneral;

        if (context != null) {
            try {
                JSONObject details = new JSONObject()
                        .put("route", route)
                        .put("suppressed", suppress)
                        .put("knownOutroPattern", knownOutro)
                        .put("riskScore", risk)
                        .put("textChars", safeText.length())
                        .put("sourceMs", sourceMs)
                        .put("vadSpeechMs", speechMs)
                        .put("vadSpeechFraction", speechFraction)
                        .put("vadRangeCount", vad.ranges.size())
                        .put("vadMeanProbability", vad.meanSpeechProbability)
                        .put("vadMeanDetectedProbability", vad.meanDetectedSpeechProbability)
                        .put("vadMaxProbability", vad.maxSpeechProbability)
                        .put("vadAboveThresholdFraction", vad.aboveThresholdFraction)
                        .put("inputRms", front.input.rms)
                        .put("inputPeak", front.input.peak)
                        .put("snrProxyDb", front.snrProxyDb)
                        .put("activeFrameFraction", front.activeFrameFraction)
                        .put("meanTokenProbability", meanTokenProbability)
                        .put("meanNoSpeechProbability", meanNoSpeech)
                        .put("maxNoSpeechProbability", maxNoSpeech)
                        .put("automaticFallback", false);
                AppLogger.event(context.getApplicationContext(),
                        suppress ? "FULL_STREAMING_MULTISIGNAL_SUPPRESSED"
                                : "FULL_STREAMING_MULTISIGNAL_ACCEPTED",
                        details);
            } catch (Exception ignored) {
            }
        }
        return suppress ? new Output("", new JSONArray()) : new Output(safeText, safeSegments);
    }

    private static boolean isKnownOutroHallucination(String text) {
        if (text == null || text.trim().isEmpty()) return false;
        String compact = text.replaceAll("[\\s\\p{Punct}。、，．！？!？『』「」【】（）()〜～…]", "");
        return compact.contains("ご視聴ありがとうございました")
                || compact.contains("ご視聴ありがとう")
                || compact.contains("チャンネル登録")
                || compact.equals("ありがとうございました");
    }

