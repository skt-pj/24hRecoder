if (!guardFile058.text.contains('FULL_STREAMING_MULTISIGNAL_SUPPRESSED')) {
    throw new GradleException('0.7.58 multi-signal suppression missing')
}
if (!streamFile058.text.contains('hallucinationVadEvidence')) {
    throw new GradleException('0.7.58 VAD evidence bridge missing')
}
if (!vadFile058.text.contains('meanDetectedSpeechProbability')) {
    throw new GradleException('0.7.58 VAD probability metrics missing')
}
