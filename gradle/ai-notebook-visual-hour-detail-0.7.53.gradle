'''@Composable
private fun HourlyNotebookDetailPage(
    doc: AiAnalysisDocument,
    onBack: () -> Unit
) {
    val analysis = doc.analysis
    val summary = analysis.optString("summary", "").trim()
    val decisions = analysis.optJSONArray("decisions").stringValues()
    val todos = analysis.optJSONArray("todos").objectValues()
    val unresolved = analysis.optJSONArray("unresolved").stringValues()
    val ideas = analysis.optJSONArray("ideas").stringValues()

    LazyColumn(
        modifier = Modifier.fillMaxSize(),
        contentPadding = PaddingValues(20.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        item {
            Text(
                "‹ 1日の一覧",
                modifier = Modifier.clickable(onClick = onBack),
                style = MaterialTheme.typography.titleMedium,
                color = MaterialTheme.colorScheme.primary
            )
        }
        item {
            Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                Text(
                    formatHourRange(doc.periodStartMs, doc.periodEndMs),
                    style = MaterialTheme.typography.headlineMedium
                )
                val signalCount = decisions.size + todos.size + unresolved.size + ideas.size
                if (signalCount > 0) {
                    val labels = buildList {
                        if (decisions.isNotEmpty()) add("決定 ${decisions.size}")
                        if (todos.isNotEmpty()) add("次にやる ${todos.size}")
                        if (ideas.isNotEmpty()) add("アイデア ${ideas.size}")
                        if (unresolved.isNotEmpty()) add("保留 ${unresolved.size}")
                    }
                    Text(
                        labels.joinToString("  •  "),
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
            }
        }
        if (summary.isNotEmpty()) {
            item {
                Card(
                    colors = CardDefaults.cardColors(
                        containerColor = MaterialTheme.colorScheme.secondaryContainer
                    )
                ) {
                    Column(
                        modifier = Modifier.fillMaxWidth().padding(18.dp),
                        verticalArrangement = Arrangement.spacedBy(8.dp)
                    ) {
                        Text("要点", style = MaterialTheme.typography.titleMedium)
                        Text(summary, style = MaterialTheme.typography.bodyLarge)
                    }
                }
            }
        }
        item {
            HourlyImportantSignalsCard(
                decisions = decisions,
                todos = todos,
                ideas = ideas,
                unresolved = unresolved
            )
        }
        item {
            HourlyConversationFlowCard(
                chapters = analysis.optJSONArray("chapters"),
                keyEvents = analysis.optJSONArray("keyEvents")
            )
        }
        item {
            HourlyMindMapCard(
                mindMap = analysis.optJSONArray("mindMap"),
                topics = analysis.optJSONArray("topics")
            )
        }
        item {
            HourlyContextChipsCard(
                topics = analysis.optJSONArray("topics"),
                people = analysis.optJSONArray("people"),
                places = analysis.optJSONArray("places")
            )
        }
        item {
            HourlyQuotesCard(analysis.optJSONArray("notableQuotes"))
        }
    }
}

@Composable
private fun HourlyImportantSignalsCard(
    decisions: List<String>,
    todos: List<JSONObject>,
    ideas: List<String>,
    unresolved: List<String>
) {
    if (decisions.isEmpty() && todos.isEmpty() && ideas.isEmpty() && unresolved.isEmpty()) return
    AnalysisSectionCard("重要ポイント") {
        decisions.forEach { value ->
            VoiceMemoSignalRow("決定", value)
        }
        todos.forEach { row ->
            val task = row.optString("task", "").trim()
            if (task.isNotEmpty()) VoiceMemoSignalRow("次にやる", task)
        }
        ideas.forEach { value ->
            VoiceMemoSignalRow("アイデア", value)
        }
        unresolved.forEach { value ->
            VoiceMemoSignalRow("保留", value)
        }
    }
}

@Composable
private fun VoiceMemoSignalRow(label: String, text: String) {
    if (text.isBlank()) return
    Row(
        modifier = Modifier.fillMaxWidth().padding(vertical = 7.dp),
        horizontalArrangement = Arrangement.spacedBy(10.dp),
        verticalAlignment = Alignment.Top
    ) {
        Surface(
            color = MaterialTheme.colorScheme.primaryContainer,
            shape = MaterialTheme.shapes.small
        ) {
            Text(
                label,
                modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                style = MaterialTheme.typography.labelMedium,
                color = MaterialTheme.colorScheme.onPrimaryContainer
            )
        }
        Text(
            text,
            modifier = Modifier.weight(1f),
            style = MaterialTheme.typography.bodyMedium
        )
    }
}

@Composable
private fun HourlyConversationFlowCard(
    chapters: JSONArray?,
    keyEvents: JSONArray?
) {
    val chapterRows = chapters.objectValues().filter {
        it.optString("title", "").isNotBlank() || it.optString("summary", "").isNotBlank()
    }
    val eventRows = keyEvents.objectValues().filter {
        it.optString("event", "").isNotBlank()
    }
    if (chapterRows.isEmpty() && eventRows.isEmpty()) return

    AnalysisSectionCard("会話の流れ") {
        if (chapterRows.isNotEmpty()) {
            chapterRows.take(4).forEachIndexed { index, row ->
                if (index > 0) HorizontalDivider()
                val start = row.optString("startTime", "").trim()
                val end = row.optString("endTime", "").trim()
                val title = row.optString("title", "").trim()
                val detail = row.optString("summary", "").trim()
                Row(
                    modifier = Modifier.fillMaxWidth().padding(vertical = 9.dp),
                    horizontalArrangement = Arrangement.spacedBy(12.dp),
                    verticalAlignment = Alignment.Top
                ) {
                    Text(
                        listOf(start, end).filter(String::isNotEmpty).joinToString("–"),
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.primary
                    )
                    Column(
                        modifier = Modifier.weight(1f),
                        verticalArrangement = Arrangement.spacedBy(3.dp)
                    ) {
                        if (title.isNotEmpty()) {
                            Text(title, fontWeight = FontWeight.SemiBold)
                        }
                        if (detail.isNotEmpty()) {
                            Text(
                                detail,
                                style = MaterialTheme.typography.bodyMedium,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                    }
                }
            }
        } else {
            eventRows.take(4).forEachIndexed { index, row ->
                if (index > 0) HorizontalDivider()
                val time = row.optString("time", "").trim()
                val event = row.optString("event", "").trim()
                Row(
                    modifier = Modifier.fillMaxWidth().padding(vertical = 9.dp),
                    horizontalArrangement = Arrangement.spacedBy(12.dp),
                    verticalAlignment = Alignment.Top
                ) {
                    Text(
                        time,
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.primary
                    )
                    Text(event, modifier = Modifier.weight(1f))
                }
            }
        }
    }
}

@Composable
private fun HourlyMindMapCard(
    mindMap: JSONArray?,
    topics: JSONArray?
) {
    val nodes = mindMap.objectValues().filter { it.optString("label", "").isNotBlank() }
    val fallbackTopics = topics.stringValues().take(5)
    if (nodes.isEmpty() && fallbackTopics.isEmpty()) return

    AnalysisSectionCard("マインドマップ") {
        if (nodes.isEmpty()) {
            Surface(
                color = MaterialTheme.colorScheme.primaryContainer,
                shape = MaterialTheme.shapes.medium,
                modifier = Modifier.fillMaxWidth()
            ) {
                Text(
                    "この時間",
                    modifier = Modifier.padding(12.dp),
                    fontWeight = FontWeight.SemiBold,
                    color = MaterialTheme.colorScheme.onPrimaryContainer
                )
            }
            fallbackTopics.forEach { topic ->
                Row(
                    modifier = Modifier.fillMaxWidth().padding(start = 16.dp, top = 6.dp),
                    horizontalArrangement = Arrangement.spacedBy(8.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Text("↳", color = MaterialTheme.colorScheme.primary)
                    Surface(
                        tonalElevation = 1.dp,
                        shape = MaterialTheme.shapes.small,
                        modifier = Modifier.weight(1f)
                    ) {
                        Text(topic, modifier = Modifier.padding(10.dp))
                    }
                }
            }
            return@AnalysisSectionCard
        }

        val byId = nodes.associateBy { it.optString("id", "") }
        val root = nodes.firstOrNull { it.optString("parentId", "").isBlank() } ?: nodes.first()
        val rootId = root.optString("id", "")
        val branches = nodes.filter { it.optString("parentId", "") == rootId }.take(5)

        Surface(
            color = MaterialTheme.colorScheme.primaryContainer,
            shape = MaterialTheme.shapes.medium,
            modifier = Modifier.fillMaxWidth()
        ) {
            Text(
                root.optString("label", "この時間"),
                modifier = Modifier.padding(12.dp),
                fontWeight = FontWeight.SemiBold,
                color = MaterialTheme.colorScheme.onPrimaryContainer
            )
        }

        branches.forEach { branch ->
            val branchId = branch.optString("id", "")
            val children = nodes.filter { it.optString("parentId", "") == branchId }.take(3)
            Row(
                modifier = Modifier.fillMaxWidth().padding(start = 12.dp, top = 8.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp),
                verticalAlignment = Alignment.Top
            ) {
                Text("↳", color = MaterialTheme.colorScheme.primary)
                Column(
                    modifier = Modifier.weight(1f),
                    verticalArrangement = Arrangement.spacedBy(5.dp)
                ) {
                    Surface(
                        tonalElevation = 1.dp,
                        shape = MaterialTheme.shapes.small,
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Text(
                            branch.optString("label", ""),
                            modifier = Modifier.padding(10.dp),
                            fontWeight = FontWeight.SemiBold
                        )
                    }
                    children.forEach { child ->
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(start = 14.dp),
                            horizontalArrangement = Arrangement.spacedBy(7.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Text("•", color = MaterialTheme.colorScheme.onSurfaceVariant)
                            Text(
                                child.optString("label", ""),
                                style = MaterialTheme.typography.bodyMedium,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                    }
                }
            }
        }
    }
}

@Composable
private fun HourlyContextChipsCard(
    topics: JSONArray?,
    people: JSONArray?,
    places: JSONArray?
) {
    val chips = buildList {
        topics.stringValues().take(5).forEach { add("話題" to it) }
        people.stringValues().take(4).forEach { add("人物" to it) }
        places.stringValues().take(3).forEach { add("場所" to it) }
    }
    if (chips.isEmpty()) return

    AnalysisSectionCard("手がかり") {
        LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            items(chips) { chip ->
                Surface(
                    tonalElevation = 1.dp,
                    shape = MaterialTheme.shapes.large
                ) {
                    Text(
                        "${chip.first}: ${chip.second}",
                        modifier = Modifier.padding(horizontal = 11.dp, vertical = 7.dp),
                        style = MaterialTheme.typography.bodySmall
                    )
                }
            }
        }
    }
}

@Composable
private fun HourlyQuotesCard(array: JSONArray?) {
    val quotes = array.objectValues().filter { it.optString("text", "").isNotBlank() }.take(2)
    if (quotes.isEmpty()) return
    AnalysisSectionCard("残しておく発言") {
        quotes.forEachIndexed { index, row ->
            if (index > 0) HorizontalDivider()
            val time = row.optString("time", "").trim()
            val text = row.optString("text", "").trim()
            Column(
                modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp),
                verticalArrangement = Arrangement.spacedBy(3.dp)
            ) {
                if (time.isNotEmpty()) {
                    Text(
                        time,
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.primary
                    )
                }
                Text("「$text」", style = MaterialTheme.typography.bodyMedium)
            }
        }
    }
}
