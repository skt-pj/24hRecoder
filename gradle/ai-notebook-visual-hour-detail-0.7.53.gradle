import java.nio.charset.StandardCharsets

def readUtf8053 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8053 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce053 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.53 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

