@Composable
private fun HourlyNotebookDetailPage(
    doc: AiAnalysisDocument
) {
    val analysis = doc.analysis
    LazyColumn(
        modifier = Modifier.fillMaxSize(),
        contentPadding = PaddingValues(20.dp),
        verticalArrangement = Arrangement.spacedBy(14.dp)
    ) {
        item {
            Text(
                formatHourRange(doc.periodStartMs, doc.periodEndMs),
                style = MaterialTheme.typography.headlineMedium
            )
        }
        item {
            val summary = analysis.optString("summary", "").trim()
            if (summary.isNotEmpty()) {
                AnalysisSectionCard("概要") {
                    Text(summary, style = MaterialTheme.typography.bodyLarge)
                }
            }
        }
        item {
            ObjectListCard("重要な出来事", analysis.optJSONArray("keyEvents")) { row ->
                val time = row.optString("time", "").trim()
                val event = row.optString("event", "").trim()
                listOf(time, event).filter(String::isNotEmpty).joinToString("  ")
            }
        }
        item {
            StringListCard("意思決定", analysis.optJSONArray("decisions"))
        }
        item {
            ObjectListCard("TODO・約束", analysis.optJSONArray("todos")) { row ->
                val task = row.optString("task", "").trim()
                val evidence = row.optString("evidence", "").trim()
                if (evidence.isEmpty()) task else "$task\\n根拠: $evidence"
            }
        }
        item {
            StringListCard("アイデア", analysis.optJSONArray("ideas"))
        }
        item {
            StringListCard("未解決", analysis.optJSONArray("unresolved"))
        }
        item {
            StringListCard("トピック", analysis.optJSONArray("topics"))
        }
        item {
            StringListCard("人物", analysis.optJSONArray("people"))
        }
        item {
            StringListCard("場所", analysis.optJSONArray("places"))
        }
        item {
            ObjectListCard("印象的な発言", analysis.optJSONArray("notableQuotes")) { row ->
                val time = row.optString("time", "").trim()
                val text = row.optString("text", "").trim()
                listOf(time, text).filter(String::isNotEmpty).joinToString("  ")
            }
        }
    }
}
''', 'single-hour detail page')

