if (!stream.contains('FULL_STREAMING_FINAL_COALESCED')) {
    stream = replaceOnce(
        stream,
        '''    private long latestActiveSpeechStartUs = -1L;
    private long lastPartialRequestedEndUs;
    private long lastScheduledFinalEndUs;
''',
        '''    private long latestActiveSpeechStartUs = -1L;
    private long lastPartialRequestedEndUs;
    private long lastScheduledFinalEndUs;
    private final Object finalBatchLock = new Object();
    private FinalBatch mergeableFinalBatch;

    private static final int LIVE_SAMPLE_RATE_HZ = 16_000;
    private static final long MAX_FINAL_COALESCE_GAP_US = 15_000_000L;
    private static final long MAX_FINAL_BATCH_TIMELINE_US = 30_000_000L;

    private static final class FinalBatch {
        final SegmentAccumulator accumulator;
        final long startUs;
        long endUs;
        long queuedAtMs;
        float[] samples;
        int utteranceCount = 1;
        boolean started;

        FinalBatch(SegmentAccumulator accumulator, long startUs, long endUs,
                   long queuedAtMs, float[] samples) {
            this.accumulator = accumulator;
            this.startUs = startUs;
            this.endUs = endUs;
            this.queuedAtMs = queuedAtMs;
            this.samples = samples;
        }

        boolean canMerge(long nextStartUs, long nextEndUs) {
            long gapUs = Math.max(0L, nextStartUs - endUs);
            return !started
                    && gapUs <= MAX_FINAL_COALESCE_GAP_US
                    && nextEndUs - startUs <= MAX_FINAL_BATCH_TIMELINE_US;
        }

        void merge(long nextStartUs, long nextEndUs, long nextQueuedAtMs,
                   float[] nextSamples) {
            long gapUs = Math.max(0L, nextStartUs - endUs);
            int gapSamples = (int) Math.min(
                    Integer.MAX_VALUE,
                    gapUs * LIVE_SAMPLE_RATE_HZ / 1_000_000L);
            int newSize = Math.addExact(
                    Math.addExact(samples.length, gapSamples),
                    nextSamples.length);
            float[] merged = Arrays.copyOf(samples, newSize);
            System.arraycopy(
                    nextSamples,
                    0,
                    merged,
                    samples.length + gapSamples,
                    nextSamples.length);
            samples = merged;
            endUs = Math.max(endUs, nextEndUs);
            queuedAtMs = Math.max(queuedAtMs, nextQueuedAtMs);
            utteranceCount++;
        }
    }
''',
        'streaming batch fields'
    )

    stream = replaceOnce(
        stream,
        '''                } else {
                    logBackpressure("partial-skipped", currentEndUs);
                }
''',
        '''                } else {
                    // Advance the partial clock even when skipped so one backlog does not emit
                    // a backpressure log on every PCM message.
                    lastPartialRequestedEndUs = currentEndUs;
                    logBackpressure("partial-skipped", currentEndUs);
                }
''',
