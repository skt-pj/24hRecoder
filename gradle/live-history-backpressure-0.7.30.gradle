    def newScheduleFinal = '''    private void scheduleFinal(
            long requestedStartUs,
            long requestedEndUs,
            SegmentAccumulator accumulator) {
        if (accumulator == null || accumulator.failed) return;
        long startUs = Math.max(
                accumulator.basePtsUs(),
                Math.max(requestedStartUs, lastScheduledFinalEndUs));
        long endUs = Math.max(startUs, requestedEndUs);
        if (endUs <= startUs) return;

        float[] samples = pcmBuffer.sliceFloat(startUs, endUs);
        if (samples.length == 0) return;

        lastScheduledFinalEndUs = endUs;
        long queuedAtMs = System.currentTimeMillis();
        FinalBatch batchToSubmit = null;
        FinalBatch mergedBatch = null;

        synchronized (finalBatchLock) {
            FinalBatch candidate = mergeableFinalBatch;
            if (candidate != null
                    && candidate.accumulator == accumulator
                    && candidate.canMerge(startUs, endUs)) {
                candidate.merge(startUs, endUs, queuedAtMs, samples);
                mergedBatch = candidate;
            } else {
                batchToSubmit = new FinalBatch(
                        accumulator, startUs, endUs, queuedAtMs, samples);
                mergeableFinalBatch = batchToSubmit;
            }
        }

        if (mergedBatch != null) {
            try {
                log("FULL_STREAMING_FINAL_COALESCED", new JSONObject()
                        .put("startPtsUs", mergedBatch.startUs)
                        .put("endPtsUs", mergedBatch.endUs)
                        .put("utteranceCount", mergedBatch.utteranceCount)
                        .put(
                                "audioDurationMs",
                                mergedBatch.samples.length * 1000L / LIVE_SAMPLE_RATE_HZ)
                        .put(
                                "timelineDurationMs",
                                Math.max(0L, mergedBatch.endUs - mergedBatch.startUs) / 1000L)
                        .put("queueDepth", pendingInference.get())
                        .put("finalDropped", false));
            } catch (Exception ignored) {
            }
            return;
        }

        final FinalBatch submittedBatch = batchToSubmit;
        if (submittedBatch == null) return;
        submit("final", () -> runFinalBatch(submittedBatch));
        if (pendingInference.get() > BACKPRESSURE_WARN_DEPTH) {
            logBackpressure("final-batch-queued", endUs);
        }
    }

    private void runFinalBatch(FinalBatch batch) {
        synchronized (finalBatchLock) {
            batch.started = true;
            if (mergeableFinalBatch == batch) {
                mergeableFinalBatch = null;
            }
        }

        SegmentAccumulator accumulator = batch.accumulator;
        if (accumulator.failed) return;
        try {
            Recognition result = recognize(batch.samples, accumulator, false);
            accumulator.addFinal(result, batch.startUs, batch.endUs);
            long speechDurationMs = Math.max(
                    0L, (batch.endUs - batch.startUs) / 1000L);
            long endAtMs = batch.queuedAtMs;
            long startAtMs = Math.max(0L, endAtMs - speechDurationMs);
            FullStreamingStateStore.appendRecentFinal(
                    this,
                    startAtMs,
                    endAtMs,
                    batch.startUs,
                    batch.endUs,
                    result.text,
                    accumulator.config.asrBackend,
                    result.segments);
            writeState("FINAL", "", accumulator.latestFinalText, accumulator, null);
            log("FULL_STREAMING_FINAL", new JSONObject()
                    .put("startPtsUs", batch.startUs)
                    .put("endPtsUs", batch.endUs)
                    .put("textChars", result.text.length())
                    .put("inferenceMs", result.inferenceMs)
                    .put("liveWhisperRoute", accumulator.config.liveWhisperRoute)
                    .put("utteranceCount", batch.utteranceCount)
                    .put(
                            "batchAudioDurationMs",
                            batch.samples.length * 1000L / LIVE_SAMPLE_RATE_HZ)
                    .put("queueDepth", pendingInference.get()));
        } catch (Throwable error) {
            markAccumulatorFailed(accumulator, "FINAL_ASR_FAILED", error);
        }
    }

'''
