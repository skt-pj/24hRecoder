private fun HistoryScreen(
    records: List<SegmentRecord>,
    listState: LazyListState,
    query: String,
    filter: HistoryFilter,
    liveState: FullStreamingStateStore.LiveState?,
    liveFinals: List<FullStreamingStateStore.RecentFinal>,
    onQueryChange: (String) -> Unit,
    onFilterChange: (HistoryFilter) -> Unit,
    onSelect: (SegmentRecord) -> Unit
) {
    val provisionalBySegment = remember(records, liveFinals) {
        records.associate { record ->
            record.segmentId to provisionalConversationText(record, liveFinals)
        }
    }
    val filtered = remember(records, query, filter, provisionalBySegment) {
        records.filter { record ->
            val statusOk = when (filter) {
                HistoryFilter.ALL -> true
                HistoryFilter.TRANSCRIBED -> record.hasTranscript
                HistoryFilter.AUDIO -> record.audioAvailable
                HistoryFilter.ATTENTION -> record.needsAttention
            }
            val provisional = provisionalBySegment[record.segmentId].orEmpty()
            val queryOk = query.isBlank() ||
                record.segmentId.contains(query, true) ||
                record.fileName?.contains(query, true) == true ||
                record.transcriptText?.contains(query, true) == true ||
                provisional.contains(query, true)
            statusOk && queryOk
        }
    }

    val latestKnownEndMs = remember(records) {
        records.maxOfOrNull { it.endedAtMs } ?: 0L
    }
    val currentLiveFinals = remember(liveFinals, latestKnownEndMs) {
        liveFinals.filter { item ->
            latestKnownEndMs <= 0L || item.endAtMs > latestKnownEndMs + 2_500L
        }
    }
    val currentFinalText = remember(currentLiveFinals) {
        liveConversationText(currentLiveFinals)
    }
    val currentPartial = liveState?.partialText.orEmpty().trim()
    val currentSearchText = remember(currentFinalText, currentPartial) {
        listOf(currentFinalText, currentPartial)
            .filter { it.isNotBlank() }
            .joinToString("\\n")
    }
    val showCurrentLive = filter == HistoryFilter.ALL &&
        currentSearchText.isNotBlank() &&
        (query.isBlank() || currentSearchText.contains(query, true))

    Column(Modifier.fillMaxSize()) {
        Column(
            Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
