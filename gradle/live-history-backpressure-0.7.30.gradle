@Composable
private fun ProvisionalRecordConversationCard(
    finals: List<FullStreamingStateStore.RecentFinal>
) {
    Card(
        colors = CardDefaults.cardColors(
            containerColor = MaterialTheme.colorScheme.tertiaryContainer
        )
    ) {
        Column(
            Modifier.padding(18.dp),
            verticalArrangement = Arrangement.spacedBy(10.dp)
        ) {
            Text("会話ログ（暫定）", style = MaterialTheme.typography.titleLarge)
            finals.forEach { item ->
                val time = if (item.startAtMs > 0L) {
                    SimpleDateFormat("HH:mm:ss", Locale.JAPAN).format(Date(item.startAtMs))
                } else {
                    "--:--:--"
                }
                val speaker = item.speaker?.takeIf { it.isNotBlank() && it != "判定不能" }
                Text(
                    if (speaker == null) time else "$time  $speaker",
                    style = MaterialTheme.typography.labelMedium,
                    color = MaterialTheme.colorScheme.onTertiaryContainer
                )
                Text(item.text, style = MaterialTheme.typography.bodyLarge)
            }
            Text(
                "5分確定後はVADを通した確定結果に置き換わります。",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onTertiaryContainer
            )
        }
    }
}

