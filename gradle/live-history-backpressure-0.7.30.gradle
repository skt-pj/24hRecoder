private fun provisionalFinalsForRecord(
    record: SegmentRecord,
    liveFinals: List<FullStreamingStateStore.RecentFinal>
): List<FullStreamingStateStore.RecentFinal> {
    if (record.hasTranscript || !record.liveOwned || record.startedAtMs <= 0L) {
        return emptyList()
    }
    val endMs = if (record.endedAtMs > record.startedAtMs) {
        record.endedAtMs
    } else {
        record.startedAtMs + 5L * 60L * 1000L
    }
    val startWithTolerance = record.startedAtMs - 2_500L
    val endWithTolerance = endMs + 2_500L
    return liveFinals.filter { item ->
        item.endAtMs >= startWithTolerance && item.startAtMs <= endWithTolerance
    }
}

private fun provisionalConversationText(
    record: SegmentRecord,
    liveFinals: List<FullStreamingStateStore.RecentFinal>
): String = liveConversationText(provisionalFinalsForRecord(record, liveFinals))

private fun liveConversationText(
    finals: List<FullStreamingStateStore.RecentFinal>
): String = finals
    .filter { it.text.isNotBlank() }
    .joinToString("\\n") { item ->
        val speaker = item.speaker?.trim().orEmpty()
        if (speaker.isNotBlank() && speaker != "判定不能") {
            "$speaker: ${item.text}"
        } else {
            item.text
        }
    }
    .trim()

@Composable
private fun CurrentConversationCard(finalText: String, partialText: String) {
    Card(
        colors = CardDefaults.cardColors(
            containerColor = MaterialTheme.colorScheme.tertiaryContainer
        )
    ) {
        Column(
            Modifier.padding(16.dp),
            verticalArrangement = Arrangement.spacedBy(7.dp)
        ) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                Text(
                    "現在の会話",
                    style = MaterialTheme.typography.titleMedium,
                    fontWeight = FontWeight.SemiBold,
                    modifier = Modifier.weight(1f)
                )
                Text(
                    "暫定",
                    style = MaterialTheme.typography.labelMedium,
                    color = MaterialTheme.colorScheme.onTertiaryContainer
                )
            }
            if (finalText.isNotBlank()) {
                Text(finalText, style = MaterialTheme.typography.bodyLarge)
            }
            if (partialText.isNotBlank()) {
                Text(
                    partialText,
                    style = MaterialTheme.typography.bodyLarge,
                    color = MaterialTheme.colorScheme.onTertiaryContainer
                )
            }
        }
    }
}

