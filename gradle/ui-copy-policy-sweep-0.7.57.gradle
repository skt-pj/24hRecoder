    '5分後の確定文字起こし、自動文字起こしと「この音声を再文字起こし」で使うモデルです',
    '変更後に開始する文字起こしから選択モデルを使用します',
    '完全ストリーミング中に通常キューを止めたい場合',
    '左の丸で項目を選択',
    '上にある項目ほど優先',
    'テストや再スタート用に',
    'モデル、OpenAI APIキー、AIノート、本人声プロファイル、設定、診断ログは消しません',
    '保存済みの同じ音声・同じWhisperモデル・同じ区間で比較します',
    '操作は不要です。完了後にログも自動同期します',
    'CPU試験が3分を超えた場合'
]
def audited057s = [backendFile057s, whisperFile057s, queueFile057s, resetFile057s, vulkanFile057s]
banned057s.each { phrase ->
    audited057s.each { file ->
        if (readUtf8057s(file).contains(phrase)) {
            throw new GradleException("0.7.57 UI copy sweep violation in ${file.name}: ${phrase}")
        }
    }
}
