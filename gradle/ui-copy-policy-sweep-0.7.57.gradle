import java.nio.charset.StandardCharsets

def readUtf8057s = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8057s = { File file, String text -> file.setText(text, 'UTF-8') }

// Remove the complete Kotlin Text(...) call that contains a known narrative phrase.
// This is intentionally structure-tolerant because older Gradle patches may have changed
// surrounding conditions or indentation before this final UI audit runs.
def removeTextContaining057s = { String source, String phrase ->
    String current = source
    while (true) {
        int phraseIndex = current.indexOf(phrase)
        if (phraseIndex < 0) break
        int textStart = current.lastIndexOf('Text(', phraseIndex)
        if (textStart < 0) break
        int parenStart = current.indexOf('(', textStart)
        if (parenStart < 0 || parenStart > phraseIndex) break

        int depth = 0
        boolean inString = false
        char quote = (char) 0
        boolean escaped = false
        int end = -1
        for (int i = parenStart; i < current.length(); i++) {
            char c = current.charAt(i)
            if (inString) {
                if (escaped) {
                    escaped = false
                } else if (c == '\\') {
                    escaped = true
                } else if (c == quote) {
                    inString = false
                }
                continue
            }
            if (c == '"' || c == '\'') {
                inString = true
                quote = c
            } else if (c == '(') {
                depth++
            } else if (c == ')') {
                depth--
                if (depth == 0) {
                    end = i + 1
                    break
                }
            }
        }
        if (end < 0) break

        int removeStart = current.lastIndexOf('\n', textStart - 1) + 1
        if (!current.substring(removeStart, textStart).trim().isEmpty()) {
            removeStart = textStart
        }
        int removeEnd = end
        while (removeEnd < current.length() && (current.charAt(removeEnd) == ' ' || current.charAt(removeEnd) == '\t')) {
            removeEnd++
        }
        if (removeEnd < current.length() && current.charAt(removeEnd) == '\r') removeEnd++
        if (removeEnd < current.length() && current.charAt(removeEnd) == '\n') removeEnd++
        current = current.substring(0, removeStart) + current.substring(removeEnd)
    }
    current
}

def backendFile057s = rootProject.file('app/src/main/java/com/sktpj/recorder24h/TranscriptionBackendSettingsCard.kt')
def backend057s = readUtf8057s(backendFile057s)
[
    '各処理を明示的に選択します。',
    '録音中は30秒単位の暫定文字起こしだけを表示します。',
    '通常JNIは30秒の暫定窓ごとにモデルをロード・解放します。',
    '録音中PCMは専用ASRプロセスへ渡し、暫定表示は30秒窓で更新します。'
].each { phrase -> backend057s = removeTextContaining057s(backend057s, phrase) }
backend057s = backend057s.replace(
    '前日分を端末のローカル時刻 ${NightlyHourlyTranscriptionScheduler.NIGHT_START_HOUR_LOCAL}:00 以降にまとめて処理し、履歴では1時間単位にまとめます。録音ファイルは安全性のため内部では5分分割のまま保持します。',
    '前日分  •  ${NightlyHourlyTranscriptionScheduler.NIGHT_START_HOUR_LOCAL}:00以降  •  1時間単位'
)
backend057s = backend057s.replace(
    '30秒暫定表示には「Silero ストリーミング」を選択してください。自動変更はしません。',
    '30秒暫定: Silero ストリーミングが必要'
)
writeUtf8057s(backendFile057s, backend057s)

