def newProvisionalRunner072 = '''    private void rememberClosedVadRanges(long[] startsUs, long[] endsUs) {
        if (startsUs == null || endsUs == null) return;
        int count = Math.min(startsUs.length, endsUs.length);
        for (int i = 0; i < count; i++) {
            if (endsUs[i] > startsUs[i]) {
                provisionalClosedRangesUs.add(new long[]{startsUs[i], endsUs[i]});
            }
        }
    }

    private void pruneClosedVadRanges(long cutoffUs) {
        for (int i = provisionalClosedRangesUs.size() - 1; i >= 0; i--) {
            if (provisionalClosedRangesUs.get(i)[1] <= cutoffUs) {
                provisionalClosedRangesUs.remove(i);
            }
        }
    }

    private void accumulateProvisionalVadEvidence(Bundle data) {
        long count = Math.max(0L, data.getLong("vadProbabilityCount", 0L));
        long speechCount = Math.max(0L, data.getLong("vadSpeechProbabilityCount", 0L));
        provisionalVadProbabilitySum += data.getDouble("vadProbabilitySum", 0.0);
        provisionalVadProbabilityCount += count;
        provisionalVadSpeechProbabilitySum += data.getDouble("vadSpeechProbabilitySum", 0.0);
        provisionalVadSpeechProbabilityCount += speechCount;
        provisionalVadMaxSpeechProbability = Math.max(
                provisionalVadMaxSpeechProbability,
                data.getDouble("vadMaxSpeechProbability", 0.0));
    }

    private void resetProvisionalVadEvidence() {
        provisionalVadProbabilitySum = 0.0;
        provisionalVadProbabilityCount = 0L;
        provisionalVadSpeechProbabilitySum = 0.0;
        provisionalVadSpeechProbabilityCount = 0L;
        provisionalVadMaxSpeechProbability = 0.0;
    }

    private List<StreamingVadStore.Range> provisionalVadRanges(
            long windowStartUs, long windowEndUs) {
        List<StreamingVadStore.Range> ranges = new ArrayList<>();
        for (long[] source : provisionalClosedRangesUs) {
            long startUs = Math.max(windowStartUs, source[0]);
            long endUs = Math.min(windowEndUs, source[1]);
            addVadRange(ranges, startUs, endUs, windowStartUs);
        }
        if (latestActiveSpeechStartUs >= 0L && latestActiveSpeechStartUs < windowEndUs) {
            long startUs = Math.max(windowStartUs, latestActiveSpeechStartUs);
            addVadRange(ranges, startUs, windowEndUs, windowStartUs);
        }
        return ranges;
    }

    private static void addVadRange(List<StreamingVadStore.Range> ranges,
                                    long startUs, long endUs, long windowStartUs) {
        if (endUs <= startUs) return;
        long startMs = Math.max(0L, (startUs - windowStartUs) / 1000L);
        long endMs = Math.max(startMs, (endUs - windowStartUs) / 1000L);
        if (endMs <= startMs) return;
        if (!ranges.isEmpty()) {
            StreamingVadStore.Range previous = ranges.get(ranges.size() - 1);
            if (startMs <= previous.endMs) {
                ranges.set(ranges.size() - 1,
                        new StreamingVadStore.Range(previous.startMs, Math.max(previous.endMs, endMs)));
                return;
            }
        }
        ranges.add(new StreamingVadStore.Range(startMs, endMs));
    }

    private StreamingVadStore.Snapshot provisionalVadSnapshot(
            List<StreamingVadStore.Range> ranges) {
        double meanProbability = provisionalVadProbabilityCount > 0L
                ? provisionalVadProbabilitySum / provisionalVadProbabilityCount : 0.0;
        double meanDetectedProbability = provisionalVadSpeechProbabilityCount > 0L
                ? provisionalVadSpeechProbabilitySum / provisionalVadSpeechProbabilityCount : 0.0;
        double aboveThresholdFraction = provisionalVadProbabilityCount > 0L
                ? provisionalVadSpeechProbabilityCount / (double) provisionalVadProbabilityCount : 0.0;
        return new StreamingVadStore.Snapshot(
                true, true, true, "whisper-silero-streaming-reused", 0L,
                ranges, null, meanProbability, meanDetectedProbability,
                provisionalVadMaxSpeechProbability, aboveThresholdFraction);
    }

    private void scheduleProvisionalWindow(long windowStartUs, long windowEndUs,
                                             SegmentAccumulator accumulator) {
        if (windowEndUs <= windowStartUs || accumulator == null || accumulator.failed) return;
        float[] sourceSamples = pcmBuffer.sliceFloat(windowStartUs, windowEndUs);
        if (sourceSamples.length == 0) return;
        List<StreamingVadStore.Range> ranges = provisionalVadRanges(windowStartUs, windowEndUs);
        long windowDurationMs = Math.max(0L, (windowEndUs - windowStartUs) / 1000L);
        SpeechTimeMap.Compaction compacted = SpeechTimeMap.compactSingle(
                sourceSamples, ranges, windowDurationMs);
        StreamingVadStore.Snapshot reusedVad = provisionalVadSnapshot(ranges);
        try {
            log("FULL_STREAMING_PROVISIONAL_VAD_REUSED", new JSONObject()
                    .put("sourceDurationMs", compacted.originalDurationMs)
                    .put("speechInputMs", compacted.speechDurationMs)
                    .put("removedSilenceMs", compacted.removedSilenceMs)
                    .put("vadRangeCount", ranges.size())
                    .put("vadDetectMs", 0L)
                    .put("vadSource", reusedVad.source)
                    .put("vadMeanProbability", reusedVad.meanSpeechProbability)
                    .put("vadMeanDetectedProbability", reusedVad.meanDetectedSpeechProbability)
                    .put("vadMaxProbability", reusedVad.maxSpeechProbability)
                    .put("vadAboveThresholdFraction", reusedVad.aboveThresholdFraction)
                    .put("whisperInvoked", compacted.samples.length > 0)
                    .put("timestampMapRetained", true));
        } catch (Exception ignored) {}
        if (compacted.samples.length == 0) return;

        final long queuedAtMs = System.currentTimeMillis();
        final boolean realtimeOnly = TranscriptionPipelineSettings.MODE_REALTIME_ONLY.equals(
                accumulator.config.snapshot.executionMode);
        submit("provisional-30s", () -> {
            try {
                Recognition result = recognize(
                        compacted.samples, accumulator, !realtimeOnly, compacted.map, reusedVad);
                if (realtimeOnly) {
                    accumulator.addFinal(result, windowStartUs, windowEndUs);
                }
                long endAtMs = queuedAtMs;
                long startAtMs = Math.max(0L, endAtMs - windowDurationMs);
                FullStreamingStateStore.appendRecentFinal(
                        this, startAtMs, endAtMs, windowStartUs, windowEndUs,
                        result.text, accumulator.config.asrBackend, result.segments);
                accumulator.latestFinalText = result.text;
                writeState("FINAL", "", accumulator.latestFinalText, accumulator, null);
                log("FULL_STREAMING_PROVISIONAL_30S", new JSONObject()
                        .put("startPtsUs", windowStartUs)
                        .put("endPtsUs", windowEndUs)
                        .put("windowDurationMs", windowDurationMs)
                        .put("sampleCount", sourceSamples.length)
                        .put("speechSampleCount", compacted.samples.length)
                        .put("textChars", result.text.length())
                        .put("inferenceMs", result.inferenceMs)
                        .put("whisperFullMs", result.whisperFullMs)
                        .put("liveWhisperRoute", accumulator.config.liveWhisperRoute)
                        .put("queueDepth", pendingInference.get())
                        .put("canonical", realtimeOnly)
                        .put("streamingVadReused", true));
            } catch (Throwable error) {
                if (realtimeOnly) {
                    markAccumulatorFailed(accumulator, "REALTIME_ONLY_WINDOW_ASR_FAILED", error);
                } else {
                    writeState("WAITING", "", accumulator.latestFinalText, accumulator, null);
                }
                log("FULL_STREAMING_PROVISIONAL_30S_FAILED", details(
                        "startPtsUs", windowStartUs,
                        "endPtsUs", windowEndUs,
                        "error", error.getClass().getSimpleName(),
                        "message", safeMessage(error),
                        "nightlyCanonicalStillRequired", !realtimeOnly,
                        "automaticFallback", false));
            }
        });
    }

