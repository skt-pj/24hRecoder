// The representative segment is used only to identify which hour was tapped. Everything rendered
// below is recomputed from all records in that hour. Five-minute M4A remains an internal durable
// storage/recovery shard; it no longer truncates the user-facing Record Detail.
def hourDetail = '''@Composable
private fun HourRecordDetailScreen(
    representative: SegmentRecord,
    records: List<SegmentRecord>,
    liveFinals: List<FullStreamingStateStore.RecentFinal>
) {
    val hourStart = hourStartMs(representative.sortTimeMs)
    val hourEnd = hourStart + 60L * 60L * 1000L
    val hourRecords = remember(records, hourStart) {
        records
            .filter { it.sortTimeMs >= hourStart && it.sortTimeMs < hourEnd }
            .sortedBy { it.sortTimeMs }
    }
    val canonicalIntervals = remember(hourRecords) {
        hourRecords.filter { it.hasTranscript }.map { record ->
            val start = record.startedAtMs
            val end = if (record.endedAtMs > start) record.endedAtMs
                else start + 5L * 60L * 1000L
            start to end
        }
    }
    val provisionalByRecord = remember(hourRecords, liveFinals) {
        hourRecords.associate { record ->
            record.segmentId to provisionalFinalsForRecord(record, liveFinals)
        }
    }
    val assignedProvisionalIds = remember(provisionalByRecord) {
        provisionalByRecord.values.flatten().map { it.id }.toSet()
    }
    val trailingProvisional = remember(liveFinals, hourStart, hourEnd, canonicalIntervals, assignedProvisionalIds) {
        liveFinals.filter { item ->
            item.id !in assignedProvisionalIds &&
                item.endAtMs > hourStart && item.startAtMs < hourEnd &&
                canonicalIntervals.none { (start, end) ->
                    item.endAtMs > start - 2_500L && item.startAtMs < end + 2_500L
                }
        }
    }
    val audioRecords = remember(hourRecords) {
        hourRecords.filter { it.audioAvailable && it.audioPath != null }
    }
    val canonicalCount = hourRecords.count { it.hasTranscript }
    val corruptCount = hourRecords.count { it.status == "CORRUPT" }
    val hasConversation = hourRecords.any { it.hasTranscript } ||
        provisionalByRecord.values.any { it.isNotEmpty() } || trailingProvisional.isNotEmpty()

    LazyColumn(
        Modifier.fillMaxSize(),
        contentPadding = PaddingValues(20.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        item {
            Card(
                colors = CardDefaults.cardColors(
                    containerColor = MaterialTheme.colorScheme.primaryContainer
                )
            ) {
                Column(
                    Modifier.padding(20.dp),
                    verticalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    Text(formatHourRange(hourStart), style = MaterialTheme.typography.headlineMedium)
                    Text(
                        formatDay(hourStart),
                        color = MaterialTheme.colorScheme.onPrimaryContainer.copy(alpha = 0.75f)
                    )
                    Text(
                        "この画面は1時間分の記録です。5分M4Aは内部の保存・復旧単位として扱います。",
                        style = MaterialTheme.typography.bodyMedium,
                        color = MaterialTheme.colorScheme.onPrimaryContainer
                    )
                }
            }
        }

        item {
            Card {
                Column(
                    Modifier.padding(18.dp),
                    verticalArrangement = Arrangement.spacedBy(12.dp)
                ) {
                    Text("会話ログ（1時間）", style = MaterialTheme.typography.titleLarge)
                    if (!hasConversation) {
                        Text(
                            if (corruptCount > 0) "この1時間には確認できない録音区間があります。"
                            else "この1時間の確定文字起こしは夜間処理待ちです。",
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }

                    hourRecords.forEach { record ->
                        when {
                            record.hasTranscript && record.transcriptChunks.isNotEmpty() -> {
                                record.transcriptChunks.forEach { chunk ->
                                    EditableTranscriptChunk(
                                        record = record,
                                        chunk = chunk,
                                        timeLabel = transcriptChunkTimeLabel(record, chunk.startMs, chunk.endMs)
                                    )
                                }
                            }
                            record.hasTranscript && record.transcriptText != null -> {
                                Text(
                                    formatTimeRange(record),
                                    style = MaterialTheme.typography.labelLarge,
                                    color = MaterialTheme.colorScheme.primary
                                )
                                EditableWholeTranscript(record)
                            }
                            else -> {
                                provisionalByRecord[record.segmentId].orEmpty().forEach { item ->
                                    EditableLiveSegmentedFinalCard(item)
                                }
                            }
                        }
                    }
                    trailingProvisional.forEach { item ->
                        EditableLiveSegmentedFinalCard(item)
                    }
                }
            }
        }

        if (audioRecords.isNotEmpty()) {
            item {
                Text(
                    "録音データ（1時間）",
                    style = MaterialTheme.typography.titleLarge
                )
            }
            audioRecords.forEach { record ->
                item(key = "hour-audio-${record.segmentId}") {
                    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                        Text(formatTimeRange(record), style = MaterialTheme.typography.labelLarge)
                        AudioPlaybackCard(record)
                    }
                }
            }
        }

        item {
            Card {
                Column(
                    Modifier.padding(18.dp),
                    verticalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    Text("1時間の状態", style = MaterialTheme.typography.titleLarge)
                    InfoRow("範囲", formatHourRange(hourStart))
                    InfoRow("内部保存", "${hourRecords.size}区間")
                    InfoRow("確定", "${canonicalCount}区間")
                    InfoRow("音声あり", "${audioRecords.size}区間")
                    if (corruptCount > 0) InfoRow("破損", "${corruptCount}区間")
                }
            }
        }
    }
}

'''
