def openAiHourlyPrompt055 = $/    private static String buildHourlyPrompt(AiAnalysisRepository.SourceWindow source) {
        return "Analyze the following one-hour transcript window.\n" +
                "The output MUST be JSON and MUST follow this JSON format exactly:\n" +
                "{\"summary\":string,\"chapters\":[{\"startTime\":string,\"endTime\":string,\"title\":string,\"summary\":string}]," +
                "\"mindMap\":[{\"id\":string,\"label\":string,\"parentId\":string,\"type\":string,\"importance\":string,\"detail\":string,\"evidence\":string,\"collapsedByDefault\":boolean}]," +
                "\"mindMapLinks\":[{\"id\":string,\"fromId\":string,\"toId\":string,\"label\":string}]," +
                "\"topics\":[string],\"keyEvents\":[{\"time\":string,\"event\":string}]," +
                "\"ideas\":[string],\"decisions\":[string],\"todos\":[{\"task\":string,\"evidence\":string}]," +
                "\"people\":[string],\"places\":[string],\"notableQuotes\":[{\"time\":string,\"text\":string}]," +
                "\"unresolved\":[string]}\n" +
                "For a content-rich hour, keep summary to 2-3 sentences. Normally keep at most 5 topics, 4 key events, 3 decisions, 5 TODOs, 3 ideas, and 3 unresolved items. " +
                "Create at most 4 chapters only when the conversation meaningfully changes topic or goal; each chapter needs a short title and one-sentence summary with evidence-backed times. " +
                "For mindMap, use exactly one root whose label names the actual central theme of the hour, normally 3-5 main branches, and at most 12 nodes total. Node labels must be short concepts, not copied paragraphs. " +
                "For every mindMap node, type must be one of theme,topic,decision,action,question,idea,person,place,detail; importance must be high,medium,or low; detail is at most one concise sentence; evidence must be a transcript timestamp or timestamp range when supported, otherwise an empty string. " +
                "Set collapsedByDefault true for low-importance or deep supporting detail and false for the root and core branches. " +
                "Use mindMapLinks only for meaningful relationships that cannot be represented by parentId, at most 3 links, and never add decorative or speculative links. " +
                "People, places, and quotes should be empty unless they materially help explain what happened. Keep at most 2 quotes. If there is no meaningful content, say so plainly without inventing significance. " +
                "For quotes, only copy wording that is actually present in the transcript.\n\n" +
                "TRANSCRIPT:\n" + AiAnalysisRepository.promptTranscript(source);
    }
/$
luna055 = replaceBlock055(
