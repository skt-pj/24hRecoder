import java.nio.charset.StandardCharsets

def readUtf8055 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8055 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce055 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.55 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}
def replaceCount055 = { String source, String oldText, String newText, int count, String label ->
    int actual = 0
    int cursor = 0
    while (true) {
        int found = source.indexOf(oldText, cursor)
        if (found < 0) break
        actual++
        cursor = found + oldText.length()
    }
    if (actual != count) {
        throw new GradleException("0.7.55 ${label}: expected ${count} matches, found ${actual}")
    }
    source.replace(oldText, newText)
}
def replaceBlock055 = { String source, String startMarker, String endMarker, String replacement, String label ->
    int start = source.indexOf(startMarker)
    if (start < 0 || source.lastIndexOf(startMarker) != start) {
        throw new GradleException("0.7.55 ${label}: start marker missing or ambiguous")
    }
    int end = source.indexOf(endMarker, start + startMarker.length())
    if (end < 0) {
        throw new GradleException("0.7.55 ${label}: end marker missing")
    }
    source.substring(0, start) + replacement + source.substring(end)
}

// Mind Elixir本体はビルド時に5.14.0を固定取得し、APK assetsへ同梱する。
// 実行時にCDNや外部ページへ接続しない。
dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}

def mindElixirGeneratedAssets055 = layout.buildDirectory.dir('generated/mind-elixir-0.7.55/assets')
android {
    sourceSets {
        main.assets.srcDir(mindElixirGeneratedAssets055)
    }
}

def downloadPinnedMindElixir055 = { String url, File target ->
    target.parentFile.mkdirs()
    def connection = new URI(url).toURL().openConnection()
    connection.setConnectTimeout(30_000)
    connection.setReadTimeout(60_000)
    connection.setRequestProperty('User-Agent', '24hRecoder-build/0.7.55')
    connection.inputStream.withCloseable { input ->
        target.withOutputStream { output -> input.transferTo(output) }
    }
    if (!target.isFile() || target.length() < 100L) {
        throw new GradleException("0.7.55 Mind Elixir asset download failed: ${target.name}")
    }
}

def prepareMindElixirAssets055 = tasks.register('prepareMindElixirAssets055') {
    outputs.dir(mindElixirGeneratedAssets055)
    doLast {
        File root = mindElixirGeneratedAssets055.get().dir('mindmap').asFile
        File js = new File(root, 'MindElixir.js')
        File css = new File(root, 'style.css')
        downloadPinnedMindElixir055(
                'https://cdn.jsdelivr.net/npm/mind-elixir@5.14.0/dist/MindElixir.js', js)
        downloadPinnedMindElixir055(
                'https://cdn.jsdelivr.net/npm/mind-elixir@5.14.0/dist/style.css', css)
        if (!js.getText('UTF-8').contains('MindElixir')) {
            throw new GradleException('0.7.55 downloaded MindElixir.js is invalid')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets') {
        task.dependsOn(prepareMindElixirAssets055)
    }
}

