private fun notebookHasRetranscribableAudio(
    records: List<SegmentRecord>,
    periodStartMs: Long,
    periodEndMs: Long
): Boolean {
    for (record in records) {
        if (!notebookRecordOverlaps(record, periodStartMs, periodEndMs)) continue
        if (record.status == "CORRUPT") continue
        if (!record.audioAvailable) continue
        if (record.transcriptText?.trim().orEmpty().isNotEmpty()) continue
        val audioPath = record.audioPath
        if (audioPath.isNullOrBlank()) continue
        if (File(audioPath).isFile) return true
    }
    return false
}

private fun enqueueNotebookRetranscription(
    context: Context,
    periodStartMs: Long,
    periodEndMs: Long
): Int {
    var queued = 0
    for (record in SegmentHistoryRepository.load(context)) {
        if (!notebookRecordOverlaps(record, periodStartMs, periodEndMs)) continue
        if (record.status == "CORRUPT") continue
        if (!record.audioAvailable) continue
        if (record.transcriptText?.trim().orEmpty().isNotEmpty()) continue
        val audioPath = record.audioPath
        if (audioPath.isNullOrBlank()) continue
        val audioFile = File(audioPath)
        if (!audioFile.isFile) continue
        if (TranscriptionScheduler.enqueueForceRetranscription(
                context,
                record.segmentId,
                audioFile
            )) {
            queued++
        }
    }
    return queued
}

