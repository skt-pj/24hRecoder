import java.nio.charset.StandardCharsets

def readUtf8071 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8071 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce071 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.71 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

