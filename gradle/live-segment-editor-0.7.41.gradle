'''    private static boolean mutateRecentFinalSegment(Context context, String entryId,
                                                    int segmentIndex,
                                                    String manualText, String manualSpeaker,
                                                    boolean delete,
                                                    String segmentId, long segmentStartedAtMs,
                                                    long segmentEndedAtMs) {
        if (entryId == null || entryId.isEmpty() || segmentIndex < 0) return false;
        synchronized (LOCK) {
            try {
                JSONObject root = readRecentRoot(context);
                JSONArray entries = root.optJSONArray("entries");
                if (entries == null) return false;
                JSONObject target = null;
                for (int i = 0; i < entries.length(); i++) {
                    JSONObject row = entries.optJSONObject(i);
                    if (row != null && entryId.equals(row.optString("id", ""))) {
                        target = row;
                        break;
                    }
                }
                if (target == null) return false;
                JSONArray segments = target.optJSONArray("segments");
                if (segments == null || segmentIndex >= segments.length()) return false;
                JSONObject targetSegment = segments.optJSONObject(segmentIndex);
                if (targetSegment == null) return false;

                if (segmentId != null && !segmentId.trim().isEmpty() && segmentStartedAtMs > 0L) {
                    bindEntryToTranscript(context, target, segmentId, segmentStartedAtMs);
                }
                if (manualText != null) targetSegment.put("manualText", manualText);
                if (manualSpeaker != null) targetSegment.put("manualSpeaker", manualSpeaker);
                if (delete) targetSegment.put("deleted", true);
                targetSegment.put("updatedAtMs", System.currentTimeMillis());
                target.put("updatedAtMs", System.currentTimeMillis());
                root.put("schemaVersion", 3);
                root.put("updatedAtMs", System.currentTimeMillis());
                writeAtomic(recentFile(context), root.toString());
                applyEntryEdits(context, target);
                return true;
            } catch (Exception ignored) {
                return false;
            }
        }
    }

    private static boolean bindEntryToTranscript(Context context, JSONObject entry,
