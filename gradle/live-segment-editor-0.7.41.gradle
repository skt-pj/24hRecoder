'''    private static List<RecentFinalSegment> recentSegments(JSONObject entry) {
        List<RecentFinalSegment> out = new ArrayList<>();
        JSONArray segments = entry.optJSONArray("segments");
        if (segments == null) return out;
        for (int i = 0; i < segments.length(); i++) {
            JSONObject row = segments.optJSONObject(i);
            if (row == null || row.optBoolean("deleted", false)) continue;
            String text = row.isNull("manualText")
                    ? row.optString("text", "") : row.optString("manualText", "");
            if (text.trim().isEmpty()) continue;
            String speaker = row.isNull("manualSpeaker")
                    ? canonicalSpeaker(row)
                    : row.optString("manualSpeaker", "判定不能").trim();
            long startMs = Math.max(0L, row.optLong("startMs", 0L));
            long endMs = Math.max(startMs, row.optLong("endMs", startMs));
            out.add(new RecentFinalSegment(i, startMs, endMs, text.trim(), speaker));
        }
        return out;
    }

    private static boolean hasSegmentOverrides(JSONObject entry) {
        JSONArray segments = entry.optJSONArray("segments");
        if (segments == null) return false;
        for (int i = 0; i < segments.length(); i++) {
            JSONObject row = segments.optJSONObject(i);
            if (row == null) continue;
            if (row.optBoolean("deleted", false)
                    || !row.isNull("manualText")
                    || !row.isNull("manualSpeaker")) return true;
        }
        return false;
    }

    private static String joinRecentSegmentText(List<RecentFinalSegment> segments) {
        StringBuilder out = new StringBuilder();
        for (RecentFinalSegment segment : segments) {
            if (segment.text == null || segment.text.trim().isEmpty()) continue;
            if (out.length() > 0) out.append(' ');
            out.append(segment.text.trim());
        }
        return out.toString().trim();
    }

    private static String commonRecentSegmentSpeaker(List<RecentFinalSegment> segments) {
        String common = null;
        for (RecentFinalSegment segment : segments) {
            String speaker = segment.speaker == null ? "判定不能" : segment.speaker.trim();
            if (common == null) common = speaker;
            else if (!common.equals(speaker)) return "複数話者";
        }
        return common;
    }

    private static JSONObject editedRecentSegmentForBinding(JSONObject entry, JSONObject binding) {
        JSONArray segments = entry.optJSONArray("segments");
        if (segments == null) return null;
        long entryStartAtMs = entry.optLong("startAtMs", 0L);
        long canonicalSegmentStartAtMs = entry.optLong("segmentStartedAtMs", 0L);
        if (entryStartAtMs <= 0L || canonicalSegmentStartAtMs <= 0L) return null;

        long bindingStart = canonicalSegmentStartAtMs + Math.max(0L, binding.optLong("startMs", 0L));
        long bindingEnd = canonicalSegmentStartAtMs + Math.max(
                binding.optLong("startMs", 0L), binding.optLong("endMs", 0L));
        long bindingCenter = (bindingStart + bindingEnd) / 2L;
        JSONObject best = null;
        long bestDistance = Long.MAX_VALUE;
        boolean bestOverlap = false;
        for (int i = 0; i < segments.length(); i++) {
            JSONObject row = segments.optJSONObject(i);
            if (row == null) continue;
            boolean edited = row.optBoolean("deleted", false)
                    || !row.isNull("manualText")
                    || !row.isNull("manualSpeaker");
            if (!edited) continue;
            long localStart = Math.max(0L, row.optLong("startMs", 0L));
            long localEnd = Math.max(localStart, row.optLong("endMs", localStart));
            long absoluteStart = entryStartAtMs + localStart;
            long absoluteEnd = entryStartAtMs + localEnd;
            boolean overlap = overlaps(absoluteStart, absoluteEnd, bindingStart, bindingEnd);
            long center = (absoluteStart + absoluteEnd) / 2L;
            long distance = Math.abs(center - bindingCenter);
            if ((overlap && !bestOverlap)
                    || (overlap == bestOverlap && distance < bestDistance)) {
                best = row;
                bestDistance = distance;
                bestOverlap = overlap;
            }
        }
        if (best == null) return null;
        return bestOverlap || bestDistance <= BIND_TOLERANCE_MS ? best : null;
    }

