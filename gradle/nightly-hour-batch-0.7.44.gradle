def newTranscriptionQueueTab044 = '''@Composable
private fun TranscriptionQueueTab(
    records: List<SegmentRecord>,
    onSelect: (SegmentRecord) -> Unit,
    onRemove: (SegmentRecord) -> Unit
) {
    val context = LocalContext.current
    val scope = rememberCoroutineScope()
    var queuePaused by remember { mutableStateOf(TranscriptionScheduler.isQueuePaused(context)) }
    var selectedPriorityId by remember { mutableStateOf<String?>(null) }
    var priorityRevision by remember { mutableIntStateOf(0) }
    val groups = remember(records, priorityRevision) { buildTranscriptionQueueGroups(records) }

    LaunchedEffect(groups) {
        if (selectedPriorityId != null && groups.none { it.id == selectedPriorityId }) {
            selectedPriorityId = null
        }
    }
    LaunchedEffect(Unit) {
        while (true) {
            queuePaused = withContext(Dispatchers.IO) { TranscriptionScheduler.isQueuePaused(context) }
            delay(500L)
        }
    }

    TranscriptionQueuePauseControls(
        paused = queuePaused,
        onToggle = {
            val next = !queuePaused
            queuePaused = next
            scope.launch(Dispatchers.IO) {
                TranscriptionScheduler.setQueuePaused(context, next)
            }
        }
    )

    if (groups.isEmpty()) {
        EmptyQueue("文字起こしキューは空です")
        return
    }

    val selectedIndex = groups.indexOfFirst { it.id == selectedPriorityId }
    val selectedGroup = groups.getOrNull(selectedIndex)
    val canMoveUp = selectedGroup != null && !selectedGroup.active &&
        selectedIndex > 0 && !groups[selectedIndex - 1].active
    val canMoveDown = selectedGroup != null && !selectedGroup.active &&
        selectedIndex >= 0 && selectedIndex + 1 < groups.size && !groups[selectedIndex + 1].active

    Column(Modifier.fillMaxSize()) {
        PriorityControls(
            selected = selectedGroup != null,
            canMoveUp = canMoveUp,
            canMoveDown = canMoveDown,
            onMoveUp = {
                val reordered = swapQueueGroup(groups, selectedIndex, selectedIndex - 1)
                if (TranscriptionPriorityController.applyOrder(
                        context,
                        flattenQueueGroupIds(reordered)
                    )
                ) {
                    priorityRevision++
                }
            },
            onMoveDown = {
                val reordered = swapQueueGroup(groups, selectedIndex, selectedIndex + 1)
                if (TranscriptionPriorityController.applyOrder(
                        context,
                        flattenQueueGroupIds(reordered)
                    )
                ) {
                    priorityRevision++
                }
            }
        )

        LazyColumn(
            Modifier.fillMaxSize(),
            contentPadding = PaddingValues(vertical = 4.dp)
        ) {
            itemsIndexed(groups, key = { _, item -> item.id }) { index, group ->
                TranscriptionQueueGroupRow(
                    group = group,
                    priority = index + 1,
                    selectedForPriority = group.id == selectedPriorityId,
                    onPrioritySelect = {
                        if (!group.active) {
                            selectedPriorityId = if (selectedPriorityId == group.id) null else group.id
                        }
                    },
                    onOpen = { onSelect(group.representative) },
                    onRemove = {
                        if (group.nightlyHour) {
                            var removed = 0
                            group.records.forEach { record ->
                                val file = record.audioPath?.let { java.io.File(it) }
                                if (TranscriptionScheduler.removeFromQueue(context, record.segmentId, file)) removed++
                            }
                            android.widget.Toast.makeText(
                                context,
                                "1時間バッチをキューから削除しました（${removed}件の保存音声は保持）",
                                android.widget.Toast.LENGTH_SHORT
                            ).show()
                        } else {
                            onRemove(group.representative)
                        }
                    }
                )
                HorizontalDivider()
            }
        }
    }
}

private data class TranscriptionQueueGroup(
    val id: String,
    val records: List<SegmentRecord>,
    val nightlyHour: Boolean,
    val hourStartMs: Long
) {
    val representative: SegmentRecord
        get() = records.firstOrNull { it.status == "TRANSCRIBING" } ?: records.first()
    val active: Boolean
        get() = records.any { it.status == "TRANSCRIBING" }
    val queueAtMs: Long
        get() = records.minOf { queueTimestamp(it) }
}

private fun buildTranscriptionQueueGroups(records: List<SegmentRecord>): List<TranscriptionQueueGroup> {
    val queued = records.filter {
        it.status == "QUEUED" || it.status == "RETRY_WAIT" || it.status == "TRANSCRIBING"
    }
    val hourly = linkedMapOf<Long, MutableList<SegmentRecord>>()
    val standalone = mutableListOf<TranscriptionQueueGroup>()
    queued.forEach { record ->
        if (record.reason?.startsWith("NIGHTLY_HOURLY_") == true) {
            val hourStart = localHourStart(record)
            hourly.getOrPut(hourStart) { mutableListOf() }.add(record)
        } else {
            standalone += TranscriptionQueueGroup(
                id = "segment:${record.segmentId}",
                records = listOf(record),
                nightlyHour = false,
                hourStartMs = 0L
            )
        }
    }
    val groups = mutableListOf<TranscriptionQueueGroup>()
    hourly.forEach { (hourStart, hourRecords) ->
        groups += TranscriptionQueueGroup(
            id = "night-hour:$hourStart",
            records = hourRecords.sortedBy { queueTimestamp(it) },
            nightlyHour = true,
            hourStartMs = hourStart
        )
    }
    groups += standalone
    return groups.sortedWith(
        compareBy<TranscriptionQueueGroup> { if (it.active) 0 else 1 }
            .thenBy { it.queueAtMs }
    )
}

private fun localHourStart(record: SegmentRecord): Long {
    val source = when {
        record.sortTimeMs > 0L -> record.sortTimeMs
        record.startedAtMs > 0L -> record.startedAtMs
        else -> record.stateChangedAtMs
    }
    return Calendar.getInstance().apply {
        timeInMillis = source
        set(Calendar.MINUTE, 0)
        set(Calendar.SECOND, 0)
        set(Calendar.MILLISECOND, 0)
    }.timeInMillis
}

private fun queueTimestamp(record: SegmentRecord): Long =
    if (record.queueEnqueuedAtMs > 0L) record.queueEnqueuedAtMs else record.stateChangedAtMs

private fun swapQueueGroup(
    source: List<TranscriptionQueueGroup>,
    first: Int,
    second: Int
): List<TranscriptionQueueGroup> {
    if (first !in source.indices || second !in source.indices) return source
    val mutable = source.toMutableList()
    val value = mutable[first]
    mutable[first] = mutable[second]
    mutable[second] = value
    return mutable
}

private fun flattenQueueGroupIds(groups: List<TranscriptionQueueGroup>): List<String> =
    groups.flatMap { group -> group.records.sortedBy { queueTimestamp(it) }.map { it.segmentId } }

