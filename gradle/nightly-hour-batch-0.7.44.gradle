def newEnqueuePreviousDayBatches044 = '''    static int enqueuePreviousDayBatches(Context context) {
        Context app = context.getApplicationContext();
        long todayStartMs = startOfLocalDay(System.currentTimeMillis());
        List<SegmentRecord> eligible = new ArrayList<>();
        for (SegmentRecord record : SegmentHistoryRepository.load(app)) {
            if (!record.getAudioAvailable() || record.getHasTranscript()) continue;
            if (record.getSortTimeMs() <= 0L || record.getSortTimeMs() >= todayStartMs) continue;
            if (record.getStatus().equals("CORRUPT")) continue;
            if ("QUEUED".equals(record.getStatus()) || "RETRY_WAIT".equals(record.getStatus())
                    || "TRANSCRIBING".equals(record.getStatus())) continue;
            String reason = record.getReason();
            if (reason != null && reason.startsWith("MANUAL_")) continue;
            eligible.add(record);
        }
        eligible.sort(Comparator.comparingLong(SegmentRecord::getSortTimeMs));

        String modelId = WhisperModelManager.selectedModelId(app);
        TranscriptionPipelineSettings.Snapshot pipeline = TranscriptionPipelineSettings.snapshot(app);
        String pipelineReason = TranscriptionPipelineSettings.unavailableReason(app, pipeline, modelId);
        if (pipelineReason != null) {
            if ("SILERO_VAD_MODEL_MISSING".equals(pipelineReason)
                    || "LOCAL_WHISPER_MODEL_MISSING".equals(pipelineReason)) {
                WhisperModelManager.enqueueModelDownload(app, modelId);
            }
            try {
                AppLogger.event(app, "NIGHTLY_HOUR_BATCH_PIPELINE_NOT_READY", new JSONObject()
                        .put("eligibleSegmentCount", eligible.size())
                        .put("reason", pipelineReason)
                        .put("batchUnitMinutes", 60)
                        .put("storageSegmentMinutes", 5));
            } catch (Exception ignored) {}
            return 0;
        }

        Map<String, List<SegmentRecord>> hours = new LinkedHashMap<>();
        for (SegmentRecord record : eligible) {
            String hourKey = localHourKey(record.getSortTimeMs());
            hours.computeIfAbsent(hourKey, ignored -> new ArrayList<>()).add(record);
        }

        long baseQueueAt = System.currentTimeMillis();
        int batchCount = 0;
        int segmentCount = 0;
        int hourOrder = 0;
        JSONArray hourSummary = new JSONArray();
        for (Map.Entry<String, List<SegmentRecord>> entry : hours.entrySet()) {
            String hourKey = entry.getKey();
            List<SegmentRecord> hourRecords = entry.getValue();
            hourRecords.sort(Comparator.comparingLong(SegmentRecord::getSortTimeMs));
            int queuedInHour = 0;
            long hourQueueAt = baseQueueAt + (hourOrder * 10_000L);
            for (SegmentRecord record : hourRecords) {
                String audioPath = record.getAudioPath();
                File audio = audioPath == null ? null : new File(audioPath);
                if (audio == null || !audio.isFile()) continue;
                SegmentRepository.appendWithoutNotify(
                        app,
                        record.getSegmentId(),
                        audio,
                        record.getStartedAtMs(),
                        hourQueueAt + queuedInHour,
                        "QUEUED",
                        batchReason(hourKey));
                queuedInHour++;
                segmentCount++;
            }
            if (queuedInHour <= 0) continue;
            batchCount++;
            hourOrder++;
            try {
                AppLogger.event(app, "NIGHTLY_HOUR_BATCH_ENQUEUED", new JSONObject()
                        .put("hour", hourKey)
                        .put("segmentCount", queuedInHour)
                        .put("batchUnitMinutes", 60)
                        .put("storageSegmentMinutes", 5)
                        .put("requiresCharging", true));
            } catch (Exception ignored) {}
            hourSummary.put(new JSONObject()
                    .put("hour", hourKey)
                    .put("segmentCount", queuedInHour));
        }

        if (segmentCount > 0) {
            // Exactly one generic drain is needed. The drain worker owns an entire hourly batch
            // before requesting a continuation for the next hour.
            TranscriptionScheduler.ensureDrainScheduled(app);
        }
        try {
            AppLogger.event(app, "NIGHTLY_HOURLY_BATCH_ENQUEUED", new JSONObject()
                    .put("eligibleSegmentCount", eligible.size())
                    .put("enqueuedSegmentCount", segmentCount)
                    .put("hourBatchCount", batchCount)
                    .put("hours", hourSummary)
                    .put("batchUnitMinutes", 60)
                    .put("storageSegmentMinutes", 5)
                    .put("automaticCpuFallback", false)
                    .put("requiresCharging", true));
        } catch (Exception ignored) {}
        return batchCount;
    }

