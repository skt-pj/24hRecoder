private fun formatNightlyHourBatch(hourStartMs: Long): String {
    val start = Calendar.getInstance().apply { timeInMillis = hourStartMs }
    val end = Calendar.getInstance().apply {
        timeInMillis = hourStartMs
        add(Calendar.HOUR_OF_DAY, 1)
    }
    val startLabel = SimpleDateFormat("M/d HH:mm", Locale.JAPAN).format(Date(start.timeInMillis))
    val endLabel = SimpleDateFormat("HH:mm", Locale.JAPAN).format(Date(end.timeInMillis))
    return "$startLabel–$endLabel"
}

