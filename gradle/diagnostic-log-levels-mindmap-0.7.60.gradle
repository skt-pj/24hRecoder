def webViewBlock060 = '''@SuppressLint("SetJavaScriptEnabled")
@Composable
private fun MindElixirWebView(
    payload: String,
    background: Color,
    modifier: Modifier = Modifier
) {
    AndroidView(
        modifier = modifier,
        factory = { context ->
            val appContext = context.applicationContext
            val assetLoader = WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(context))
                .build()
            WebView(context).apply {
                setBackgroundColor(background.toArgb())
                isVerticalScrollBarEnabled = false
                isHorizontalScrollBarEnabled = false
                overScrollMode = WebView.OVER_SCROLL_NEVER
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = false
                settings.allowFileAccess = false
                settings.allowContentAccess = false
                settings.builtInZoomControls = false
                settings.displayZoomControls = false
                settings.setSupportZoom(false)
                settings.mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                addJavascriptInterface(MindMapDiagnosticsBridge(appContext), "AndroidMindMapDiagnostics")
                webChromeClient = object : WebChromeClient() {
                    override fun onConsoleMessage(message: ConsoleMessage): Boolean {
                        AppLogger.diagnostic(
                            appContext,
                            "MINDMAP_WEB_CONSOLE",
                            JSONObject()
                                .put("level", message.messageLevel().name)
                                .put("line", message.lineNumber())
                                .put("source", message.sourceId().substringAfterLast('/').take(80))
                                .put("message", message.message().take(240))
                        )
                        return true
                    }
                }
                webViewClient = object : WebViewClient() {
                    override fun shouldInterceptRequest(
                        view: WebView,
                        request: WebResourceRequest
                    ): WebResourceResponse? {
                        AppLogger.diagnostic(
                            appContext,
                            "MINDMAP_WEB_ASSET_REQUEST",
                            JSONObject().put("path", request.url.path ?: "")
                        )
                        return assetLoader.shouldInterceptRequest(request.url)
                    }

                    override fun shouldOverrideUrlLoading(
                        view: WebView,
                        request: WebResourceRequest
                    ): Boolean = request.url.host != "appassets.androidplatform.net"

                    override fun onPageStarted(view: WebView, url: String, favicon: android.graphics.Bitmap?) {
                        super.onPageStarted(view, url, favicon)
                        AppLogger.diagnostic(
                            appContext,
                            "MINDMAP_WEB_PAGE_STARTED",
                            JSONObject().put("url", url.substringAfter("appassets.androidplatform.net"))
                        )
                    }

                    override fun onPageFinished(view: WebView, url: String) {
                        super.onPageFinished(view, url)
                        AppLogger.diagnostic(
                            appContext,
                            "MINDMAP_WEB_PAGE_FINISHED",
                            JSONObject().put("url", url.substringAfter("appassets.androidplatform.net"))
                        )
                        (view.tag as? String)?.let { renderMindMap(view, it) }
                    }

                    override fun onReceivedError(
                        view: WebView,
                        request: WebResourceRequest,
                        error: WebResourceError
                    ) {
                        super.onReceivedError(view, request, error)
                        AppLogger.event(
                            appContext,
                            "MINDMAP_WEB_RESOURCE_ERROR",
                            JSONObject()
                                .put("mainFrame", request.isForMainFrame)
                                .put("code", error.errorCode)
                                .put("path", request.url.path ?: "")
                                .put("description", error.description?.toString()?.take(160) ?: "")
                        )
                    }
                }
                setOnTouchListener { view, event ->
                    view.parent?.requestDisallowInterceptTouchEvent(event.pointerCount > 0)
                    false
                }
                tag = payload
                AppLogger.diagnostic(
                    appContext,
                    "MINDMAP_WEBVIEW_CREATED",
                    JSONObject()
                        .put("webViewVersion", WebView.getCurrentWebViewPackage()?.versionName ?: "unknown")
                        .put("payloadChars", payload.length)
                )
                loadUrl(MIND_ELIXIR_ASSET_URL)
            }
        },
        update = { webView ->
            webView.tag = payload
            webView.setBackgroundColor(background.toArgb())
            renderMindMap(webView, payload)
        },
        onRelease = { webView ->
            AppLogger.diagnostic(webView.context.applicationContext, "MINDMAP_WEBVIEW_RELEASED")
            webView.removeJavascriptInterface("AndroidMindMapDiagnostics")
            webView.stopLoading()
            webView.destroy()
        }
    )
}

private class MindMapDiagnosticsBridge(private val context: Context) {
    @JavascriptInterface
    fun ready(version: String?) {
        AppLogger.diagnostic(
            context,
            "MINDMAP_JS_READY",
            JSONObject().put("mindElixirVersion", version ?: "unknown")
        )
    }

    @JavascriptInterface
    fun rendered(nodeCount: Int, width: Int, height: Int) {
        AppLogger.diagnostic(
            context,
            "MINDMAP_RENDERED",
            JSONObject()
                .put("domNodeCount", nodeCount)
                .put("width", width)
                .put("height", height)
        )
    }

    @JavascriptInterface
    fun error(stage: String?, message: String?) {
        AppLogger.event(
            context,
            "MINDMAP_JS_ERROR",
            JSONObject()
                .put("stage", stage?.take(80) ?: "unknown")
                .put("message", message?.take(240) ?: "")
        )
    }
}

private fun renderMindMap(webView: WebView, payload: String) {
    val appContext = webView.context.applicationContext
    val quoted = JSONObject.quote(payload)
    AppLogger.diagnostic(
        appContext,
        "MINDMAP_RENDER_REQUESTED",
        JSONObject().put("payloadChars", payload.length)
    )
    webView.evaluateJavascript(
        "(function(){try{if(typeof window.renderMindMap !== 'function')return 'NO_RENDER_FUNCTION';window.renderMindMap(JSON.parse($quoted));return 'CALLED';}catch(e){return 'ERROR:'+(e&&e.name?e.name:'unknown');}})();"
    ) { result ->
        AppLogger.diagnostic(
            appContext,
            "MINDMAP_RENDER_CALL_RESULT",
            JSONObject().put("result", result?.take(120) ?: "null")
        )
    }
}

