// JavaScript-side readiness/render/error handshake. Static-module import failures are still
// visible from Android as PAGE_FINISHED + NO_RENDER_FUNCTION and asset/console diagnostics.
def htmlFile060 = rootProject.file('app/src/main/assets/mindmap/index.html')
def html060 = readUtf8060(htmlFile060)
int scriptStart060 = html060.indexOf('  <script type="module">')
int scriptEnd060 = html060.indexOf('  </script>', scriptStart060)
if (scriptStart060 < 0 || scriptEnd060 < 0) {
    throw new GradleException('0.7.60 mind-map script block not found')
}
def script060 = '''  <script type="module">
    import MindElixir from './MindElixir.js'

    let mind = null
    const map = document.getElementById('map')
    const detail = document.getElementById('detail')
    const detailTitle = document.getElementById('detail-title')
    const detailMeta = document.getElementById('detail-meta')
    const detailBody = document.getElementById('detail-body')
    const detailEvidence = document.getElementById('detail-evidence')
    const bridge = window.AndroidMindMapDiagnostics

    const reportError = (stage, error) => {
      try {
        const message = String(error?.message || error || 'unknown').slice(0, 240)
        bridge?.error?.(String(stage || 'unknown').slice(0, 80), message)
      } catch (_) {}
    }

    window.addEventListener('error', event => reportError('window-error', event.error || event.message))
    window.addEventListener('unhandledrejection', event => reportError('unhandled-rejection', event.reason))

    const typeLabel = type => ({
      theme: '中心テーマ', topic: '話題', decision: '決定', action: '次にやる', todo: '次にやる',
      question: '未解決', unresolved: '未解決', idea: 'アイデア', person: '人物', place: '場所', detail: '要点'
    }[type] || '要点')

    function applyUi(ui = {}) {
      const root = document.documentElement.style
      root.setProperty('--pcs-bg', ui.background || '#ffffff')
      root.setProperty('--pcs-surface', ui.surface || '#ffffff')
      root.setProperty('--pcs-text', ui.text || '#1a1a1a')
      root.setProperty('--pcs-muted', ui.muted || '#666666')
      root.setProperty('--pcs-primary', ui.primary || '#46618a')
      root.setProperty('--pcs-outline', ui.outline || '#808080')
    }

    function showNode(node) {
      if (!node) return
      const metadata = node.metadata || {}
      detailTitle.textContent = node.topic || ''
      detailMeta.textContent = typeLabel(metadata.type) + (metadata.importance === 'high' ? '  •  重要' : '')
      detailBody.textContent = metadata.detail || ''
      detailBody.hidden = !metadata.detail
      detailEvidence.textContent = metadata.evidence ? `根拠: ${metadata.evidence}` : ''
      detailEvidence.hidden = !metadata.evidence
      detail.hidden = false
    }

    function selectedNodeFromEvent(nodes) {
      if (!Array.isArray(nodes) || nodes.length === 0) return null
      const item = nodes[nodes.length - 1]
      return item?.nodeObj || item || null
    }

    window.renderMindMap = payload => {
      try {
        if (!payload?.data?.nodeData) {
          reportError('payload', 'missing nodeData')
          return false
        }
        applyUi(payload.ui)
        detail.hidden = true
        if (mind) {
          try { mind.destroy() } catch (_) {}
          mind = null
        }
        mind = new MindElixir({
          el: '#map',
          direction: MindElixir.SIDE,
          editable: false,
          contextMenu: false,
          toolBar: false,
          keypress: false,
          allowUndo: false,
          compact: true,
          alignment: 'nodes',
          overflowHidden: false,
          scaleSensitivity: 0.08,
          scaleMin: 0.35,
          scaleMax: 2.0,
          theme: payload.data.theme
        })
        mind.init(payload.data)
        mind.bus.addListener('selectNodes', nodes => showNode(selectedNodeFromEvent(nodes)))
        mind.bus.addListener('selectNewNode', node => showNode(node))
        window.setTimeout(() => {
          try {
            mind?.scaleFit()
            bridge?.rendered?.(document.querySelectorAll('#map tpc').length, map.clientWidth, map.clientHeight)
          } catch (error) {
            reportError('post-render', error)
          }
        }, 100)
        return true
      } catch (error) {
        reportError('render', error)
        throw error
      }
    }

    map.addEventListener('click', event => {
      const topic = event.target?.closest?.('tpc')
      if (topic?.nodeObj) showNode(topic.nodeObj)
    })
    document.getElementById('zoom-in').addEventListener('click', () => {
      if (mind) mind.scale(Math.min(mind.scaleMax, mind.scaleVal + 0.12))
    })
    document.getElementById('zoom-out').addEventListener('click', () => {
      if (mind) mind.scale(Math.max(mind.scaleMin, mind.scaleVal - 0.12))
    })
    document.getElementById('fit').addEventListener('click', () => mind?.scaleFit())
    document.getElementById('detail-close').addEventListener('click', () => { detail.hidden = true })

    try { bridge?.ready?.('5.14.0') } catch (_) {}
  </script>'''
html060 = html060.substring(0, scriptStart060) + script060 + html060.substring(scriptEnd060 + '  </script>'.length())
writeUtf8060(htmlFile060, html060)

