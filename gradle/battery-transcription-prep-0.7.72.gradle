                            processedFrameCount++;
                        }
''' + "'''" + ''',
''' + "'''" + '''                        for (int i = 0; i < probabilities.length(); i++) {
                            long frameStartUs = streamBasePtsUs + processedFrameCount * frameUs;
                            double probability = probabilities.optDouble(i, 0.0);
                            probabilitySum += probability;
                            probabilityCount++;
                            maxSpeechProbability = Math.max(maxSpeechProbability, probability);
                            if (probability >= THRESHOLD) {
                                speechProbabilitySum += probability;
                                speechProbabilityCount++;
