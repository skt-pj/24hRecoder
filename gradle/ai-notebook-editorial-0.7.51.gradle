    }
}

@Composable
private fun DailyNotebookDetailPage(
    doc: AiAnalysisDocument,
    onBack: () -> Unit
) {
    LazyColumn(
        modifier = Modifier.fillMaxSize(),
        contentPadding = PaddingValues(20.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        item {
            OutlinedButton(onClick = onBack) {
                Text("概要へ戻る")
            }
        }
        item {
            Text("日次ノート詳細", style = MaterialTheme.typography.headlineMedium)
        }
        item {
            DailyAnalysisCard(doc)
        }
    }
}

@Composable
private fun HourlyNotebookDetailPage(
    date: LocalDate,
    hourlySummaries: Map<Long, String>,
    dailyHasResult: Boolean,
    onBack: () -> Unit
) {
    LazyColumn(
        modifier = Modifier.fillMaxSize(),
        contentPadding = PaddingValues(20.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        item {
            OutlinedButton(onClick = onBack) {
                Text("概要へ戻る")
            }
        }
        item {
            Text(
                "${date.year}年${date.monthValue}月${date.dayOfMonth}日 時間別詳細",
                style = MaterialTheme.typography.headlineMedium
            )
        }
        item {
            AiNotebookDayAnalysisActions(
                date = date,
                hourlySummaries = hourlySummaries,
                dailyHasResult = dailyHasResult
            )
        }
    }
}

