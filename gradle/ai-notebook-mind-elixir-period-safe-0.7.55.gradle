import java.nio.charset.StandardCharsets

def readUtf8055Safe = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8055Safe = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce055Safe = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.55 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}
def replaceCount055Safe = { String source, String oldText, String newText, int count, String label ->
    int actual = 0
    int cursor = 0
    while (true) {
        int found = source.indexOf(oldText, cursor)
        if (found < 0) break
        actual++
        cursor = found + oldText.length()
    }
    if (actual != count) {
        throw new GradleException("0.7.55 ${label}: expected ${count} matches, found ${actual}")
    }
    source.replace(oldText, newText)
}

