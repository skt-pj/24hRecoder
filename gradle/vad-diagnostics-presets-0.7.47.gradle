'''    private static void closeNativeLocked() {
''',
'''    private static File diagnosticsFile(Context context) {
        File dir = new File(context.getFilesDir(), "metadata/" + DIR_NAME);
        if (!dir.exists()) dir.mkdirs();
        return new File(dir, "current-diagnostics.json");
    }

    private static void resetDiagnosticsLocked() {
        diagnosticProbabilities.clear();
        diagnosticSampleCount = 0L;
        diagnosticSumSquares = 0.0;
        diagnosticPeak = 0.0;
        diagnosticMinSample = Double.POSITIVE_INFINITY;
        diagnosticMaxSample = Double.NEGATIVE_INFINITY;
        diagnosticNonZeroSamples = 0L;
        diagnosticStartedAtMs = System.currentTimeMillis();
    }

    private static void accumulatePcmDiagnosticsLocked(float[] samples) {
        if (samples == null) return;
        for (float sample : samples) {
            double value = sample;
            diagnosticSampleCount++;
            diagnosticSumSquares += value * value;
            diagnosticPeak = Math.max(diagnosticPeak, Math.abs(value));
            diagnosticMinSample = Math.min(diagnosticMinSample, value);
            diagnosticMaxSample = Math.max(diagnosticMaxSample, value);
            if (Math.abs(value) > 1.0e-7) diagnosticNonZeroSamples++;
        }
    }

    private static void emitDiagnosticsLocked(Context context, long currentEndUs) {
        try {
            ArrayList<Double> sorted = new ArrayList<>(diagnosticProbabilities);
            java.util.Collections.sort(sorted);
            int frameCount = sorted.size();
            double sum = 0.0;
            long aboveStart = 0L;
            long aboveEnd = 0L;
            for (double value : sorted) {
                sum += value;
                if (value >= vadConfig.startThreshold) aboveStart++;
                if (value >= vadConfig.endThreshold) aboveEnd++;
            }
            double probabilityMin = frameCount > 0 ? sorted.get(0) : 0.0;
            double probabilityMax = frameCount > 0 ? sorted.get(frameCount - 1) : 0.0;
            double probabilityAvg = frameCount > 0 ? sum / frameCount : 0.0;
            double probabilityP50 = quantile(sorted, 0.50);
            double probabilityP90 = quantile(sorted, 0.90);
            double probabilityP95 = quantile(sorted, 0.95);
            double pcmRms = diagnosticSampleCount > 0
                    ? Math.sqrt(diagnosticSumSquares / diagnosticSampleCount) : 0.0;
            double nonZeroRatio = diagnosticSampleCount > 0
                    ? diagnosticNonZeroSamples / (double) diagnosticSampleCount : 0.0;
            List<RangeUs> ranges = detector.snapshotRanges(currentEndUs);
            long speechMs = 0L;
            for (RangeUs range : ranges) {
                speechMs += Math.max(0L, range.endUs - range.startUs) / 1000L;
            }
            String healthReason;
            if (frameCount == 0) healthReason = "NO_PROBABILITY_FRAMES";
            else if (probabilityMax < vadConfig.startThreshold) healthReason = "PROBABILITY_TOO_LOW";
            else if (speechMs > 0L || detector.activeStartUs() >= 0L) healthReason = "SPEECH_DETECTED";
            else healthReason = "SPEECH_NOT_CONFIRMED";

            JSONObject json = new JSONObject()
                    .put("schemaVersion", 1)
                    .put("updatedAtMs", System.currentTimeMillis())
                    .put("windowStartedAtMs", diagnosticStartedAtMs)
                    .put("sampleRate", SAMPLE_RATE)
                    .put("channels", 1)
                    .put("windowSamples", frameWindowSamples)
                    .put("inputSampleCount", diagnosticSampleCount)
                    .put("pcmRms", pcmRms)
                    .put("pcmPeak", diagnosticPeak)
                    .put("pcmMin", diagnosticSampleCount > 0 ? diagnosticMinSample : 0.0)
                    .put("pcmMax", diagnosticSampleCount > 0 ? diagnosticMaxSample : 0.0)
                    .put("pcmNonZeroRatio", nonZeroRatio)
                    .put("frameCount", frameCount)
                    .put("probabilityMin", probabilityMin)
                    .put("probabilityAvg", probabilityAvg)
                    .put("probabilityP50", probabilityP50)
                    .put("probabilityP90", probabilityP90)
                    .put("probabilityP95", probabilityP95)
                    .put("probabilityMax", probabilityMax)
                    .put("aboveStartFrames", aboveStart)
                    .put("aboveEndFrames", aboveEnd)
                    .put("processedFrameCount", processedFrameCount)
                    .put("rangeCount", ranges.size())
                    .put("speechMs", speechMs)
                    .put("speechActive", detector.activeStartUs() >= 0L)
                    .put("vadHealthReason", healthReason)
                    .put("vad", vadConfig.toJson())
                    .put("nativeReady", nativeReady)
                    .put("activeMode", activeMode);
            writeAtomic(diagnosticsFile(context), json.toString());
            log(context, "STREAMING_VAD_DIAGNOSTIC_30S", new JSONObject(json.toString()));
        } catch (Exception error) {
            log(context, "STREAMING_VAD_DIAGNOSTIC_FAILED", details(
                    "error", error.getClass().getSimpleName(),
                    "message", safeMessage(error)));
        } finally {
            resetDiagnosticsLocked();
        }
    }

    private static double quantile(List<Double> sorted, double q) {
        if (sorted == null || sorted.isEmpty()) return 0.0;
        int index = (int) Math.round((sorted.size() - 1) * q);
        index = Math.max(0, Math.min(sorted.size() - 1, index));
        return sorted.get(index);
    }

    private static boolean sameVadConfig(StreamingVadSettings.Snapshot a, StreamingVadSettings.Snapshot b) {
        if (a == null || b == null) return false;
        return a.presetId.equals(b.presetId)
                && Double.compare(a.startThreshold, b.startThreshold) == 0
                && Double.compare(a.endThreshold, b.endThreshold) == 0
                && a.minSpeechMs == b.minSpeechMs
                && a.minSilenceMs == b.minSilenceMs
                && a.speechPadMs == b.speechPadMs;
    }

