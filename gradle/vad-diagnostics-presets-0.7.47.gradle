if (!vadFile047.text.contains('STREAMING_VAD_DIAGNOSTIC_30S')) {
    throw new GradleException('0.7.47 VAD diagnostics missing')
}
if (!vadFile047.text.contains('config.endThreshold')) {
    throw new GradleException('0.7.47 VAD hysteresis missing')
}
if (!backendFile047.text.contains('StreamingVadPresetSelector()')) {
    throw new GradleException('0.7.47 VAD preset selector missing')
}
if (!mainFile047.text.contains('DIAGNOSTICS("診断")')) {
    throw new GradleException('0.7.47 diagnostics tab missing')
}
if (mainFile047.text.contains('item { VulkanDiagnosticCard() }\n        item { Model30sBenchmarkCard() }')) {
    throw new GradleException('0.7.47 diagnostics still embedded in Settings')
}
