'''    private static final class DetectorState {
        private final List<RangeUs> closed = new ArrayList<>();
        private long pendingStartUs = -1L;
        private long pendingSpeechUs;
        private long activeStartUs = -1L;
        private long lastSpeechEndUs = -1L;
        private long silenceUs;

        void accept(double probability, long frameStartUs, long frameEndUs) {
            long frameUs = Math.max(1L, frameEndUs - frameStartUs);
            if (probability >= THRESHOLD) {
                silenceUs = 0L;
                if (activeStartUs < 0L) {
                    if (pendingStartUs < 0L) pendingStartUs = frameStartUs;
                    pendingSpeechUs += frameUs;
                    if (pendingSpeechUs >= MIN_SPEECH_US) {
                        activeStartUs = Math.max(0L, pendingStartUs - SPEECH_PAD_US);
                        lastSpeechEndUs = frameEndUs;
                    }
                } else {
                    lastSpeechEndUs = frameEndUs;
                    if (frameEndUs - activeStartUs >= MAX_SPEECH_US) {
                        closeAt(frameEndUs + SPEECH_PAD_US);
                        pendingStartUs = frameStartUs;
                        pendingSpeechUs = frameUs;
                    }
                }
            } else if (activeStartUs >= 0L) {
                silenceUs += frameUs;
                if (silenceUs >= MIN_SILENCE_US) {
                    closeAt(lastSpeechEndUs + SPEECH_PAD_US);
                }
            } else {
                pendingStartUs = -1L;
                pendingSpeechUs = 0L;
            }
        }
''',
'''    private static final class DetectorState {
        private final List<RangeUs> closed = new ArrayList<>();
        private final StreamingVadSettings.Snapshot config;
        private long pendingStartUs = -1L;
        private long pendingSpeechUs;
        private long activeStartUs = -1L;
        private long lastSpeechEndUs = -1L;
        private long silenceUs;

        DetectorState(StreamingVadSettings.Snapshot config) {
            this.config = config == null
                    ? StreamingVadSettings.preset(StreamingVadSettings.PRESET_CONVERSATION)
                    : config;
        }

        void accept(double probability, long frameStartUs, long frameEndUs) {
            long frameUs = Math.max(1L, frameEndUs - frameStartUs);
            boolean speechSignal = probability >= (activeStartUs >= 0L
                    ? config.endThreshold : config.startThreshold);
            if (speechSignal) {
                silenceUs = 0L;
                if (activeStartUs < 0L) {
                    if (pendingStartUs < 0L) pendingStartUs = frameStartUs;
                    pendingSpeechUs += frameUs;
                    if (pendingSpeechUs >= config.minSpeechMs * 1000L) {
                        activeStartUs = Math.max(0L, pendingStartUs - config.speechPadMs * 1000L);
                        lastSpeechEndUs = frameEndUs;
                    }
                } else {
                    lastSpeechEndUs = frameEndUs;
                    if (frameEndUs - activeStartUs >= MAX_SPEECH_US) {
                        closeAt(frameEndUs + config.speechPadMs * 1000L);
                        pendingStartUs = frameStartUs;
                        pendingSpeechUs = frameUs;
                    }
                }
            } else if (activeStartUs >= 0L) {
                silenceUs += frameUs;
                if (silenceUs >= config.minSilenceMs * 1000L) {
                    closeAt(lastSpeechEndUs + config.speechPadMs * 1000L);
                }
            } else {
                pendingStartUs = -1L;
                pendingSpeechUs = 0L;
            }
        }
''', 'VAD hysteresis detector')

