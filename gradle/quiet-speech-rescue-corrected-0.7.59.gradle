def quietClasses059 = '''    private static final class QuietSpeechEvidence {
        final boolean eligible;
        final double noiseFloorDbfs;
        final double levelDbfs;
        final double relativeDb;

        QuietSpeechEvidence(boolean eligible, double noiseFloorDbfs,
                            double levelDbfs, double relativeDb) {
            this.eligible = eligible;
            this.noiseFloorDbfs = noiseFloorDbfs;
            this.levelDbfs = levelDbfs;
            this.relativeDb = relativeDb;
        }
    }

    private static final class QuietSpeechTracker {
        private final double[] historyDbfs = new double[QUIET_RESCUE_HISTORY_FRAMES];
        private int historyCount;
        private int historyCursor;
        double lastNoiseFloorDbfs = -120.0;
        double lastLevelDbfs = -120.0;
        double lastRelativeDb;

        void reset() {
            Arrays.fill(historyDbfs, -120.0);
            historyCount = 0;
            historyCursor = 0;
            lastNoiseFloorDbfs = -120.0;
            lastLevelDbfs = -120.0;
            lastRelativeDb = 0.0;
        }

        QuietSpeechEvidence observe(float[] samples) {
            if (samples == null || samples.length == 0) {
                return new QuietSpeechEvidence(false, lastNoiseFloorDbfs,
                        lastLevelDbfs, lastRelativeDb);
            }
            int frameCount = Math.max(1,
                    (samples.length + QUIET_RESCUE_FRAME_SAMPLES - 1)
                            / QUIET_RESCUE_FRAME_SAMPLES);
            double[] currentDbfs = new double[frameCount];
            for (int frame = 0; frame < frameCount; frame++) {
                int start = frame * QUIET_RESCUE_FRAME_SAMPLES;
                int end = Math.min(samples.length, start + QUIET_RESCUE_FRAME_SAMPLES);
                double sumSquares = 0.0;
                for (int i = start; i < end; i++) {
                    double sample = samples[i];
                    sumSquares += sample * sample;
                }
                int count = Math.max(1, end - start);
                double rms = Math.sqrt(sumSquares / count);
                currentDbfs[frame] = 20.0 * Math.log10(Math.max(rms, 1.0e-9));
            }

            double levelDbfs = percentile(currentDbfs, 0.65);
            double noiseFloorDbfs = historyCount >= QUIET_RESCUE_HISTORY_MIN_FRAMES
                    ? historyPercentile(0.20)
                    : percentile(currentDbfs, 0.20);
            double relativeDb = levelDbfs - noiseFloorDbfs;
            boolean eligible = historyCount >= QUIET_RESCUE_HISTORY_MIN_FRAMES
                    && levelDbfs >= QUIET_RESCUE_MIN_LEVEL_DBFS
                    && levelDbfs <= QUIET_RESCUE_MAX_LEVEL_DBFS
                    && relativeDb >= QUIET_RESCUE_MIN_RELATIVE_DB;

            for (double value : currentDbfs) {
                historyDbfs[historyCursor] = value;
                historyCursor = (historyCursor + 1) % historyDbfs.length;
                if (historyCount < historyDbfs.length) historyCount++;
            }
            lastNoiseFloorDbfs = noiseFloorDbfs;
            lastLevelDbfs = levelDbfs;
            lastRelativeDb = relativeDb;
            return new QuietSpeechEvidence(eligible, noiseFloorDbfs, levelDbfs, relativeDb);
        }

        private double historyPercentile(double q) {
            if (historyCount <= 0) return -120.0;
            return percentile(Arrays.copyOf(historyDbfs, historyCount), q);
        }

        private static double percentile(double[] values, double q) {
            if (values == null || values.length == 0) return -120.0;
            double[] sorted = Arrays.copyOf(values, values.length);
            Arrays.sort(sorted);
            double position = Math.max(0.0, Math.min(1.0, q)) * (sorted.length - 1);
            int left = (int) Math.floor(position);
            int right = Math.min(sorted.length - 1, left + 1);
            double fraction = position - left;
            return sorted[left] + (sorted[right] - sorted[left]) * fraction;
        }
    }

'''
