    private static StackTraceElement ownershipWriter() {
        StackTraceElement[] stack = Thread.currentThread().getStackTrace();
        String self = FullStreamingStateStore.class.getName();
        for (StackTraceElement frame : stack) {
            String className = frame.getClassName();
            if (self.equals(className) || Thread.class.getName().equals(className)) continue;
            if (className.startsWith("java.lang.reflect.")
                    || className.startsWith("jdk.internal.reflect.")) continue;
            return frame;
        }
        return null;
    }

