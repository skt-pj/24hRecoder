def gemService = rootProject.file('app/src/main/java/com/sktpj/recorder24h/memoket/MemoketRemoteRecordingService.java').getText('UTF-8')
def replyGuard = rootProject.file('app/src/main/java/com/sktpj/recorder24h/memoket/GemResponsePhasePolicy.java').getText('UTF-8')
def micService = rootProject.file('app/src/main/java/com/sktpj/recorder24h/memoket/GemMicMonitorService.java').getText('UTF-8')
if (!gemService.contains('GEM_START_WRITE_OK_AWAITING_FILE_RESPONSE')
        || !gemService.contains('GEM_010101_FILE_ANNOUNCED_START_EFFECT_UNVERIFIED')
        || !gemService.contains('GemResponsePhasePolicy.receivedFileAnnouncement(')
        || !gemService.contains('GemResponsePhasePolicy.is020000(value)')
        || !gemService.contains('GemResponsePhasePolicy.exceeded020000Limit(')
        || !gemService.contains('signalMonitor(GemMicMonitorService.ACTION_GEM_STARTED);')
        || !gemService.contains('monitorStartFilenameDeadline')
        || !gemService.contains('GEM_MIC_STOP_CONTROL_0200_REQUESTED')
        || !micService.contains('gate.isRecording() && !gate.isStopping() && !gate.isFetching()')
        || !replyGuard.contains('MAX_020000_REPLIES = 3')
        || !replyGuard.contains('FILE_ANNOUNCEMENT_TIMEOUT_MS = 20_000L')) {
    throw new GradleException('Gem start confirmation and metadata retry safety regressed')
}
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(1131)
            output.versionName.set('0.7.131')
        }
    }
}
