def old058vad = '                            if (probability >= THRESHOLD) {\n'
def new058vad = '                            if (probability >= 0.5) {\n'
if (!text058vad.contains(old058vad)) {
    throw new GradleException('0.7.58 VAD threshold fix target missing')
}
text058vad = text058vad.replace(old058vad, new058vad)
file058vad.setText(text058vad, 'UTF-8')
