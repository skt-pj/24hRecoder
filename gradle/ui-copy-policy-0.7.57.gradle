import java.nio.charset.StandardCharsets

def readUtf8057 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8057 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOptional057 = { String source, String oldText, String newText ->
    source.contains(oldText) ? source.replace(oldText, newText) : source
}
def replaceBlock057 = { String source, String startMarker, String endMarker, String replacement, String label ->
    int start = source.indexOf(startMarker)
    if (start < 0) {
        throw new GradleException("0.7.57 ${label}: start marker missing")
    }
    int end = source.indexOf(endMarker, start + startMarker.length())
    if (end < 0) {
        throw new GradleException("0.7.57 ${label}: end marker missing")
    }
    source.substring(0, start) + replacement + source.substring(end)
}

