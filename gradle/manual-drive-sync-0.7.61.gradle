import java.nio.charset.StandardCharsets

def readUtf8061 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8061 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce061 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.61 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

// Allow an explicit user-requested Drive sync to bypass the one-minute automatic-sync throttle.
def syncFile061 = rootProject.file('app/src/main/java/com/sktpj/recorder24h/util/DriveLogSync.java')
def sync061 = readUtf8061(syncFile061)
def oldDirect061 = '''    public static void syncDirectAsync(Context context) {
        Context app = context.getApplicationContext();
        if (!DriveLogTarget.isConfigured(app)) {
            return;
        }
        long now = System.currentTimeMillis();
        if (DIRECT_RUNNING.get() || now - lastDirectStartMs < DIRECT_SYNC_MIN_INTERVAL_MS) {
            return;
        }
        if (!DIRECT_RUNNING.compareAndSet(false, true)) {
            return;
        }
        lastDirectStartMs = now;
        DIRECT_EXECUTOR.execute(() -> {
            try {
                sync(app);
            } catch (SecurityException permissionLost) {
                DriveLogTarget.recordError(app, shortError(permissionLost));
                DriveLogTarget.clearTreeUri(app);
                AppLogger.event(app, "DRIVE_LOG_SYNC_PERMISSION_LOST", errorDetails(permissionLost));
            } catch (Exception error) {
                DriveLogTarget.recordError(app, shortError(error));
                AppLogger.event(app, "DRIVE_LOG_SYNC_FAILED", errorDetails(error));
            } finally {
                DIRECT_RUNNING.set(false);
            }
        });
    }
'''
def newDirect061 = '''    public interface DirectSyncCallback {
        void onComplete(boolean success, String error);
    }

    public static void syncDirectAsync(Context context) {
        startDirectSync(context, false, null);
    }

    public static boolean syncDirectNowAsync(Context context, DirectSyncCallback callback) {
        return startDirectSync(context, true, callback);
    }

    public static boolean isDirectSyncRunning() {
        return DIRECT_RUNNING.get();
    }

    private static boolean startDirectSync(Context context, boolean force, DirectSyncCallback callback) {
        Context app = context.getApplicationContext();
        if (!DriveLogTarget.isConfigured(app)) {
            if (callback != null) callback.onComplete(false, "Drive保存先未設定");
            return false;
        }
        long now = System.currentTimeMillis();
        if (DIRECT_RUNNING.get() || (!force && now - lastDirectStartMs < DIRECT_SYNC_MIN_INTERVAL_MS)) {
            return false;
        }
        if (!DIRECT_RUNNING.compareAndSet(false, true)) {
            return false;
        }
        lastDirectStartMs = now;
        DIRECT_EXECUTOR.execute(() -> {
            boolean success = false;
            String callbackError = null;
            try {
                sync(app);
                success = true;
            } catch (SecurityException permissionLost) {
                callbackError = shortError(permissionLost);
                DriveLogTarget.recordError(app, callbackError);
                DriveLogTarget.clearTreeUri(app);
                AppLogger.event(app, "DRIVE_LOG_SYNC_PERMISSION_LOST", errorDetails(permissionLost));
            } catch (Exception error) {
                callbackError = shortError(error);
                DriveLogTarget.recordError(app, callbackError);
                AppLogger.event(app, "DRIVE_LOG_SYNC_FAILED", errorDetails(error));
            } finally {
                DIRECT_RUNNING.set(false);
                if (callback != null) {
                    try {
                        callback.onComplete(success, callbackError);
                    } catch (RuntimeException ignored) {
                    }
                }
            }
        });
        return true;
    }
'''
sync061 = replaceOnce061(sync061, oldDirect061, newDirect061, 'manual direct sync API')
sync061 = replaceOnce061(
        sync061,
        '        root.put("driveLastError", nullable(DriveLogTarget.getLastError(context)));\n',
        '''        root.put("driveLastError", nullable(DriveLogTarget.getLastError(context)));
        root.put("detailedDiagnosticsEnabled", DiagnosticLogSettings.isDetailedEnabled(context));
        root.put("driveSyncInProgress", DIRECT_RUNNING.get());
        root.put("driveSyncRequestStartedAtMs", lastDirectStartMs);
''',
        'diagnostics sync state')
writeUtf8061(syncFile061, sync061)

// Keep the diagnostics card operational: switch, immediate Drive sync, and current sync status only.
def cardFile061 = rootProject.file('app/src/main/java/com/sktpj/recorder24h/DiagnosticLoggingSettingsCard.kt')
def card061 = '''package com.sktpj.recorder24h

import android.content.Intent
import android.os.Handler
import android.os.Looper
import androidx.compose.foundation.layout.Arrangement
import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.Row
import androidx.compose.foundation.layout.fillMaxWidth
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.Button
import androidx.compose.material3.Card
import androidx.compose.material3.MaterialTheme
import androidx.compose.material3.Switch
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.platform.LocalContext
import androidx.compose.ui.unit.dp
import com.sktpj.recorder24h.util.AppLogger
import com.sktpj.recorder24h.util.DiagnosticLogSettings
import com.sktpj.recorder24h.util.DriveLogSync
import com.sktpj.recorder24h.util.DriveLogTarget
import org.json.JSONObject
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

@Composable
internal fun DiagnosticLoggingSettingsCard() {
    val context = LocalContext.current
    var enabled by remember { mutableStateOf(DiagnosticLogSettings.isDetailedEnabled(context)) }
    var syncing by remember { mutableStateOf(false) }
    var syncStatus by remember {
        mutableStateOf(driveSyncStatus(context))
    }

    Card {
        Column(
            modifier = Modifier.padding(20.dp),
            verticalArrangement = Arrangement.spacedBy(10.dp)
        ) {
            Text("診断ログ", style = MaterialTheme.typography.titleLarge)
            Row(
                modifier = Modifier.fillMaxWidth(),
                verticalAlignment = Alignment.CenterVertically,
                horizontalArrangement = Arrangement.SpaceBetween
            ) {
                Column(modifier = Modifier.weight(1f)) {
                    Text("詳細診断ログ")
                    Text(
                        if (enabled) "ON" else "OFF",
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
                Switch(
                    checked = enabled,
                    onCheckedChange = { next ->
                        if (DiagnosticLogSettings.setDetailedEnabled(context, next)) {
                            enabled = next
                            AppLogger.event(
                                context,
                                "DIAGNOSTIC_LOGGING_CHANGED",
                                JSONObject().put("detailed", next)
                            )
                        }
                    }
                )
            }

            Button(
                onClick = {
                    if (!DriveLogTarget.isConfigured(context)) {
                        context.startActivity(Intent(context, DriveLogSetupActivity::class.java))
                        return@Button
                    }
                    syncing = true
                    syncStatus = "同期中"
                    AppLogger.event(
                        context,
                        "DRIVE_LOG_SYNC_MANUAL_REQUESTED",
                        JSONObject().put("detailed", enabled)
                    )
                    val started = DriveLogSync.syncDirectNowAsync(context) { success, error ->
                        Handler(Looper.getMainLooper()).post {
                            syncing = false
                            syncStatus = if (success) {
                                driveSyncStatus(context)
                            } else {
                                error?.takeIf { it.isNotBlank() } ?: "同期失敗"
                            }
                        }
                    }
                    if (!started) {
                        syncing = DriveLogSync.isDirectSyncRunning()
                        syncStatus = if (syncing) "同期中" else driveSyncStatus(context)
                    }
                },
                enabled = !syncing,
                modifier = Modifier.fillMaxWidth()
            ) {
                Text(if (DriveLogTarget.isConfigured(context)) "今すぐDrive同期" else "Drive保存先を設定")
            }

            if (syncStatus.isNotBlank()) {
                Text(
                    syncStatus,
                    style = MaterialTheme.typography.bodySmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )
            }
        }
    }
}

private fun driveSyncStatus(context: android.content.Context): String {
    val error = DriveLogTarget.getLastError(context)
    if (!error.isNullOrBlank()) return "前回エラー: ${error.take(120)}"
    val last = DriveLogTarget.getLastSuccessAtMs(context)
    if (last <= 0L) return if (DriveLogTarget.isConfigured(context)) "未同期" else "保存先未設定"
    val format = SimpleDateFormat("M/d HH:mm:ss", Locale.getDefault())
    return "最終同期 ${format.format(Date(last))}"
}
'''
writeUtf8061(cardFile061, card061)

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(1061)
            output.versionName.set('0.7.61-debug')
        }
    }
}

if (!syncFile061.text.contains('syncDirectNowAsync') || !syncFile061.text.contains('detailedDiagnosticsEnabled')) {
    throw new GradleException('0.7.61 manual Drive sync implementation missing')
}
if (!cardFile061.text.contains('今すぐDrive同期') || !cardFile061.text.contains('DRIVE_LOG_SYNC_MANUAL_REQUESTED')) {
    throw new GradleException('0.7.61 manual Drive sync UI missing')
}
