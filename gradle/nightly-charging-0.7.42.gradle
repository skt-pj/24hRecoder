    public static boolean isNightlyQueueItem(SegmentRecord record) {
        if (record == null) return false;
        String reason = record.getReason();
        return reason != null && reason.startsWith("NIGHTLY_HOURLY_")
                && !PENDING_REASON.equals(reason);
    }

    public static boolean isCharging(Context context) {
        BatteryManager battery = context.getApplicationContext().getSystemService(BatteryManager.class);
        return battery != null && battery.isCharging();
    }

