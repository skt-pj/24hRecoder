    private static boolean shouldRequireChargingForNextWork(Context context) {
        boolean hasNightly = false;
        for (SegmentRecord record : SegmentHistoryRepository.load(context)) {
            if (!("QUEUED".equals(record.getStatus()) || "RETRY_WAIT".equals(record.getStatus()))
                    || !record.getAudioAvailable()
                    || isAutomaticLiveFinalDisabled(context, record)) continue;
            if (NightlyHourlyTranscriptionScheduler.isNightlyQueueItem(record)) {
                hasNightly = true;
            } else {
                // Manual/non-nightly work remains runnable without a charger.
                return false;
            }
        }
        return hasNightly;
    }

