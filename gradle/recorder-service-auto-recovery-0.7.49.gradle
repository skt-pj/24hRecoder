if (!recorderServiceFile049.text.contains('RECORDER_AUTO_RECOVERY_DEFERRED')) {
    throw new GradleException('0.7.49 deferred recovery log missing')
}
if (!recorderServiceFile049.text.contains('autoRecoveryNotBeforeMs')) {
    throw new GradleException('0.7.49 recovery backoff field missing')
}
if (recorderServiceFile049.text.contains('短時間に録音異常が繰り返されたため自動再試行を停止しました')) {
