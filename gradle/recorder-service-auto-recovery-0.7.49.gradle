'''    private void startRecorderIfNeeded() {
        if (!RecordingIntentStore.isRequested(this) || serviceDestroyed) {
            return;
        }

        long now = System.currentTimeMillis();
        long notBefore = autoRecoveryNotBeforeMs;
        if (notBefore > now) {
            watchdogHandler.postDelayed(this::startRecorderIfNeeded, notBefore - now);
            return;
        }
        autoRecoveryNotBeforeMs = 0L;

        String blocker = currentBlockingReason(null);
''', 'deferred recorder start gate')

recorderService049 = replaceOnce049(recorderService049,
