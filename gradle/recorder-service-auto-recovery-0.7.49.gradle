import java.nio.charset.StandardCharsets

def readUtf8049 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8049 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce049 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.49 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

def recorderServiceFile049 = rootProject.file('app/src/main/java/com/sktpj/recorder24h/service/RecorderService.java')
def recorderService049 = readUtf8049(recorderServiceFile049)

recorderService049 = replaceOnce049(recorderService049,
'''    private long autoRecoveryWindowStartedAtMs;
    private int autoRecoveryAttempts;
    private final Handler watchdogHandler = new Handler(Looper.getMainLooper());
''',
'''    private long autoRecoveryWindowStartedAtMs;
    private int autoRecoveryAttempts;
    private volatile long autoRecoveryNotBeforeMs;
    private final Handler watchdogHandler = new Handler(Looper.getMainLooper());
''', 'recovery backoff field')

recorderService049 = replaceOnce049(recorderService049,
'''    private void startRecorderIfNeeded() {
