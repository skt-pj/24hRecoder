def gateSource = rootProject.file('app/src/main/java/com/sktpj/recorder24h/memoket/GemVoiceGate.java').getText('UTF-8')
if (!gateSource.contains('SPEECH_TO_START_MS = 2_000L')
        || !gateSource.contains('SILENCE_TO_STOP_MS = 60_000L')
        || !gateSource.contains('lastSpeechAtMs < SPEECH_TO_START_MS')) {
    throw new GradleException('Gem speech-start and silence-stop thresholds differ from the selected version')
}
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(1129)
            output.versionName.set('0.7.129')
        }
    }
}
