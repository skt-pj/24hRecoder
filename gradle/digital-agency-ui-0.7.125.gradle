        item {
            Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                Text("ホーム", style = MaterialTheme.typography.headlineMedium)
                Text("録音状態と保存状況", color = MaterialTheme.colorScheme.onSurfaceVariant)
            }
        }
        item { RecordingCard(dashboard, onRequestStart, onRequestStop = { confirmStop = true }) }
        item { DashboardSectionHeading("保存状況") }
        item {
            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    DashboardMetric("保持音声", dashboard.retainedAudioCount.toString() + "件", Modifier.weight(1f))
                    DashboardMetric("確定文字起こし", dashboard.transcriptCount.toString() + "件", Modifier.weight(1f))
                }
                Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    DashboardMetric("実キュー", dashboard.activeQueueCount.toString() + "件", Modifier.weight(1f))
                    DashboardMetric("要確認", dashboard.needsAttentionCount.toString() + "件", Modifier.weight(1f))
                }
            }
        }
        item { DashboardSectionHeading("最新の記録") }
        item {
            if (latestRecord == null) {
                Card(
                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                    border = androidx.compose.foundation.BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)
                ) {
                    Text("記録はまだありません", modifier = Modifier.fillMaxWidth().padding(20.dp))
                }
            } else {
                Card(
                    onClick = { onOpenRecord(latestRecord) },
                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                    border = androidx.compose.foundation.BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                    shape = RoundedCornerShape(12.dp)
                ) {
                    Column(Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Text(formatTimeRange(latestRecord), modifier = Modifier.weight(1f),
                                style = MaterialTheme.typography.titleMedium)
                            StatusPill(recordStatusLabel(latestRecord), recordTone(latestRecord))
                        }
                        Text(latestRecord.transcriptText?.takeIf { it.isNotBlank() }
                            ?: "文字起こし結果はまだありません",
                            maxLines = 3, overflow = TextOverflow.Ellipsis)
                        Text("詳細を見る", style = MaterialTheme.typography.labelLarge,
                            color = MaterialTheme.colorScheme.primary)
                    }
                }
            }
        }
        item { StorageCard(dashboard) }
        item { TranscriptionCard(dashboard, onOpenHistory) }
    }
}

@Composable
private fun DashboardSectionHeading(title: String) {
    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
        Box(Modifier.width(4.dp).height(22.dp).background(MaterialTheme.colorScheme.primary))
        Text(title, style = MaterialTheme.typography.titleLarge)
    }
}

@Composable
private fun DashboardMetric(label: String, value: String, modifier: Modifier = Modifier) {
    Card(
        modifier = modifier,
        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
        border = androidx.compose.foundation.BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
        shape = RoundedCornerShape(12.dp)
    ) {
        Column(Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
            Text(label, style = MaterialTheme.typography.labelMedium,
                color = MaterialTheme.colorScheme.onSurfaceVariant)
            Text(value, style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
        }
    }
}
''')

