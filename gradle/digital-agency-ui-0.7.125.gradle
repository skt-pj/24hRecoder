import java.nio.charset.StandardCharsets

def mainFile = rootProject.file('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
def mainText = new String(mainFile.bytes, StandardCharsets.UTF_8)
def patchRegion = { String text, String from, String until, String replacement ->
    int start = text.indexOf(from)
    int end = text.indexOf(until, start + from.length())
    if (start < 0 || end < 0) throw new GradleException('Digital Agency UI anchor missing')
    text.substring(0, start) + replacement + text.substring(end)
}

mainText = patchRegion(mainText, '@Composable\nprivate fun HomeScreen(', '\n@Composable\nprivate fun RecordingCard(', '''@Composable
