''' + mainText.substring(detailEnd)

def controlOwner = mainText.indexOf('private fun RecordingCard(')
def controlStart = mainText.indexOf('            if (active) {\n                Button(', controlOwner)
def controlEnd = mainText.indexOf('\n        }\n    }\n}\n\n@Composable\nprivate fun StorageCard', controlStart)
if (controlStart < 0 || controlEnd < 0) throw new GradleException('Recording control not found')
def controlText = mainText.substring(controlStart, controlEnd)
mainText = mainText.substring(0, controlStart) + mainText.substring(controlEnd)
def controlsBeforeDetails = mainText.indexOf('            if (dashboard.heartbeatMs > 0L)', controlOwner)
if (controlsBeforeDetails < 0) throw new GradleException('Recording status location not found')
mainText = mainText.substring(0, controlsBeforeDetails) + controlText + '\n' + mainText.substring(controlsBeforeDetails)

mainFile.setText(mainText, 'UTF-8')
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(1125)
            output.versionName.set('0.7.125')
        }
    }
