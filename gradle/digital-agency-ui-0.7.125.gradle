def detailStart = mainText.indexOf('private fun RecordDetailScreen(record: SegmentRecord)')
def detailEnd = mainText.indexOf('\n@Composable\nprivate fun AudioPlaybackCard(', detailStart)
if (detailStart < 0 || detailEnd < 0) throw new GradleException('Detail screen not found')
def detailHeaderStart = mainText.lastIndexOf('@Composable\n', detailStart)
mainText = mainText.substring(0, detailHeaderStart) + '''@Composable
