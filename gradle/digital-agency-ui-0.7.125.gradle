    dashboard: DashboardSnapshot,
    onRequestStart: () -> Unit,
    onStop: () -> Unit,
    onOpenHistory: () -> Unit,
    latestRecord: SegmentRecord?,
    onOpenRecord: (SegmentRecord) -> Unit
) {
    var confirmStop by remember { mutableStateOf(false) }
    if (confirmStop) {
        AlertDialog(
            onDismissRequest = { confirmStop = false },
            title = { Text("録音を停止しますか？") },
            text = { Text("録音を停止します。ホームから再開できます。") },
            confirmButton = {
