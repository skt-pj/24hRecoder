    def helpers039 = '''private fun provisionalFinalsForRecord(
    record: SegmentRecord,
    liveFinals: List<FullStreamingStateStore.RecentFinal>
): List<FullStreamingStateStore.RecentFinal> {
    if (record.hasTranscript || !record.liveOwned || record.startedAtMs <= 0L) return emptyList()
    val endMs = if (record.endedAtMs > record.startedAtMs) {
        record.endedAtMs
    } else {
        record.startedAtMs + 5L * 60L * 1000L
    }
    val startWithTolerance = record.startedAtMs - 2_500L
    val endWithTolerance = endMs + 2_500L
    return liveFinals.filter { item ->
        item.endAtMs >= startWithTolerance && item.startAtMs <= endWithTolerance
    }
}

private fun liveConversationText(
    finals: List<FullStreamingStateStore.RecentFinal>
): String = finals
    .filter { it.text.isNotBlank() }
    .joinToString("\\n") { item ->
        val speaker = item.speaker?.trim().orEmpty()
        if (speaker.isNotBlank() && speaker != "判定不能") {
            "$speaker: ${item.text}"
        } else {
            item.text
        }
    }
    .trim()

