def newHandleBoundary039 = '''    private void handleBoundary(Bundle data) {
        SegmentAccumulator old = current;
        long endPtsUs = data.getLong("segmentEndPtsUs", old == null ? 0L : old.basePtsUs());
        long actualBasePtsUs = data.getLong("segmentBasePtsUs", old == null ? 0L : old.basePtsUs());
        PipelineConfig nextConfig = PipelineConfig.fromBundle(data, "next");

        if (old != null && old.config.isLive()) {
            // Five-minute M4A remains only a durable recording/recovery boundary. Live Whisper
            // output is provisional and is never promoted to canonical here. Canonical Whisper is
            // staged by SegmentReadyReceiver and processed in the previous-day night batch.
            old.correctBase(actualBasePtsUs);
            old.segmentId = data.getString("segmentId");
            old.startedAtMs = data.getLong("startedAtMs", 0L);
            old.endedAtMs = data.getLong("endedAtMs", 0L);
            old.endPtsUs = endPtsUs;
            log("FULL_STREAMING_SEGMENT_STAGED_FOR_NIGHTLY_CANONICAL", details(
                    "segmentId", old.segmentId,
                    "liveModelId", old.config.modelId,
                    "provisionalWindowMs", PROVISIONAL_WINDOW_US / 1000L,
                    "canonicalDisplayUnitMinutes", 60,
                    "automaticFiveMinuteWhisper", false,
                    "liveOutputCanonical", false));
        }

        pcmBuffer.trimBefore(endPtsUs);
        lastScheduledFinalEndUs = endPtsUs;
        lastPartialRequestedEndUs = endPtsUs;
        provisionalWindowHasSpeech = false;

        if (nextConfig.isLive()) {
            current = new SegmentAccumulator(endPtsUs, nextConfig);
            enqueueConfigure(current);
            writeState("WAITING", "", old == null ? "" : old.latestFinalText, current, null);
        } else {
            current = null;
            submit("live-session-close", LiveWhisperSession::close);
            FullStreamingStateStore.writeLiveState(this, "OFF", nextConfig.asrBackend,
                    "", old == null ? "" : old.latestFinalText,
                    "", null, pendingInference.get(), null);
        }
        log("FULL_STREAMING_SERVICE_BOUNDARY", details(
                "segmentId", data.getString("segmentId"),
                "actualSegmentBasePtsUs", actualBasePtsUs,
                "segmentEndPtsUs", endPtsUs,
                "nextPipeline", nextConfig.toJson(),
                "automaticFiveMinuteWhisper", false));
    }

