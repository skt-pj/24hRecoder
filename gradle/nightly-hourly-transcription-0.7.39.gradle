import java.nio.charset.StandardCharsets

def readUtf8039 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8039 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce039 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.39 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}
def replaceBetween039 = { String source, String startMarker, String endMarker, String replacement, String label ->
    int start = source.indexOf(startMarker)
    if (start < 0) throw new GradleException("0.7.39 ${label}: start marker missing")
    int end = source.indexOf(endMarker, start)
    if (end < 0) throw new GradleException("0.7.39 ${label}: end marker missing")
    source.substring(0, start) + replacement + source.substring(end)
}

