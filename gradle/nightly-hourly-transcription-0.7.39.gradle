def hourlyHistory039 = '''@Composable
private fun HistoryScreen(
    records: List<SegmentRecord>,
    listState: LazyListState,
    query: String,
    filter: HistoryFilter,
    liveState: FullStreamingStateStore.LiveState?,
    liveFinals: List<FullStreamingStateStore.RecentFinal>,
    onQueryChange: (String) -> Unit,
    onFilterChange: (HistoryFilter) -> Unit,
    onSelect: (SegmentRecord) -> Unit
) {
    val nowMs = System.currentTimeMillis()
    val latestKnownEndMs = remember(records) { records.maxOfOrNull { it.endedAtMs } ?: 0L }
    val currentLiveFinals = remember(liveFinals, latestKnownEndMs) {
        liveFinals.filter { item -> latestKnownEndMs <= 0L || item.endAtMs > latestKnownEndMs + 2_500L }
    }
    val currentFinalText = remember(currentLiveFinals) { liveConversationText(currentLiveFinals) }
    val currentPartial = liveState?.partialText.orEmpty().trim()
    val currentSearchText = remember(currentFinalText, currentPartial) {
        listOf(currentFinalText, currentPartial).filter { it.isNotBlank() }.joinToString("\\n")
    }
    val showCurrentLive = filter == HistoryFilter.ALL && currentSearchText.isNotBlank() &&
        (query.isBlank() || currentSearchText.contains(query, true))

    val groups = remember(records, liveFinals, nowMs) {
        records
            .groupBy { hourStartMs(it.sortTimeMs) }
            .map { (hourStart, hourRecords) ->
                val ordered = hourRecords.sortedBy { it.sortTimeMs }
                val hourEnd = hourStart + 60L * 60L * 1000L
                val canonicalReady = hourEnd <= nowMs && ordered.isNotEmpty() &&
                    ordered.all { it.hasTranscript || it.status == "CORRUPT" }
                val provisional = liveFinals.filter { item ->
                    item.endAtMs > hourStart && item.startAtMs < hourEnd
                }
                val provisionalText = liveConversationText(provisional)
                val canonicalText = if (canonicalReady) canonicalHourText(ordered) else ""
                val visibleText = if (canonicalReady) canonicalText else provisionalText
                HourHistoryGroup(
                    hourStartMs = hourStart,
                    hourEndMs = hourEnd,
                    records = ordered,
                    representative = ordered.maxByOrNull { it.sortTimeMs }!!,
                    canonical = canonicalReady,
                    provisional = !canonicalReady && provisionalText.isNotBlank(),
                    text = visibleText
                )
            }
            .sortedByDescending { it.hourStartMs }
    }
    val filtered = remember(groups, query, filter) {
        groups.filter { group ->
            val statusOk = when (filter) {
                HistoryFilter.ALL -> true
                HistoryFilter.TRANSCRIBED -> group.canonical
                HistoryFilter.AUDIO -> group.records.any { it.audioAvailable }
                HistoryFilter.ATTENTION -> group.records.any { it.needsAttention }
            }
            val queryOk = query.isBlank() || group.text.contains(query, true) ||
                group.records.any { record ->
                    record.segmentId.contains(query, true) ||
                        record.fileName?.contains(query, true) == true ||
                        record.transcriptText?.contains(query, true) == true
                }
            statusOk && queryOk
        }
    }

    Column(Modifier.fillMaxSize()) {
        Column(
            Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
            verticalArrangement = Arrangement.spacedBy(10.dp)
        ) {
            OutlinedTextField(
                value = query,
                onValueChange = onQueryChange,
                singleLine = true,
                leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },
                placeholder = { Text("会話内容を検索") },
                modifier = Modifier.fillMaxWidth()
            )
            LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                itemsIndexed(HistoryFilter.entries) { _, item ->
                    FilterChip(
                        selected = filter == item,
                        onClick = { onFilterChange(item) },
                        label = { Text(item.label) }
                    )
                }
            }
        }

        if (filtered.isEmpty() && !showCurrentLive) {
            EmptyHistory(query, filter)
        } else {
            LazyColumn(
                state = listState,
                modifier = Modifier.fillMaxSize(),
                contentPadding = PaddingValues(horizontal = 20.dp, vertical = 8.dp),
                verticalArrangement = Arrangement.spacedBy(10.dp)
            ) {
                if (showCurrentLive) {
                    item(key = "history-current-live") {
                        CurrentConversationCard(currentFinalText, currentPartial)
                    }
                }
                itemsIndexed(filtered, key = { _, item -> "hour-${item.hourStartMs}" }) { index, group ->
                    val day = formatDay(group.hourStartMs)
                    val previous = if (index == 0) null else formatDay(filtered[index - 1].hourStartMs)
                    if (day != previous) {
                        Text(
                            day,
                            style = MaterialTheme.typography.titleMedium,
                            modifier = Modifier.padding(top = if (index == 0) 0.dp else 10.dp)
                        )
                    }
                    HourHistoryCard(group) { onSelect(group.representative) }
                }
            }
        }
    }
}

private data class HourHistoryGroup(
    val hourStartMs: Long,
    val hourEndMs: Long,
    val records: List<SegmentRecord>,
    val representative: SegmentRecord,
    val canonical: Boolean,
    val provisional: Boolean,
    val text: String
)

@Composable
private fun HourHistoryCard(group: HourHistoryGroup, onClick: () -> Unit) {
    val label = when {
        group.canonical -> "確定"
        group.provisional -> "暫定"
        group.records.any { it.status == "QUEUED" || it.status == "RETRY_WAIT" || it.status == "TRANSCRIBING" } -> "夜間処理中"
        else -> "夜間確定待ち"
    }
    val conversation = when {
        group.text.isNotBlank() -> group.text
        group.records.any { it.status == "CORRUPT" } -> "一部の録音データを確認できません"
        else -> "確定文字起こしは夜間にまとめて実行します"
    }
    Card(
        onClick = onClick,
        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
    ) {
        Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                Text(
                    formatHourRange(group.hourStartMs),
                    style = MaterialTheme.typography.titleMedium,
                    fontWeight = FontWeight.SemiBold,
                    modifier = Modifier.weight(1f)
                )
                Surface(
                    color = if (group.canonical) MaterialTheme.colorScheme.primaryContainer
                        else MaterialTheme.colorScheme.tertiaryContainer,
                    shape = CircleShape
                ) {
                    Text(label, style = MaterialTheme.typography.labelMedium,
                        modifier = Modifier.padding(horizontal = 10.dp, vertical = 5.dp))
                }
            }
            Text(
                conversation,
                maxLines = 8,
                overflow = TextOverflow.Ellipsis,
                style = MaterialTheme.typography.bodyLarge
            )
        }
    }
}

private fun hourStartMs(value: Long): Long {
    if (value <= 0L) return 0L
    val calendar = java.util.Calendar.getInstance()
    calendar.timeInMillis = value
    calendar.set(java.util.Calendar.MINUTE, 0)
    calendar.set(java.util.Calendar.SECOND, 0)
    calendar.set(java.util.Calendar.MILLISECOND, 0)
    return calendar.timeInMillis
}

private fun formatHourRange(hourStartMs: Long): String {
    if (hourStartMs <= 0L) return "時刻不明"
    val start = SimpleDateFormat("HH:mm", Locale.JAPAN).format(Date(hourStartMs))
    val end = SimpleDateFormat("HH:mm", Locale.JAPAN).format(Date(hourStartMs + 60L * 60L * 1000L - 1L))
    return "$start–$end"
}

private fun canonicalHourText(records: List<SegmentRecord>): String = records
    .sortedBy { it.sortTimeMs }
    .flatMap { record ->
        if (record.transcriptChunks.isNotEmpty()) {
            record.transcriptChunks.map { chunk ->
                val time = if (record.startedAtMs > 0L) {
                    SimpleDateFormat("HH:mm:ss", Locale.JAPAN).format(Date(record.startedAtMs + chunk.startMs))
                } else "--:--:--"
                val speaker = chunk.speaker.takeIf { it.isNotBlank() && it != "判定不能" }
                if (speaker == null) "$time  ${chunk.text}" else "$time  $speaker: ${chunk.text}"
            }
        } else {
            record.transcriptText?.takeIf { it.isNotBlank() }?.let { text ->
                val time = if (record.startedAtMs > 0L) {
                    SimpleDateFormat("HH:mm:ss", Locale.JAPAN).format(Date(record.startedAtMs))
                } else "--:--:--"
                listOf("$time  $text")
            } ?: emptyList()
        }
    }
    .joinToString("\\n")
    .trim()

