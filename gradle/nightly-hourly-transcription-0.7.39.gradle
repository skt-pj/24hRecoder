def newHandlePcm039 = '''    private void handlePcm(Bundle data) {
        if (current == null || !current.config.isLive()) return;
        byte[] pcm = data.getByteArray("pcm");
        if (pcm == null || pcm.length == 0) return;
        long startPtsUs = data.getLong("startPtsUs", -1L);
        long currentEndUs = data.getLong("currentEndUs", startPtsUs);
        pcmBuffer.append(startPtsUs, pcm);
        latestActiveSpeechStartUs = data.getLong("activeSpeechStartUs", -1L);

        long[] starts = data.getLongArray("closedStartsUs");
        long[] ends = data.getLongArray("closedEndsUs");

        // Finish elapsed fixed windows first. provisionalWindowHasSpeech carries VAD activity
        // observed on earlier 100-ms PCM messages in the same window. The overlap checks below
        // also cover a speech boundary delivered on the message that crosses 30 seconds.
        while (currentEndUs - lastPartialRequestedEndUs >= PROVISIONAL_WINDOW_US) {
            long windowStartUs = lastPartialRequestedEndUs;
            long windowEndUs = windowStartUs + PROVISIONAL_WINDOW_US;
            boolean windowHasSpeech = provisionalWindowHasSpeech;
            if (latestActiveSpeechStartUs >= 0L
                    && latestActiveSpeechStartUs < windowEndUs
                    && currentEndUs > windowStartUs) {
                windowHasSpeech = true;
            }
            if (starts != null && ends != null) {
                int count = Math.min(starts.length, ends.length);
                for (int i = 0; i < count; i++) {
                    if (ends[i] > windowStartUs && starts[i] < windowEndUs) {
                        windowHasSpeech = true;
                        break;
                    }
                }
            }
            if (windowHasSpeech) {
                scheduleProvisionalWindow(windowStartUs, windowEndUs, current);
            }
            lastPartialRequestedEndUs = windowEndUs;
            provisionalWindowHasSpeech = false;
        }

        // Remember speech belonging to the currently open 30-second window. This avoids running
        // Whisper for all-silence windows while keeping the inference cadence independent of VAD
        // utterance boundaries.
        if (latestActiveSpeechStartUs >= 0L && currentEndUs > lastPartialRequestedEndUs) {
            provisionalWindowHasSpeech = true;
        }
        if (starts != null && ends != null) {
            int count = Math.min(starts.length, ends.length);
            for (int i = 0; i < count; i++) {
                if (ends[i] > lastPartialRequestedEndUs) {
                    provisionalWindowHasSpeech = true;
                    break;
                }
            }
        }
    }

