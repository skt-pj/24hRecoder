extern "C" JNIEXPORT jstring JNICALL
Java_com_sktpj_recorder24h_transcription_LocalWhisperEngine_nativeProbeWhisper(
        JNIEnv * env,
        jclass,
        jstring model_path,
        jfloatArray pcm,
        jstring language,
        jint threads,
        jboolean use_gpu,
        jlong duration_ms,
        jstring profile,
        jstring diagnostic_path) {
    if (model_path == nullptr || pcm == nullptr || language == nullptr || profile == nullptr) {
        throw_runtime(env, "Invalid Vulkan probe arguments");
        return nullptr;
    }
    const std::string profile_value = jstring_utf8(env, profile);
    const std::string diagnostic = jstring_utf8(env, diagnostic_path);
    apply_probe_profile(profile_value);
    native_breadcrumb(diagnostic, "PROBE_PROFILE_APPLIED",
            std::string("\\\"profile\\\":\\\"") + json_escape(profile_value.c_str()) + "\\\""
                    + ",\\\"useGpu\\\":" + (use_gpu == JNI_TRUE ? "true" : "false")
                    + ",\\\"durationMs\\\":" + std::to_string(static_cast<long long>(duration_ms)));

    const jsize sample_count = env->GetArrayLength(pcm);
    if (sample_count <= 0) {
        throw_runtime(env, "Vulkan probe audio is empty");
        return nullptr;
    }
    const char * model = env->GetStringUTFChars(model_path, nullptr);
    const char * lang = env->GetStringUTFChars(language, nullptr);
    jfloat * samples = env->GetFloatArrayElements(pcm, nullptr);
    if (model == nullptr || lang == nullptr || samples == nullptr) {
        if (samples != nullptr) env->ReleaseFloatArrayElements(pcm, samples, JNI_ABORT);
        if (lang != nullptr) env->ReleaseStringUTFChars(language, lang);
        if (model != nullptr) env->ReleaseStringUTFChars(model_path, model);
        throw_runtime(env, "Unable to access Vulkan probe input");
        return nullptr;
    }

    if (use_gpu == JNI_TRUE) native_breadcrumb(diagnostic, "PROBE_GPU_BACKEND_CHECK_BEGIN");
    if (use_gpu == JNI_TRUE && !app_has_gpu_backend()) {
        native_breadcrumb(diagnostic, "PROBE_GPU_BACKEND_CHECK_FAILED");
        env->ReleaseFloatArrayElements(pcm, samples, JNI_ABORT);
        env->ReleaseStringUTFChars(language, lang);
        env->ReleaseStringUTFChars(model_path, model);
        throw_runtime(env, "Selected Vulkan GPU backend is unavailable");
        return nullptr;
    }
    if (use_gpu == JNI_TRUE) native_breadcrumb(diagnostic, "PROBE_GPU_BACKEND_CHECK_END");

    whisper_context_params context_params = whisper_context_default_params();
    context_params.use_gpu = use_gpu == JNI_TRUE;
    context_params.flash_attn = false;
    native_breadcrumb(diagnostic, "PROBE_MODEL_LOAD_BEGIN");
    const auto model_load_started = std::chrono::steady_clock::now();
    whisper_context * ctx = whisper_init_from_file_with_params(model, context_params);
    const auto model_load_finished = std::chrono::steady_clock::now();
    const long long model_load_ms = elapsed_ms(model_load_started, model_load_finished);
    native_breadcrumb(diagnostic, ctx == nullptr ? "PROBE_MODEL_LOAD_FAILED" : "PROBE_MODEL_LOAD_END",
            std::string("\\\"modelLoadMs\\\":") + std::to_string(model_load_ms));
    if (ctx == nullptr) {
        env->ReleaseFloatArrayElements(pcm, samples, JNI_ABORT);
        env->ReleaseStringUTFChars(language, lang);
        env->ReleaseStringUTFChars(model_path, model);
        throw_runtime(env, "Unable to load Whisper model in probe");
        return nullptr;
    }

    long long whisper_ms = 0;
    int result = 0;
    int used_samples = 0;
    int output_segments = 0;
    if (duration_ms > 0) {
        const long long requested_samples = static_cast<long long>(duration_ms) * 16LL;
        used_samples = static_cast<int>(std::max(0LL,
                std::min(requested_samples, static_cast<long long>(sample_count))));
        whisper_full_params params = whisper_full_default_params(WHISPER_SAMPLING_GREEDY);
        params.n_threads = threads > 0 ? threads : 1;
        params.translate = false;
        params.no_context = true;
        params.no_timestamps = false;
        params.print_progress = false;
        params.print_realtime = false;
        params.print_timestamps = false;
        params.language = lang;
        params.suppress_blank = true;
        params.suppress_nst = true;
        params.temperature = 0.0f;
        params.vad = false;
        native_breadcrumb(diagnostic, "PROBE_WHISPER_FULL_BEGIN",
                std::string("\\\"durationMs\\\":") + std::to_string(static_cast<long long>(duration_ms))
                        + ",\\\"sampleCount\\\":" + std::to_string(used_samples));
        const auto whisper_started = std::chrono::steady_clock::now();
        result = whisper_full(ctx, params, samples, used_samples);
        const auto whisper_finished = std::chrono::steady_clock::now();
        whisper_ms = elapsed_ms(whisper_started, whisper_finished);
        if (result == 0) output_segments = whisper_full_n_segments(ctx);
        native_breadcrumb(diagnostic, result == 0 ? "PROBE_WHISPER_FULL_END" : "PROBE_WHISPER_FULL_FAILED",
                std::string("\\\"result\\\":") + std::to_string(result)
                        + ",\\\"whisperMs\\\":" + std::to_string(whisper_ms)
                        + ",\\\"segments\\\":" + std::to_string(output_segments));
    }

    native_breadcrumb(diagnostic, "PROBE_MODEL_FREE_BEGIN");
    whisper_free(ctx);
    native_breadcrumb(diagnostic, "PROBE_MODEL_FREE_END");
    env->ReleaseFloatArrayElements(pcm, samples, JNI_ABORT);
    env->ReleaseStringUTFChars(language, lang);
    env->ReleaseStringUTFChars(model_path, model);
    if (result != 0) {
        throw_runtime(env, "whisper_full failed in Vulkan probe");
        return nullptr;
    }

    std::ostringstream output;
    output << "{\\\"profile\\\":\\\"" << json_escape(profile_value.c_str())
           << "\\\",\\\"useGpu\\\":" << (use_gpu == JNI_TRUE ? "true" : "false")
           << ",\\\"durationMs\\\":" << static_cast<long long>(duration_ms)
           << ",\\\"sampleCount\\\":" << used_samples
           << ",\\\"modelLoadMs\\\":" << model_load_ms
           << ",\\\"whisperFullMs\\\":" << whisper_ms
           << ",\\\"segmentCount\\\":" << output_segments << "}";
    native_breadcrumb(diagnostic, "PROBE_SUCCESS");
    return env->NewStringUTF(output.str().c_str());
}''',
            'native probe implementation')
    writeUtf8(nativeFile, nativeSource)
}

// The build-generated recovery class already records ApplicationExitInfo. Mark process boot as well,
// so its processStateSummary and the fsynced native file can be correlated by timestamp.
if (recoveryFile.isFile()) {
    def recovery = readUtf8(recoveryFile)
    if (!recovery.contains('POSTPROCESS_PROCESS_BOOT_DIAGNOSTIC')) {
        recovery = replaceOnce034(
                recovery,
                '''        if (!STARTED.compareAndSet(false, true)) return;
        logPreviousExit(app);
''',
                '''        if (!STARTED.compareAndSet(false, true)) return;
        PostprocessAsrDiagnostics.mark(app, "POSTPROCESS_PROCESS_BOOT_DIAGNOSTIC", null,
                null, null, null);
        logPreviousExit(app);
''',
                'postprocess recovery boot diagnostic')
        writeUtf8(recoveryFile, recovery)
    }
}

