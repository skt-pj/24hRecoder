    manifest = replaceOnce034(
            manifest,
            '''    </application>
</manifest>
''',
            '''        <service
            android:name=".transcription.VulkanProbeService"
            android:exported="false"
            android:process=":vulkan_probe" />

    </application>
</manifest>
''',
            'probe service manifest')
    writeUtf8(manifestFile, manifest)
}

