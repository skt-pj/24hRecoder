std::string jstring_utf8(JNIEnv * env, jstring value) {
    if (value == nullptr) return {};
    const char * raw = env->GetStringUTFChars(value, nullptr);
    if (raw == nullptr) return {};
    std::string out(raw);
    env->ReleaseStringUTFChars(value, raw);
    return out;
}

long long wall_clock_ms() {
    return std::chrono::duration_cast<std::chrono::milliseconds>(
            std::chrono::system_clock::now().time_since_epoch()).count();
}

void native_breadcrumb(const std::string & path, const char * stage, const std::string & details = {}) {
    if (path.empty() || stage == nullptr) return;
    FILE * file = fopen(path.c_str(), "a");
    if (file == nullptr) return;
    const char * coop = std::getenv("GGML_VK_DISABLE_COOPMAT");
    const char * graph = std::getenv("GGML_VK_DISABLE_GRAPH_OPTIMIZE");
    fprintf(file,
            "{\\\"timestampMs\\\":%lld,\\\"stage\\\":\\\"%s\\\",\\\"pid\\\":%d,\\\"tid\\\":%ld,"
            "\\\"coopmatOff\\\":\\\"%s\\\",\\\"graphOptimizeOff\\\":\\\"%s\\\"",
            wall_clock_ms(), stage, getpid(), static_cast<long>(syscall(SYS_gettid)),
            coop == nullptr ? "unset" : coop, graph == nullptr ? "unset" : graph);
    if (!details.empty()) fprintf(file, ",\\\"details\\\":{%s}", details.c_str());
    fprintf(file, "}\\n");
    fflush(file);
    fsync(fileno(file));
    fclose(file);
}

void apply_probe_profile(const std::string & profile) {
    unsetenv("GGML_VK_DISABLE_COOPMAT");
    unsetenv("GGML_VK_DISABLE_GRAPH_OPTIMIZE");
    if (profile == "vulkan-coopmat-off") {
        setenv("GGML_VK_DISABLE_COOPMAT", "1", 1);
    } else if (profile == "vulkan-graph-optimize-off") {
        setenv("GGML_VK_DISABLE_GRAPH_OPTIMIZE", "1", 1);
    } else if (profile == "vulkan-current-safe") {
        setenv("GGML_VK_DISABLE_COOPMAT", "1", 1);
        setenv("GGML_VK_DISABLE_GRAPH_OPTIMIZE", "1", 1);
    }
}

