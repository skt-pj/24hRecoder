import java.nio.charset.StandardCharsets

def readUtf8070 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8070 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce070 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.70 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}
def countOccurrences070 = { String source, String needle ->
    int count = 0
    int from = 0
    while (true) {
        int at = source.indexOf(needle, from)
        if (at < 0) break
        count++
        from = at + needle.length()
    }
    count
}
def replaceExpected070 = { String source, String oldText, String newText, int expected, String label ->
    int count = countOccurrences070(source, oldText)
    if (count != expected) {
        throw new GradleException("0.7.70 ${label}: expected ${expected} matches, got ${count}")
    }
    source.replace(oldText, newText)
}
def removeRange070 = { String source, String startMarker, String endMarker, String label ->
    int start = source.indexOf(startMarker)
    int secondStart = source.indexOf(startMarker, start + 1)
    if (start < 0 || secondStart >= 0) {
        throw new GradleException("0.7.70 ${label}: start marker must match exactly once")
    }
    int end = source.indexOf(endMarker, start)
    if (end < 0) {
        throw new GradleException("0.7.70 ${label}: end marker missing")
    }
    source.substring(0, start) + source.substring(end)
}

