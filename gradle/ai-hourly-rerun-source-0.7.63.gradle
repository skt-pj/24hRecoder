    public static SourceWindow buildSourceForRerun(Context context, long periodStartMs,
                                                    long periodEndMs, File analysisFile) {
        SourceWindow direct = buildSource(context, periodStartMs, periodEndMs);
        if (!direct.isEmpty()) return direct;

        Set<String> savedIds = savedSourceSegmentIds(analysisFile);
        if (savedIds.isEmpty()) return direct;

        List<SegmentRecord> records = new ArrayList<>(SegmentHistoryRepository.load(context));
        records.sort(Comparator.comparingLong(SegmentRecord::getStartedAtMs));
        List<SourceEntry> entries = new ArrayList<>();
        Set<String> segmentIds = new LinkedHashSet<>();
        int transcriptCount = 0;
        long lastInsidePeriod = Math.max(periodStartMs, periodEndMs - 1L);

        for (SegmentRecord record : records) {
            if (!savedIds.contains(record.getSegmentId())) continue;
            String transcript = record.getTranscriptText();
            if (transcript == null || transcript.trim().isEmpty()) continue;

            boolean includedRecord = false;
            long recordStart = record.getStartedAtMs() > 0L
                    ? record.getStartedAtMs() : record.getSortTimeMs();
            List<TranscriptChunk> chunks = record.getTranscriptChunks();
            if (chunks != null && !chunks.isEmpty()) {
                for (TranscriptChunk chunk : chunks) {
                    String text = chunk.getText() == null ? "" : chunk.getText().trim();
                    if (text.isEmpty()) continue;
                    long candidateStart = recordStart > 0L
                            ? recordStart + Math.max(0L, chunk.getStartMs()) : periodStartMs;
                    long candidateEnd = recordStart > 0L
                            ? recordStart + Math.max(chunk.getStartMs(), chunk.getEndMs())
                            : candidateStart + Math.max(1L, chunk.getEndMs() - chunk.getStartMs());
                    long mappedStart;
                    long mappedEnd;
                    if (candidateEnd > periodStartMs && candidateStart < periodEndMs) {
                        mappedStart = Math.max(periodStartMs, candidateStart);
                        mappedEnd = Math.min(periodEndMs, Math.max(mappedStart + 1L, candidateEnd));
                    } else {
                        // The source id proves this segment contributed to the original hourly run.
                        // If a later timestamp mapping no longer intersects, preserve its text and
                        // clamp only the evidence time instead of incorrectly declaring no source.
                        mappedStart = Math.max(periodStartMs, Math.min(lastInsidePeriod,
                                recordStart > 0L ? recordStart : periodStartMs));
                        long duration = Math.max(1L, chunk.getEndMs() - chunk.getStartMs());
                        mappedEnd = Math.min(periodEndMs, mappedStart + Math.min(duration, 300_000L));
                        if (mappedEnd <= mappedStart) mappedEnd = Math.min(periodEndMs, mappedStart + 1L);
                    }
                    String speaker = chunk.getSpeaker();
                    if (speaker == null || speaker.trim().isEmpty()) speaker = "判定不能";
                    entries.add(new SourceEntry(mappedStart, mappedEnd,
                            record.getSegmentId(), speaker, text));
                    includedRecord = true;
                }
            }

            if (!includedRecord) {
                long mappedStart = Math.max(periodStartMs, Math.min(lastInsidePeriod,
                        recordStart > 0L ? recordStart : periodStartMs));
                long recordEnd = record.getEndedAtMs() > recordStart
                        ? record.getEndedAtMs() : mappedStart + 1L;
                long mappedEnd = Math.min(periodEndMs, Math.max(mappedStart + 1L, recordEnd));
                String speaker = record.getTranscriptSpeaker();
                if (speaker == null || speaker.trim().isEmpty()) speaker = "判定不能";
                entries.add(new SourceEntry(mappedStart, mappedEnd, record.getSegmentId(),
                        speaker, transcript.trim()));
                includedRecord = true;
            }

            if (includedRecord) {
                transcriptCount++;
                segmentIds.add(record.getSegmentId());
            }
        }

        if (entries.isEmpty()) return direct;
        entries.sort(Comparator
                .comparingLong((SourceEntry entry) -> entry.startMs)
                .thenComparing(entry -> entry.segmentId));
        List<String> ids = new ArrayList<>(segmentIds);
        return new SourceWindow(periodStartMs, periodEndMs, entries, ids,
                transcriptCount, hash(entries));
    }

    private static Set<String> savedSourceSegmentIds(File analysisFile) {
        Set<String> ids = new LinkedHashSet<>();
        if (analysisFile == null || !analysisFile.isFile()) return ids;
        try {
            JSONObject row = new JSONObject(readUtf8(analysisFile));
            JSONArray sourceIds = row.optJSONArray("sourceSegmentIds");
            if (sourceIds == null) return ids;
            for (int i = 0; i < sourceIds.length(); i++) {
                String id = sourceIds.optString(i, "").trim();
                if (!id.isEmpty()) ids.add(id);
            }
        } catch (Exception ignored) {
        }
        return ids;
    }

