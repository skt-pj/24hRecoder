def readUtf8063 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8063 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce063 = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) {
        throw new GradleException("0.7.63 ${label}: expected exactly one match")
    }
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

