'''private data class NotebookPeriodActionSnapshot(
    val configured: Boolean,
    val hasSource: Boolean,
    val pendingTranscription: Boolean,
    val queueState: String?,
    val periodStarted: Boolean,
    val periodFinished: Boolean
)

@Composable
internal fun AiNotebookPeriodAnalysisButton(
    kind: String,
    periodStartMs: Long,
    periodEndMs: Long,
    hasResult: Boolean,
    modifier: Modifier = Modifier
) {
    val context = LocalContext.current
    var refreshToken by remember { mutableIntStateOf(0) }
    var snapshot by remember(kind, periodStartMs, periodEndMs) {
        mutableStateOf(
            NotebookPeriodActionSnapshot(
                configured = AiProviderStore.isConfigured(context),
                hasSource = false,
                pendingTranscription = false,
                queueState = null,
                periodStarted = periodStartMs <= System.currentTimeMillis(),
                periodFinished = periodEndMs <= System.currentTimeMillis()
            )
        )
    }

    LaunchedEffect(kind, periodStartMs, periodEndMs, refreshToken) {
        while (true) {
            snapshot = withContext(Dispatchers.IO) {
                val records = SegmentHistoryRepository.load(context.applicationContext)
                val queueState = AiQueueStore.load(context.applicationContext).firstOrNull {
                    it.kind == kind && it.periodStartMs == periodStartMs && it.periodEndMs == periodEndMs
                }?.state
                val nowMs = System.currentTimeMillis()
                NotebookPeriodActionSnapshot(
                    configured = AiProviderStore.isConfigured(context.applicationContext),
                    hasSource = notebookHasTranscriptSource(records, periodStartMs, periodEndMs),
                    pendingTranscription = notebookHasPendingTranscription(records, periodStartMs, periodEndMs),
                    queueState = queueState,
                    periodStarted = periodStartMs <= nowMs,
                    periodFinished = periodEndMs <= nowMs
                )
            }
            delay(1_000L)
        }
    }

    val isHourly = kind == AiAnalysisScheduler.KIND_HOURLY
    val activeQueue = snapshot.queueState != null && snapshot.queueState != AiQueueStore.STATE_FAILED
    val canRun = if (isHourly) {
        snapshot.configured && snapshot.periodFinished && !activeQueue && snapshot.hasSource
    } else {
        snapshot.configured && snapshot.periodStarted && !activeQueue &&
            !snapshot.pendingTranscription && snapshot.hasSource
    }
    val actionLabel = when {
        activeQueue -> notebookQueueStateLabel(snapshot.queueState)
        isHourly && !snapshot.periodFinished && snapshot.periodStarted -> "進行中"
        isHourly && !snapshot.periodStarted -> "未到達"
        snapshot.queueState == AiQueueStore.STATE_FAILED && snapshot.hasSource -> "再試行"
        hasResult && snapshot.hasSource -> if (isHourly) "再実行" else "再分析"
        hasResult -> if (isHourly) "再実行不可" else "再分析不可"
        snapshot.hasSource -> if (isHourly) "実行" else "分析"
        snapshot.pendingTranscription -> "待機"
        else -> "実行不可"
    }

    Button(
        onClick = {
            val queued = AiAnalysisScheduler.enqueuePeriod(
                context,
                kind,
                periodStartMs,
                periodEndMs
            )
            val message = when {
                !queued -> "AI要約を登録できませんでした"
                isHourly -> "この時間帯をAI要約キューに追加しました"
                else -> "この1日をAI要約キューに追加しました"
            }
            Toast.makeText(context, message, Toast.LENGTH_SHORT).show()
            if (queued) refreshToken++
        },
        enabled = canRun,
        modifier = modifier
    ) {
        Text(actionLabel)
    }
}

