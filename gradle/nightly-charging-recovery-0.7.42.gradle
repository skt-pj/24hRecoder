import java.nio.charset.StandardCharsets

def readUtf8042r = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8042r = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceOnce042r = { String source, String oldText, String newText, String label ->
    int first = source.indexOf(oldText)
    int last = source.lastIndexOf(oldText)
    if (first < 0 || first != last) throw new GradleException("0.7.42 charging recovery ${label}: expected exactly one match")
    source.substring(0, first) + newText + source.substring(first + oldText.length())
}

// 0.7.36 rotates interrupted work to the back of the queue. Preserve NIGHTLY_HOURLY lineage
// while doing so; otherwise a process crash could turn a charging-only item into generic work.
def schedulerFile = rootProject.file('app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionScheduler.java')
def scheduler = readUtf8042r(schedulerFile)
scheduler = replaceOnce042r(scheduler,
'''                            "QUEUED",
                            "RECOVERED_INTERRUPTED_TRANSCRIPTION_WORK_ENQUEUED");
''',
'''                            "QUEUED",
                            NightlyHourlyTranscriptionScheduler.isNightlyQueueItem(record)
                                    ? "NIGHTLY_HOURLY_RECOVERED_INTERRUPTED_TRANSCRIPTION_WORK_ENQUEUED"
                                    : "RECOVERED_INTERRUPTED_TRANSCRIPTION_WORK_ENQUEUED");
''', 'main recovery lineage')
writeUtf8042r(schedulerFile, scheduler)

// The isolated :postprocess_asr process has its own recovery class generated by the root build.
// Keep the same nightly marker there too so native crashes cannot bypass the charger gate.
def recoveryFile = rootProject.file('app/src/main/java/com/sktpj/recorder24h/transcription/PostprocessProcessRecovery.java')
if (!recoveryFile.isFile()) throw new GradleException('0.7.42 PostprocessProcessRecovery.java missing')
def recovery = readUtf8042r(recoveryFile)
recovery = replaceOnce042r(recovery,
'''                    "QUEUED",
                    "RECOVERED_POSTPROCESS_PROCESS_RESTART_WORK_ENQUEUED");
''',
'''                    "QUEUED",
                    NightlyHourlyTranscriptionScheduler.isNightlyQueueItem(record)
                            ? "NIGHTLY_HOURLY_RECOVERED_POSTPROCESS_PROCESS_RESTART_WORK_ENQUEUED"
                            : "RECOVERED_POSTPROCESS_PROCESS_RESTART_WORK_ENQUEUED");
''', 'postprocess recovery lineage')
writeUtf8042r(recoveryFile, recovery)

if (!schedulerFile.text.contains('NIGHTLY_HOURLY_RECOVERED_INTERRUPTED_TRANSCRIPTION_WORK_ENQUEUED')) throw new GradleException('0.7.42 main nightly recovery marker missing')
if (!recoveryFile.text.contains('NIGHTLY_HOURLY_RECOVERED_POSTPROCESS_PROCESS_RESTART_WORK_ENQUEUED')) throw new GradleException('0.7.42 postprocess nightly recovery marker missing')
