'''    public static SourceWindow buildDailySourceFromHourlyAnalyses(
            Context context, long periodStartMs, long periodEndMs) {
        List<SourceEntry> entries = new ArrayList<>();
        List<String> sourceIds = new ArrayList<>();
        ZoneId zone = ZoneId.systemDefault();
        java.time.ZonedDateTime cursor = Instant.ofEpochMilli(periodStartMs).atZone(zone)
                .withMinute(0).withSecond(0).withNano(0);
        if (cursor.toInstant().toEpochMilli() < periodStartMs) cursor = cursor.plusHours(1);

        while (cursor.toInstant().toEpochMilli() < periodEndMs) {
            long hourStartMs = cursor.toInstant().toEpochMilli();
            long hourEndMs = Math.min(periodEndMs, cursor.plusHours(1).toInstant().toEpochMilli());
            File hourly = hourlyFile(context, hourStartMs);
            if (hourly.isFile()) {
                try {
                    JSONObject row = new JSONObject(readUtf8(hourly));
                    JSONObject analysis = row.optJSONObject("analysis");
                    if (analysis != null && analysis.length() > 0) {
                        JSONObject note = new JSONObject();
                        note.put("periodStartMs", row.optLong("periodStartMs", hourStartMs));
                        note.put("periodEndMs", row.optLong("periodEndMs", hourEndMs));
                        note.put("generatedAtMs", row.optLong("generatedAtMs", 0L));
                        note.put("model", row.optString("model", ""));
                        note.put("analysis", new JSONObject(analysis.toString()));
                        String sourceId = "hourly-ai:" + hourStartMs;
                        entries.add(new SourceEntry(
                                hourStartMs,
                                hourEndMs,
                                sourceId,
                                "1時間AI要約",
                                note.toString()));
                        sourceIds.add(sourceId);
                    }
                } catch (Exception ignored) {
                    // Invalid hourly result is not evidence for the daily note.
                }
            }
            cursor = cursor.plusHours(1);
        }

        return new SourceWindow(
                periodStartMs,
                periodEndMs,
                entries,
                sourceIds,
                entries.size(),
                hash(entries));
    }

    public static boolean hasHourlyAnalysisSource(
            Context context, long periodStartMs, long periodEndMs) {
        return !buildDailySourceFromHourlyAnalyses(context, periodStartMs, periodEndMs).isEmpty();
    }

    public static boolean hasPendingHourlyAnalysisSource(
            Context context, long periodStartMs, long periodEndMs) {
        ZoneId zone = ZoneId.systemDefault();
        java.time.ZonedDateTime cursor = Instant.ofEpochMilli(periodStartMs).atZone(zone)
                .withMinute(0).withSecond(0).withNano(0);
        if (cursor.toInstant().toEpochMilli() < periodStartMs) cursor = cursor.plusHours(1);
        long nowMs = System.currentTimeMillis();
        while (cursor.toInstant().toEpochMilli() < periodEndMs) {
            long hourStartMs = cursor.toInstant().toEpochMilli();
            long hourEndMs = Math.min(periodEndMs, cursor.plusHours(1).toInstant().toEpochMilli());
            if (hourEndMs > nowMs) break;
            SourceWindow transcriptSource = buildSource(context, hourStartMs, hourEndMs);
            if (!transcriptSource.isEmpty() && !hourlyFile(context, hourStartMs).isFile()) {
                return true;
            }
            cursor = cursor.plusHours(1);
        }
        return false;
    }

    public static String promptHourlyAnalyses(SourceWindow source) {
        ZoneId zone = ZoneId.systemDefault();
        StringBuilder text = new StringBuilder();
        for (SourceEntry entry : source.entries) {
            String start = PROMPT_TIME.format(Instant.ofEpochMilli(entry.startMs).atZone(zone));
            String end = PROMPT_TIME.format(Instant.ofEpochMilli(entry.endMs).atZone(zone));
            text.append('[').append(start).append(" - ").append(end).append("] ")
                    .append(entry.text).append('\\n');
        }
        return text.toString();
    }

