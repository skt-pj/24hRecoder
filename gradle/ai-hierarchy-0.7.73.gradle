import java.nio.charset.StandardCharsets

def readUtf8073 = { File file -> new String(file.bytes, StandardCharsets.UTF_8) }
def writeUtf8073 = { File file, String text -> file.setText(text, 'UTF-8') }
def replaceFirst073 = { String source, String oldText, String newText, String label ->
    int at = source.indexOf(oldText)
    if (at < 0) throw new GradleException("0.7.73 ${label}: match not found")
    source.substring(0, at) + newText + source.substring(at + oldText.length())
}

