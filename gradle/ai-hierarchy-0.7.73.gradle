String button073 = '''@Composable
internal fun AiNotebookPeriodAnalysisButton(
    kind: String,
    periodStartMs: Long,
    periodEndMs: Long,
    hasResult: Boolean,
    modifier: Modifier = Modifier
) {
    val context = LocalContext.current
    var refreshToken by remember { mutableIntStateOf(0) }
    var snapshot by remember(kind, periodStartMs, periodEndMs) {
        mutableStateOf(
            NotebookPeriodActionSnapshot(
                configured = AiProviderStore.isConfigured(context),
                persistedResult = hasResult,
                hasSource = false,
                hasRetranscribableAudio = false,
                pendingTranscription = false,
                queueState = null,
                periodStarted = periodStartMs <= System.currentTimeMillis(),
                periodFinished = periodEndMs <= System.currentTimeMillis()
            )
        )
    }

    LaunchedEffect(kind, periodStartMs, periodEndMs, refreshToken) {
        while (true) {
            snapshot = withContext(Dispatchers.IO) {
                val app = context.applicationContext
                val records = SegmentHistoryRepository.load(app)
                val queueState = AiQueueStore.load(app).firstOrNull {
                    it.kind == kind && it.periodStartMs == periodStartMs && it.periodEndMs == periodEndMs
                }?.state
                val nowMs = System.currentTimeMillis()
                val hourly = kind == AiAnalysisScheduler.KIND_HOURLY
                NotebookPeriodActionSnapshot(
                    configured = AiProviderStore.isConfigured(app),
                    persistedResult = hasResult,
                    hasSource = if (hourly) {
                        notebookHasTranscriptSource(records, periodStartMs, periodEndMs)
                    } else {
                        AiAnalysisRepository.hasHourlyAnalysisSource(app, periodStartMs, periodEndMs)
                    },
                    hasRetranscribableAudio = hourly && notebookHasRetranscribableAudio(
                        records, periodStartMs, periodEndMs
                    ),
                    pendingTranscription = if (hourly) {
                        notebookHasPendingTranscription(records, periodStartMs, periodEndMs)
                    } else {
                        AiAnalysisRepository.hasPendingHourlyAnalysisSource(app, periodStartMs, periodEndMs)
                    },
                    queueState = queueState,
                    periodStarted = periodStartMs <= nowMs,
                    periodFinished = periodEndMs <= nowMs
                )
            }
            delay(1_000L)
        }
    }

    val hourly = kind == AiAnalysisScheduler.KIND_HOURLY
    val actionLabel = when {
        hourly && snapshot.hasSource -> "再要約"
        hourly -> "再文字起こし"
        hasResult -> "再要約"
        else -> "要約"
    }

    Button(
        onClick = {
            if (hourly && !snapshot.hasSource) {
                val queuedCount = enqueueNotebookRetranscription(
                    context.applicationContext,
                    periodStartMs,
                    periodEndMs
                )
                Toast.makeText(
                    context,
                    if (queuedCount > 0) {
                        "${queuedCount}件を再文字起こしキューに追加しました"
                    } else {
                        "文字起こしデータがなく、再文字起こしできる音声ファイルもありません"
                    },
                    Toast.LENGTH_SHORT
                ).show()
                if (queuedCount > 0) refreshToken++
            } else if (!snapshot.hasSource) {
                Toast.makeText(
                    context,
                    "この日の時間別要約データがありません",
                    Toast.LENGTH_SHORT
                ).show()
            } else if (!snapshot.configured) {
                Toast.makeText(
                    context,
                    "AI要約を実行するにはAI設定が必要です",
                    Toast.LENGTH_SHORT
                ).show()
            } else {
                val queued = AiAnalysisScheduler.enqueuePeriod(
                    context,
                    kind,
                    periodStartMs,
                    periodEndMs
                )
                Toast.makeText(
                    context,
                    if (queued) {
                        if (hourly) "この時間帯を再要約キューに追加しました"
                        else "この1日を要約キューに追加しました"
                    } else {
                        "AI要約を登録できませんでした"
                    },
                    Toast.LENGTH_SHORT
                ).show()
                if (queued) refreshToken++
            }
        },
        enabled = true,
        modifier = modifier
    ) {
        Text(actionLabel)
    }
}

