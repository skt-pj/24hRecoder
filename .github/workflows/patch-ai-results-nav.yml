name: Patch AI results navigation

on:
  push:
    branches: ["agent/add-ai-results-screen"]
    paths: [".github/workflows/patch-ai-results-nav.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-ai-results-screen
          fetch-depth: 0
      - name: Patch navigation and release version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'import androidx.compose.material.icons.filled.Settings\n',
                  'import androidx.compose.material.icons.filled.Settings\nimport androidx.compose.material.icons.filled.Star\n'
              ),
              (
                  '    HOME("ホーム"), QUEUE("キュー"), HISTORY("記録"), SETTINGS("設定")\n',
                  '    HOME("ホーム"), QUEUE("キュー"), HISTORY("記録"), AI("AIノート"), SETTINGS("設定")\n'
              ),
              (
                  '                        if ((section == AppSection.HISTORY || section == AppSection.QUEUE) && selected == null) {\n',
                  '                        if ((section == AppSection.HISTORY || section == AppSection.QUEUE || section == AppSection.AI) && selected == null) {\n'
              ),
              (
                  '                        section == AppSection.HISTORY -> HistoryScreen(records) { selectedId = it.segmentId }\n                        else -> SettingsScreen(\n',
                  '                        section == AppSection.HISTORY -> HistoryScreen(records) { selectedId = it.segmentId }\n                        section == AppSection.AI -> AiAnalysisScreen(\n                            refreshToken = refresh,\n                            onOpenSettings = { section = AppSection.SETTINGS }\n                        )\n                        else -> SettingsScreen(\n'
              ),
              (
                  '    AppSection.HISTORY -> "記録"\n    AppSection.SETTINGS -> "設定"\n',
                  '    AppSection.HISTORY -> "記録"\n    AppSection.AI -> "AIノート"\n    AppSection.SETTINGS -> "設定"\n'
              ),
              (
                  '        AppSection.HISTORY -> Icons.Filled.List\n        AppSection.SETTINGS -> Icons.Filled.Settings\n',
                  '        AppSection.HISTORY -> Icons.Filled.List\n        AppSection.AI -> Icons.Filled.Star\n        AppSection.SETTINGS -> Icons.Filled.Settings\n'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one MainActivity match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle')
          build = gradle.read_text(encoding='utf-8')
          for old, new in [("versionCode 18", "versionCode 19"), ("versionName '0.5.0'", "versionName '0.5.1'")]:
              count = build.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one build.gradle match, got {count}: {old!r}')
              build = build.replace(old, new, 1)
          gradle.write_text(build, encoding='utf-8')

          Path('.github/workflows/patch-ai-results-nav.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sktpj/recorder24h/MainActivity.kt app/build.gradle .github/workflows/patch-ai-results-nav.yml
          git commit -m "Expose Luna analysis results in UI"
          git push origin HEAD:agent/add-ai-results-screen
