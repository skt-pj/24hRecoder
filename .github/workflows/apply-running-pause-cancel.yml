name: Apply active transcription cancellation

on:
  push:
    branches:
      - agent/pause-backlog-during-live-0.7.17
    paths:
      - .github/workflows/apply-running-pause-cancel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pause-backlog-during-live-0.7.17
      - name: Apply patch
        run: python .github/scripts/apply_running_pause_cancel.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet && exit 0
          git commit -m "Abort active transcription when queue is paused"
          git push origin HEAD:agent/pause-backlog-during-live-0.7.17
