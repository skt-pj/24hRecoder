name: Patch v0.4.10 manual retranscription status

on:
  push:
    branches:
      - work/manual-retranscription-status-v0.4.10

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.4.10 manual status patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/manual-retranscription-status-v0.4.10
          fetch-depth: 0
      - name: Apply v0.4.10 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old[:140]!r}")
              p.write_text(s.replace(old, new, count))

          # Scheduler: publish QUEUED immediately and let a manual request replace the
          # queued automatic work for the same segment instead of creating a duplicate.
          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionScheduler.java'
          replace(path,
              'import com.sktpj.recorder24h.storage.StoragePolicy;\n',
              'import com.sktpj.recorder24h.storage.SegmentRepository;\nimport com.sktpj.recorder24h.storage.StoragePolicy;\n')
          replace(path,
              '    public static boolean enqueueForceRetranscription(Context context, String segmentId, File file) {\n        return enqueueInternal(context, segmentId, file, true, ExistingWorkPolicy.KEEP);\n    }',
              '    public static boolean enqueueForceRetranscription(Context context, String segmentId, File file) {\n        return enqueueInternal(context, segmentId, file, true, ExistingWorkPolicy.REPLACE);\n    }')
          replace(path,
              '        WorkManager.getInstance(context.getApplicationContext()).enqueueUniqueWork(\n                forceRetranscribe ? forceWorkName(segmentId) : uniqueWorkName(segmentId),\n                workPolicy,\n                request);\n        if (forceRetranscribe) {',
              '        WorkManager.getInstance(context.getApplicationContext()).enqueueUniqueWork(\n                uniqueWorkName(segmentId),\n                workPolicy,\n                request);\n\n        boolean replacingExistingTranscript = TranscriptionRepository.exists(context, segmentId);\n        String queuedReason = forceRetranscribe\n                ? "MANUAL_RETRANSCRIPTION_WORK_ENQUEUED"\n                : replacingExistingTranscript\n                    ? "LOCAL_RETRANSCRIPTION_WORK_ENQUEUED"\n                    : "LOCAL_TRANSCRIPTION_WORK_ENQUEUED";\n        SegmentRepository.appendWithoutNotify(context, segmentId, file, 0L,\n                System.currentTimeMillis(), "QUEUED", queuedReason);\n\n        if (forceRetranscribe) {')
          replace(path,
              '    private static String forceWorkName(String segmentId) {\n        return "manual-retranscribe:" + segmentId;\n    }\n\n',
              '')

          # Preserve QUEUED and its reason in UI history instead of flattening it to READY.
          path = 'app/src/main/java/com/sktpj/recorder24h/ui/SegmentHistoryRepository.kt'
          replace(path,
              '                            // QUEUED is an internal scheduler state: a Worker has started but is\n                            // waiting for the single local Whisper inference slot. User-facing UI\n                            // should present that as ordinary waiting, not active transcription.\n                            val status = if (rawStatus == "QUEUED") "READY" else rawStatus\n                            val reason = if (rawStatus == "QUEUED") null else rawReason\n',
              '                            // Keep QUEUED distinct from READY. The detail screen uses the\n                            // reason to show whether this is an automatic queue or a user-requested\n                            // retranscription, while still distinguishing it from active inference.\n                            val status = rawStatus\n                            val reason = rawReason\n')

          # Worker: keep manual retry/failure reasons manual so UI can continue to identify them.
          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionWorker.java'
          replace(path,
              '                boolean retry = getRunAttemptCount() + 1 < MAX_ATTEMPTS;\n                SegmentRepository.append(context, segmentId, audioFile, audioFile.lastModified(),\n                        System.currentTimeMillis(), retry ? "RETRY_WAIT" : "FAILED",\n                        retry ? "LOCAL_TRANSCRIPTION_RETRY" : "LOCAL_TRANSCRIPTION_FAILED");',
              '                boolean retry = getRunAttemptCount() + 1 < MAX_ATTEMPTS;\n                String stateReason = forceRetranscribe\n                        ? (retry ? "MANUAL_RETRANSCRIPTION_RETRY" : "MANUAL_RETRANSCRIPTION_FAILED")\n                        : (retry ? "LOCAL_TRANSCRIPTION_RETRY" : "LOCAL_TRANSCRIPTION_FAILED");\n                SegmentRepository.append(context, segmentId, audioFile, audioFile.lastModified(),\n                        System.currentTimeMillis(), retry ? "RETRY_WAIT" : "FAILED", stateReason);')

          # UI: refresh detail every second, expose persistent queue/running state, and let a
          # manual request replace an automatically queued request for the same segment.
          path = 'app/src/main/java/com/sktpj/recorder24h/MainActivity.kt'
          replace(path,
              '    LaunchedEffect(section, refresh) {\n        if (section == AppSection.HISTORY) {\n            do {\n                records = withContext(Dispatchers.IO) { SegmentHistoryRepository.load(context) }\n                delay(5_000L)\n            } while (section == AppSection.HISTORY)\n        }\n    }',
              '    LaunchedEffect(section, refresh, selectedId) {\n        if (section == AppSection.HISTORY) {\n            do {\n                records = withContext(Dispatchers.IO) { SegmentHistoryRepository.load(context) }\n                delay(if (selectedId != null) 1_000L else 5_000L)\n            } while (section == AppSection.HISTORY)\n        }\n    }')
          replace(path,
              '    val retranscriptionActive = record.hasTranscript && record.status in setOf("QUEUED", "TRANSCRIBING", "RETRY_WAIT")\n    val canRetranscribe = record.audioAvailable && record.audioPath != null\n',
              '    val manualRetranscriptionActive = isManualRetranscriptionState(record) &&\n        record.status in setOf("QUEUED", "READY", "TRANSCRIBING", "RETRY_WAIT")\n    val retranscriptionActive = manualRetranscriptionActive ||\n        (record.hasTranscript && record.status in setOf("QUEUED", "TRANSCRIBING", "RETRY_WAIT"))\n    val canRetranscribe = record.audioAvailable && record.audioPath != null\n')
          replace(path,
              '            if (text == null) {\n',
              '            transcriptionActivityMessage(record)?.let { message ->\n                Surface(\n                    color = MaterialTheme.colorScheme.secondaryContainer,\n                    shape = RoundedCornerShape(12.dp),\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    Text(\n                        message,\n                        style = MaterialTheme.typography.bodyMedium,\n                        color = MaterialTheme.colorScheme.onSecondaryContainer,\n                        modifier = Modifier.padding(12.dp)\n                    )\n                }\n            }\n            if (text == null) {\n',
              count=1)
          replace(path,
              '                    enabled = record.status !in setOf("QUEUED", "TRANSCRIBING", "RETRY_WAIT"),\n',
              '                    enabled = record.status !in setOf("TRANSCRIBING", "RETRY_WAIT") && !manualRetranscriptionActive,\n')
          replace(path,
              '                    Text(if (retranscriptionActive) "再文字起こし中…" else "この音声を再文字起こし")\n',
              '                    Text(when {\n                        manualRetranscriptionActive && record.status == "TRANSCRIBING" -> "手動再文字起こし中…"\n                        manualRetranscriptionActive -> "手動再文字起こし待ち…"\n                        record.status == "QUEUED" -> "この音声を手動で再文字起こし"\n                        else -> "この音声を再文字起こし"\n                    })\n')
          replace(path,
              'private fun transcriptClipboardText(record: SegmentRecord): String {',
              '''private fun isManualRetranscriptionState(record: SegmentRecord): Boolean {
    val reason = record.reason.orEmpty()
    return reason.startsWith("MANUAL_RETRANSCRIPTION") || reason == "MANUAL_RETRANSCRIBING"
}

private fun transcriptionActivityMessage(record: SegmentRecord): String? {
    return when {
        isManualRetranscriptionState(record) && record.status == "QUEUED" ->
            "手動再文字起こしを登録済みです。Whisper処理枠または低バッテリー制約の解除を待っています。"
        isManualRetranscriptionState(record) && record.status == "READY" ->
            "手動再文字起こしの開始待ちです。"
        isManualRetranscriptionState(record) && record.status == "TRANSCRIBING" ->
            "Whisper large-v3 Q5で手動再文字起こし中です。"
        isManualRetranscriptionState(record) && record.status == "RETRY_WAIT" ->
            "手動再文字起こしが一時失敗し、再試行を待っています。"
        record.status == "QUEUED" ->
            "自動文字起こしを登録済みです。Whisper処理枠または低バッテリー制約の解除を待っています。"
        record.status == "TRANSCRIBING" ->
            "Whisper large-v3 Q5で端末内文字起こし中です。"
        record.status == "RETRY_WAIT" ->
            "文字起こしが一時失敗し、再試行を待っています。"
        record.status == "READY" && record.audioAvailable ->
            "音声は保存済みです。文字起こしWorkerの登録またはモデル準備を待っています。"
        else -> null
    }
}

private fun transcriptClipboardText(record: SegmentRecord): String {''')
          replace(path,
              'private fun recordStatusLabel(record: SegmentRecord): String {\n    if (record.hasTranscript) {',
              '''private fun recordStatusLabel(record: SegmentRecord): String {
    if (isManualRetranscriptionState(record)) {
        return when (record.status) {
            "QUEUED", "READY" -> "手動再文字起こし待ち"
            "TRANSCRIBING" -> "手動再文字起こし中"
            "RETRY_WAIT" -> "手動再文字起こし再試行待ち"
            "FAILED" -> "手動再文字起こし失敗"
            else -> if (record.hasTranscript) "文字起こし済み" else record.status
        }
    }
    if (record.hasTranscript) {''')

          # Version + README.
          path = 'app/build.gradle'
          replace(path, "        versionCode 13\n        versionName '0.4.9'", "        versionCode 14\n        versionName '0.4.10'")

          path = 'README.md'
          replace(path, '- 現在のdebug APK: `0.4.9-debug` / versionCode 13', '- 現在のdebug APK: `0.4.10-debug` / versionCode 14')
          marker = '## 文字起こしキュー\n'
          addition = '''### 0.4.10: 手動再文字起こしの状態可視化\n\n0.4.9ではQUEUEDをUI読込時にREADYへ変換していたため、記録詳細から「この音声を再文字起こし」を押しても状態表示が変わらず、WorkManagerへ登録されたか判断できなかった。0.4.10ではQUEUEDとreasonをそのままUIへ渡し、WorkManagerへenqueueした直後にjournalへQUEUEDを書き込む。手動要求は`MANUAL_RETRANSCRIPTION_WORK_ENQUEUED`、実推論枠待ちは`MANUAL_RETRANSCRIPTION_SLOT_WAIT`、実処理中は`MANUAL_RETRANSCRIBING`として区別する。\n\n手動再文字起こしは自動処理と同じ`transcribe:<segmentId>` unique workをREPLACEで使用し、同じ音声について自動Workと手動Workが二重に走ることを避ける。詳細画面は1秒ごとに履歴状態を再読込し、「登録済み・処理枠待ち」「large-v3 Q5で処理中」「再試行待ち」を本文の上に明示する。\n\n'''
          p = Path(path)
          s = p.read_text()
          if marker not in s:
              raise SystemExit('README marker missing')
          p.write_text(s.replace(marker, addition + marker, 1))
          PY

      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app README.md
          git commit -m "Show manual retranscription queue and running state"
          git push origin HEAD:work/manual-retranscription-status-v0.4.10
