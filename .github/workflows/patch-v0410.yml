name: Patch v0.4.10 manual retranscription status

on:
  push:
    branches:
      - work/manual-retranscription-status-v0.4.10

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.4.10 manual status patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/manual-retranscription-status-v0.4.10
          fetch-depth: 0
      - name: Apply v0.4.10 changes
        run: |
          sed -i 's/- 現在のdebug APK: `0.4.8-debug` \/ versionCode 12/- 現在のdebug APK: `0.4.9-debug` \/ versionCode 13/' README.md
          python3 .github/patch-v0410.py
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app README.md
          git commit -m "Show manual retranscription queue and running state"
          git push origin HEAD:work/manual-retranscription-status-v0.4.10
