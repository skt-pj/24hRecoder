name: Apply 0.7.27 source migration

on:
  push:
    branches:
      - agent/live-model-finalize-0.7.27
    paths:
      - tools/apply_live_model_finalize_0_7_27.py
      - .github/workflows/apply-0.7.27.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-0.7.27-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-model-finalize-0.7.27
          fetch-depth: 0

      - name: Apply source migration
        run: python3 tools/apply_live_model_finalize_0_7_27.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit migrated source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard app/src/main/java/com/sktpj/recorder24h/transcription/LiveTranscriptionSettings.java app/src/main/java/com/sktpj/recorder24h/transcription/LiveSegmentPolicyStore.java)" ]; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/com/sktpj/recorder24h/MainActivity.kt \
            app/src/main/java/com/sktpj/recorder24h/WhisperModelSettingsCard.kt \
            app/src/main/java/com/sktpj/recorder24h/TranscriptionBackendSettingsCard.kt \
            app/src/main/java/com/sktpj/recorder24h/ui/SegmentHistoryRepository.kt \
            app/src/main/java/com/sktpj/recorder24h/transcription/FullStreamingTranscriptionCoordinator.java \
            app/src/main/java/com/sktpj/recorder24h/transcription/StreamingTranscriptionService.java \
            app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionRepository.java \
            app/src/main/java/com/sktpj/recorder24h/transcription/LiveTranscriptionSettings.java \
            app/src/main/java/com/sktpj/recorder24h/transcription/LiveSegmentPolicyStore.java
          git commit -m "Separate live and five-minute final transcription"
          git push origin HEAD:agent/live-model-finalize-0.7.27
