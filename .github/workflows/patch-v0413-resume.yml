name: Patch v0.4.13 queued-work resume
on:
  push:
    branches: [work/direct-user-queue-v0.4.13]
    paths: ['.github/workflows/patch-v0413-resume.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/direct-user-queue-v0.4.13
      - name: Patch MainActivity queue resume
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          s = p.read_text()
          old = '''    LaunchedEffect(Unit) {\n        while (true) {\n            dashboard = withContext(Dispatchers.IO) { readDashboard(context) }\n            delay(2_000L)\n        }\n    }'''
          new = '''    LaunchedEffect(Unit) {\n        val hasQueuedTranscription = withContext(Dispatchers.IO) {\n            SegmentHistoryRepository.load(context).any {\n                it.status == "QUEUED" || it.status == "RETRY_WAIT"\n            }\n        }\n        if (hasQueuedTranscription) {\n            com.sktpj.recorder24h.transcription.TranscriptionQueueService.kick(context)\n        }\n        while (true) {\n            dashboard = withContext(Dispatchers.IO) { readDashboard(context) }\n            delay(2_000L)\n        }\n    }'''
          if old not in s:
              raise SystemExit('target LaunchedEffect block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/recorder24h/MainActivity.kt
          git commit -m 'Resume queued transcription when app becomes visible'
          git push origin HEAD:work/direct-user-queue-v0.4.13
