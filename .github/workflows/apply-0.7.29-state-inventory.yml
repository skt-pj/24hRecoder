name: Apply 0.7.29 state inventory

on:
  push:
    branches: ["agent/state-inventory-0.7.29"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-inventory-0.7.29
          fetch-depth: 0
      - name: Apply source migration
        run: python3 tools/apply_state_inventory_0_7_29.py
      - name: Validate source shape
        run: |
          set -euo pipefail
          grep -q "versionCode 1029" app/build.gradle
          grep -q "versionName '0.7.29'" app/build.gradle
          grep -q 'Meter("保持音声"' app/src/main/java/com/sktpj/recorder24h/MainActivity.kt
          grep -q '24hRecoder_segment_inventory.json' app/src/main/java/com/sktpj/recorder24h/util/DriveLogSync.java
          grep -q 'TRANSCRIPTION_LIVE_ORPHANS_RECONCILED' app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionScheduler.java
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Audit and reconcile recording state inventory"
          git push origin HEAD:agent/state-inventory-0.7.29
