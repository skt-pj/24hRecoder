name: Patch retranscription retry-wait UI

on:
  push:
    branches:
      - work/manual-retranscribe-v0.4.4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/manual-retranscribe-v0.4.4
          fetch-depth: 0
      - name: Patch retry wait button state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          s = p.read_text()
          old = 'enabled = record.status !in setOf("QUEUED", "TRANSCRIBING"),'
          new = 'enabled = record.status !in setOf("QUEUED", "TRANSCRIBING", "RETRY_WAIT"),'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('button state target not found')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sktpj/recorder24h/MainActivity.kt
          git commit -m "Disable manual retranscription while retrying"
          git push origin HEAD:work/manual-retranscribe-v0.4.4
