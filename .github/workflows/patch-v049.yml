name: Patch v0.4.9

on:
  push:
    branches:
      - work/transcript-timeline-reset-v0.4.9

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run v0.4.9 patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transcript-timeline-reset-v0.4.9
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-v049.py
      - name: Commit patched source
        run: |
          git rm .github/workflows/patch-v049.yml .github/patch-v049.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "Add timestamped conversation logs and reset transcription state"
          git push origin HEAD:work/transcript-timeline-reset-v0.4.9
