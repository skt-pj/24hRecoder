name: Patch v0.4.9 transcript timeline reset

on:
  push:
    branches:
      - work/transcript-timeline-reset-v0.4.9

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v0.4.9 transcript timeline reset patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transcript-timeline-reset-v0.4.9
          fetch-depth: 0
      - name: Apply v0.4.9 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:160]!r}")
              p.write_text(s.replace(old, new, count))

          # Persist decoder time segments in canonical transcript JSON.
          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionRepository.java'
          replace(path, 'import org.json.JSONObject;\n', 'import org.json.JSONArray;\nimport org.json.JSONObject;\n')
          replace(path,
              '    public static void save(Context context, String segmentId, File audioFile, String model, String text)\n            throws Exception {\n        synchronized (LOCK) {',
              '    public static void save(Context context, String segmentId, File audioFile, String model, String text)\n            throws Exception {\n        save(context, segmentId, audioFile, model, text, null);\n    }\n\n    public static void save(Context context, String segmentId, File audioFile, String model, String text,\n                            JSONArray segments) throws Exception {\n        synchronized (LOCK) {')
          replace(path,
              '            JSONObject row = new JSONObject();\n            row.put("segmentId", segmentId);',
              '            JSONObject row = new JSONObject();\n            row.put("schemaVersion", 2);\n            row.put("segmentId", segmentId);')
          replace(path,
              '            row.put("text", text == null ? "" : text);\n',
              '            row.put("text", text == null ? "" : text);\n            row.put("segments", segments == null ? new JSONArray() : new JSONArray(segments.toString()));\n')

          # Segment journal supports state-only resets without triggering the ready broadcast.
          path = 'app/src/main/java/com/sktpj/recorder24h/storage/SegmentRepository.java'
          replace(path,
              '    public static void append(Context context, String segmentId, File file, long startedAtMs,\n                              long endedAtMs, String status, String reason) {\n        boolean newlyReady = "READY".equals(status)',
              '    public static void append(Context context, String segmentId, File file, long startedAtMs,\n                              long endedAtMs, String status, String reason) {\n        appendInternal(context, segmentId, file, startedAtMs, endedAtMs, status, reason, true);\n    }\n\n    public static void appendWithoutNotify(Context context, String segmentId, File file, long startedAtMs,\n                                           long endedAtMs, String status, String reason) {\n        appendInternal(context, segmentId, file, startedAtMs, endedAtMs, status, reason, false);\n    }\n\n    private static void appendInternal(Context context, String segmentId, File file, long startedAtMs,\n                                       long endedAtMs, String status, String reason, boolean notifyReady) {\n        boolean newlyReady = notifyReady && "READY".equals(status)')

          # Clean reset generation: prevents already-running old Workers from writing stale results back.
          reset_manager = r'''package com.sktpj.recorder24h.transcription;

import android.content.Context;
import android.content.SharedPreferences;

import androidx.work.WorkManager;

import com.sktpj.recorder24h.storage.SegmentRepository;
import com.sktpj.recorder24h.storage.StoragePolicy;
import com.sktpj.recorder24h.util.AppLogger;

import org.json.JSONObject;

import java.io.File;

public final class TranscriptionResetManager {
    public static final String EXTRA_GENERATION = "transcriptionGeneration";

    private static final String PREFS = "transcription-reset";
    private static final String KEY_GENERATION = "generation";
    private static final String KEY_RESET_VERSION = "resetVersion";
    private static final int V049_RESET_VERSION = 1;

    private TranscriptionResetManager() {
    }

    public static int currentGeneration(Context context) {
        return prefs(context).getInt(KEY_GENERATION, 0);
    }

    public static boolean isCurrentGeneration(Context context, int generation) {
        return currentGeneration(context) == generation;
    }

    public static synchronized boolean applyV049ResetIfNeeded(Context context) {
        Context app = context.getApplicationContext();
        SharedPreferences prefs = prefs(app);
        if (prefs.getInt(KEY_RESET_VERSION, 0) >= V049_RESET_VERSION) {
            return false;
        }

        // Change generation first. Workers that were created by 0.4.8 or earlier either carry
        // generation 0 or the previous generation and are no longer allowed to persist output.
        int nextGeneration = prefs.getInt(KEY_GENERATION, 0) + 1;
        if (!prefs.edit().putInt(KEY_GENERATION, nextGeneration).commit()) {
            return false;
        }

        WorkManager workManager = WorkManager.getInstance(app);
        workManager.cancelAllWorkByTag("transcription");
        workManager.cancelAllWorkByTag("model-comparison");

        int transcriptFiles = deleteContents(new File(app.getFilesDir(), "transcripts"));
        int comparisonFiles = deleteContents(new File(app.getFilesDir(), "model_comparisons"));

        int audioCount = 0;
        File[] audioFiles = StoragePolicy.getAudioDir(app)
                .listFiles((dir, name) -> name.endsWith(".m4a"));
        if (audioFiles != null) {
            long resetAt = System.currentTimeMillis();
            for (File audioFile : audioFiles) {
                String segmentId = TranscriptionScheduler.extractSegmentId(audioFile.getName());
                if (segmentId == null) {
                    continue;
                }
                // Keep the original M4A. A zero start time means this reset row changes only the
                // latest processing state; the original recording-time row remains authoritative.
                SegmentRepository.appendWithoutNotify(app, segmentId, audioFile, 0L, resetAt,
                        "READY", null);
                audioCount++;
            }
        }

        prefs.edit().putInt(KEY_RESET_VERSION, V049_RESET_VERSION).commit();

        try {
            JSONObject details = new JSONObject();
            details.put("generation", nextGeneration);
            details.put("deletedTranscriptFiles", transcriptFiles);
            details.put("deletedComparisonFiles", comparisonFiles);
            details.put("retainedAudioFiles", audioCount);
            details.put("audioDeleted", false);
            AppLogger.event(app, "V049_TRANSCRIPTION_STATE_RESET", details);
        } catch (Exception ignored) {
        }
        return true;
    }

    private static SharedPreferences prefs(Context context) {
        return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
    }

    private static int deleteContents(File dir) {
        if (!dir.isDirectory()) {
            return 0;
        }
        int deleted = 0;
        File[] files = dir.listFiles();
        if (files == null) {
            return 0;
        }
        for (File file : files) {
            if (file.isDirectory()) {
                deleted += deleteContents(file);
                //noinspection ResultOfMethodCallIgnored
                file.delete();
            } else if (file.delete()) {
                deleted++;
            }
        }
        return deleted;
    }
}
'''
