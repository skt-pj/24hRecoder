name: Patch v0.4.8 final fixes

on:
  push:
    branches:
      - work/default-large-v3-q5-v0.4.8

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v0.4.8 final fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/default-large-v3-q5-v0.4.8
          fetch-depth: 0
      - name: Apply final fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count}, found {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/WhisperModelManager.java'
          rep(path,
              '    public static final String ASR_EXPECTED_SHA256 =\n            "d75795ecff3f83b5faa89d1900604ad8c780abd5739fae406de19f23ecd98ad1";\n',
              '    public static final String ASR_EXPECTED_SHA256 =\n            "d75795ecff3f83b5faa89d1900604ad8c780abd5739fae406de19f23ecd98ad1";\n    private static final String BASE_EXPECTED_SHA256 =\n            "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe";\n')
          rep(path,
              '                    ASR_EXPECTED_SHA256,\n                    false),',
              '                    BASE_EXPECTED_SHA256,\n                    false),')
          rep(path, '                    "多言語・標準",', '                    "多言語・比較用・旧標準",')
          rep(path, '                    "多言語・large-v3量子化・最高精度候補",',
                    '                    "多言語・large-v3量子化・標準モデル",')
          rep(path,
              '        if (MODEL_BASE.equals(modelId)) {\n            return false;\n        }',
              '        if (MODEL_DEFAULT.equals(modelId)) {\n            return false;\n        }')

          path = 'app/src/main/java/com/sktpj/recorder24h/ModelComparisonCard.kt'
          rep(path,
              '    var selectedIds by remember(record.segmentId) {\n        val defaultId = WhisperModelManager.MODEL_DEFAULT\n        mutableStateOf(\n            if (WhisperModelManager.isComparisonReady(context, defaultId)) setOf(defaultId)\n            else emptySet()\n        )\n    }',
              '    var selectedIds by remember(record.segmentId) {\n        mutableStateOf(setOf(WhisperModelManager.MODEL_DEFAULT))\n    }')
          rep(path,
              '                            if (spec.id != WhisperModelManager.MODEL_BASE) {',
              '                            if (spec.id != WhisperModelManager.MODEL_DEFAULT) {')

          path = 'README.md'
          s = Path(path).read_text()
          marker = '## 現在の実装\n\n'
          if marker not in s:
              raise SystemExit('README current implementation marker missing')
          if '- 現在のdebug APK: `0.4.8-debug` / versionCode 12' not in s:
              s = s.replace(marker, marker + '- 現在のdebug APK: `0.4.8-debug` / versionCode 12\n', 1)
          Path(path).write_text(s)
          PY

          git rm .github/workflows/patch-v048-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "Fix default model metadata and comparison selection"
          git push origin HEAD:work/default-large-v3-q5-v0.4.8
