name: Patch AI settings integration

on:
  push:
    branches: ["agent/add-luna-analysis"]
    paths: [".github/workflows/patch-ai-settings.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-luna-analysis

      - name: Integrate AI settings card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          source = path.read_text(encoding='utf-8')

          privacy_marker = '''        item {
            Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.secondaryContainer)) {
                Column(Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    Text("プライバシー", style = MaterialTheme.typography.titleLarge)
'''
          if privacy_marker not in source:
              raise SystemExit('privacy settings block not found')
          source = source.replace(
              privacy_marker,
              '''        item { AiSettingsCard() }
''' + privacy_marker,
              1,
          )

          old_privacy = '録音音声と文字起こしは端末内で完結します。外部APIへ音声を送信しません。初回のWhisperモデル取得時のみネット接続を使用します。'
          new_privacy = '録音音声とローカル文字起こしは端末内で処理します。AI分析を有効にした場合のみ、文字起こしテキストをOpenAI APIへ送信します。録音音声はOpenAI APIへ送信しません。'
          if old_privacy not in source:
              raise SystemExit('privacy description not found')
          source = source.replace(old_privacy, new_privacy, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-ai-settings.yml
          git add app/src/main/java/com/sktpj/recorder24h/MainActivity.kt
          git commit -m 'Integrate AI analysis settings'
          git push origin HEAD:agent/add-luna-analysis
