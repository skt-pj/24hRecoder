name: Apply v0.4.6 UI patch

on:
  push:
    branches:
      - work/model-comparison-v0.4.6

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v046-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/model-comparison-v0.4.6
      - name: Insert model comparison card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          text = path.read_text()
          needle = '        item { TranscriptCard(record) }\n'
          addition = needle + '        item { ModelComparisonCard(record) }\n'
          if 'item { ModelComparisonCard(record) }' not in text:
              if text.count(needle) != 1:
                  raise SystemExit(f'Expected exactly one TranscriptCard insertion point, got {text.count(needle)}')
              text = text.replace(needle, addition, 1)
              path.write_text(text)
          PY
      - name: Commit UI integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/recorder24h/MainActivity.kt
          git commit -m 'Integrate model comparison card [v046-ui-patch]'
          git push origin HEAD:work/model-comparison-v0.4.6
