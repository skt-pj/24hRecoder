name: Diagnose backend build

on:
  push:
    branches: ["agent/transcription-backends-0.7.15"]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message != 'Capture backend build log' && github.event.head_commit.message != 'Fix streaming VAD diagnostic JSON' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-backends-0.7.15
      - name: Apply known Java compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sktpj/recorder24h/transcription/StreamingVadStore.java')
          text = p.read_text()
          replacements = {
            '''log(context, "STREAMING_VAD_RUNTIME_FAILED", new JSONObject()\n                        .put("error", error.getClass().getSimpleName())\n                        .put("message", safeMessage(error)));''':
            '''log(context, "STREAMING_VAD_RUNTIME_FAILED", details(\n                        "error", error.getClass().getSimpleName(),\n                        "message", safeMessage(error)));''',
            '''log(context, "STREAMING_VAD_SEGMENT_PERSIST_FAILED", new JSONObject()\n                        .put("segmentId", segmentId)\n                        .put("error", error.getClass().getSimpleName())\n                        .put("message", safeMessage(error)));''':
            '''log(context, "STREAMING_VAD_SEGMENT_PERSIST_FAILED", details(\n                        "segmentId", segmentId,\n                        "error", error.getClass().getSimpleName(),\n                        "message", safeMessage(error)));''',
            '''log(context, "STREAMING_VAD_UNAVAILABLE", new JSONObject().put("reason", initError));''':
            '''log(context, "STREAMING_VAD_UNAVAILABLE", details("reason", initError));''',
            '''log(context, nativeReady ? "STREAMING_VAD_READY" : "STREAMING_VAD_UNAVAILABLE",\n                    new JSONObject().put("reason", initError == null ? JSONObject.NULL : initError));''':
            '''log(context, nativeReady ? "STREAMING_VAD_READY" : "STREAMING_VAD_UNAVAILABLE",\n                    details("reason", initError == null ? JSONObject.NULL : initError));''',
            '''log(context, "STREAMING_VAD_UNAVAILABLE", new JSONObject()\n                    .put("reason", initError));''':
            '''log(context, "STREAMING_VAD_UNAVAILABLE", details("reason", initError));''',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          anchor = '''    private static void log(Context context, String event, JSONObject details) {\n'''
          helper = '''    private static JSONObject details(Object... values) {\n        JSONObject json = new JSONObject();\n        for (int i = 0; i + 1 < values.length; i += 2) {\n            try {\n                json.put(String.valueOf(values[i]), values[i + 1]);\n            } catch (Exception ignored) {\n            }\n        }\n        return json;\n    }\n\n'''
          if 'private static JSONObject details(Object... values)' not in text:
              if anchor not in text:
                  raise SystemExit('details helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          p.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/sktpj/recorder24h/transcription/StreamingVadStore.java; then
            git config user.name "24hRecoder CI diagnostics"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/sktpj/recorder24h/transcription/StreamingVadStore.java
            git commit -m "Fix streaming VAD diagnostic JSON"
            git push origin HEAD:agent/transcription-backends-0.7.15
            exit 0
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android native toolchain
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Capture build output
        run: |
          set +e
          gradle --stacktrace :app:assembleDebug > ci-backend-build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> ci-backend-build.log
          git config user.name "24hRecoder CI diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add ci-backend-build.log
          git commit -m "Capture backend build log"
          git push origin HEAD:agent/transcription-backends-0.7.15
