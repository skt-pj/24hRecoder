name: Diagnose backend build

on:
  push:
    branches: ["agent/transcription-backends-0.7.15"]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message != 'Capture backend build log' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-backends-0.7.15
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android native toolchain
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Capture build output
        run: |
          set +e
          gradle --stacktrace :app:assembleDebug > ci-backend-build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> ci-backend-build.log
          git config user.name "24hRecoder CI diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add ci-backend-build.log
          git commit -m "Capture backend build log"
          git push origin HEAD:agent/transcription-backends-0.7.15
