              '                    "変更後に開始する文字起こしから選択モデルを使用します。Android端末内ASR選択時はWhisperモデルをASRには使いません。すでに実推論中の1件は、開始時に確定した経路で完了します。モデル変更だけでは保存済み文字起こしを自動上書きしません。",')

