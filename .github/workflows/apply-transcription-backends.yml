name: Apply transcription backend integration

on:
  push:
    branches: ["agent/transcription-backends-0.7.15"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply explicit selectable transcription backends'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-backends-0.7.15
      - name: Patch integration files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"missing patch anchors in {path}: expected {minimum}, got {count}")
              p.write_text(text.replace(old, new))

          # Version follows the actual GitHub latest 0.7.14 / 1014.
