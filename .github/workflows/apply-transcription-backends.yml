          # DeepFilterNet strict selected path: an actual processing failure stops this item instead of raw-ASR fallback.
          replace_once('app/src/main/java/com/sktpj/recorder24h/transcription/DeepFilterNetSpeechDenoiser.kt',
              '    private fun processRegion(\n',
              '''    @JvmStatic
    fun denoiseSelected(
        context: Context,
        segmentId: String?,
        source: FloatArray,
        startsMs: IntArray,
        endsMs: IntArray,
        inputSnrProxyDb: Double,
    ): Result {
        val result = denoise(context, segmentId, source, startsMs, endsMs, inputSnrProxyDb)
        val intentionalSkip = result.reason == "snr-clean-enough" ||
            result.reason == "no-speech-chunks" ||
            result.reason == "no-valid-speech-ranges"
