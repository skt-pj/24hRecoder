name: Apply transcription backend integration

on:
  push:
    branches: ["agent/transcription-backends-0.7.15"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Apply explicit selectable transcription backends' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-backends-0.7.15
      - name: Apply integration patch
        run: python3 scripts/apply_transcription_backends.py
      - name: Commit integration
        run: |
          git config user.name "24hRecoder CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add app .github/workflows/build-apk.yml
          git commit -m "Apply explicit selectable transcription backends"
          git push origin HEAD:agent/transcription-backends-0.7.15
