                    ),
                    modifier = Modifier.fillMaxWidth().height(56.dp)
                ) { Text(if (dashboard.state == "STOPPING") "停止中…" else "録音を停止") }
            } else {
                Button(onClick = onRequestStart, modifier = Modifier.fillMaxWidth().height(56.dp)) {
                    Text("録音を開始")
                }
            }
        }
    }
}

