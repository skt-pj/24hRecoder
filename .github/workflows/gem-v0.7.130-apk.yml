name: Build signed Gem APK 0.7.130
on:
  push:
    branches: ["main", "agent/gem-recording-fetch-phase-v0.7.130"]
    paths:
      - ".github/workflows/gem-v0.7.130-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;36.0.0"
      - name: Test and assemble
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Sign and validate
        run: |
          set -euo pipefail
          mkdir -p .ci-signing release
          curl -fsSL https://raw.githubusercontent.com/skt-pj/2048TD/main/ci/2048td-release.jks.b64 -o .ci-signing/common.jks.b64
          base64 -d .ci-signing/common.jks.b64 > .ci-signing/common.jks
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks .ci-signing/common.jks --ks-key-alias 2048td-release --ks-pass pass:2048td-release --key-pass pass:2048td-release --out release/24hRecoder-0.7.130-debug.apk app/build/outputs/apk/debug/app-debug-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/24hRecoder-0.7.130-debug.apk | tee release/signing-certificate.txt
          grep -F 'Signer #1 certificate SHA-256 digest: e648320071b8ab0de038f76790064b99461b67d7dbe7ce7506d12a5f4fa884d8' release/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/24hRecoder-0.7.130-debug.apk | tee release/badging.txt
          grep -F "versionCode='1130'" release/badging.txt
          grep -F "versionName='0.7.130'" release/badging.txt
          (cd release && sha256sum 24hRecoder-0.7.130-debug.apk > 24hRecoder-0.7.130-debug.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: 24hRecoder-v0.7.130-debug
          path: release/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.130-debug -m "24hRecoder 0.7.130 debug"
          git push origin refs/tags/v0.7.130-debug
          gh release create v0.7.130-debug release/24hRecoder-0.7.130-debug.apk release/24hRecoder-0.7.130-debug.apk.sha256 release/signing-certificate.txt --verify-tag --prerelease --title "24hRecoder v0.7.130-debug" --notes "Distinguish Gem mic-gated recording, STOP acknowledgement and post-stop file transfer. No 60s silence-as-data error during recording. Retain v0.7.119 BLE sequence and 60s voice stop. Hardware verification pending."
