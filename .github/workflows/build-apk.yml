name: Build APK

on:
  push:
    branches: ["main", "agent/**", "work/**"]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;36.0.0"

      - name: Build unsigned debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify optimized Whisper native build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import sys

          paths = glob.glob('app/.cxx/**/compile_commands.json', recursive=True)
          if not paths:
              print('compile_commands.json was not generated', file=sys.stderr)
              sys.exit(1)
          commands = []
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  commands.extend(json.load(handle))
          whisper_commands = [
              row.get('command', '')
              for row in commands
              if 'whisper' in row.get('file', '').lower() or 'ggml' in row.get('file', '').lower()
          ]
          if not whisper_commands:
              print('No whisper.cpp/ggml compile commands found', file=sys.stderr)
              sys.exit(1)
          if any('-O3' not in command for command in whisper_commands):
              print('At least one whisper.cpp/ggml source is missing -O3', file=sys.stderr)
              sys.exit(1)
          print(f'Verified -O3 on {len(whisper_commands)} whisper.cpp/ggml compile commands')
          PY

      - name: Apply stable development signature
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          curl -fsSL "https://android.googlesource.com/platform/build/+/ddec2f0/target/product/security/testkey.pk8?format=TEXT" | base64 --decode > .ci-signing/testkey.pk8
          curl -fsSL "https://android.googlesource.com/platform/build/+/ddec2f0/target/product/security/testkey.x509.pem?format=TEXT" | base64 --decode > .ci-signing/testkey.x509.pem

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/debug/app-debug-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$UNSIGNED_APK"
          "$APKSIGNER" sign \
            --key .ci-signing/testkey.pk8 \
            --cert .ci-signing/testkey.x509.pem \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

      - name: Publish latest APK into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/24hRecoder-debug.apk
          sha256sum dist/24hRecoder-debug.apk > dist/24hRecoder-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update latest debug APK"
          git pull --rebase origin main
          git push origin HEAD:main
