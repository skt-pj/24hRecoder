name: Build APK

on:
  push:
    branches: ["main", "agent/**", "work/**"]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;36.0.0"

      - name: Test and build unsigned debug APK
        run: gradle --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify optimized Whisper native build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import sys

          paths = glob.glob('app/.cxx/**/compile_commands.json', recursive=True)
          if not paths:
              print('compile_commands.json was not generated', file=sys.stderr)
              sys.exit(1)
          commands = []
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  commands.extend(json.load(handle))
          whisper_commands = [
              row.get('command', '')
              for row in commands
              if 'whisper' in row.get('file', '').lower() or 'ggml' in row.get('file', '').lower()
          ]
          if not whisper_commands:
              print('No whisper.cpp/ggml compile commands found', file=sys.stderr)
              sys.exit(1)
          if any('-O3' not in command for command in whisper_commands):
              print('At least one whisper.cpp/ggml source is missing -O3', file=sys.stderr)
              sys.exit(1)
          print(f'Verified -O3 on {len(whisper_commands)} whisper.cpp/ggml compile commands')
          PY

      - name: Apply common stable signature
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          curl -fsSL "https://raw.githubusercontent.com/skt-pj/2048TD/main/ci/2048td-release.jks.b64" -o .ci-signing/common.jks.b64
          base64 --decode .ci-signing/common.jks.b64 > .ci-signing/common.jks

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/debug/app-debug-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$UNSIGNED_APK"
          "$APKSIGNER" sign \
            --ks .ci-signing/common.jks \
            --ks-key-alias 2048td-release \
            --ks-pass pass:2048td-release \
            --key-pass pass:2048td-release \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK")"
          printf '%s\n' "$VERIFY_OUT"
          printf '%s\n' "$VERIFY_OUT" | grep -F "Signer #1 certificate SHA-256 digest: e648320071b8ab0de038f76790064b99461b67d7dbe7ce7506d12a5f4fa884d8"

      - name: Verify APK version 0.7.126
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/debug/badging.txt
          grep -F "versionCode='1126'" app/build/outputs/apk/debug/badging.txt
          grep -F "versionName='0.7.126'" app/build/outputs/apk/debug/badging.txt

      - name: Generate APK integrity and build metadata
        run: |
          set -euo pipefail
          mkdir -p release
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" release/24hRecoder-0.7.126-debug.apk
          cd release
          sha256sum 24hRecoder-0.7.126-debug.apk > 24hRecoder-0.7.126-debug.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs 24hRecoder-0.7.126-debug.apk > signing-certificate.txt
          grep -F "Signer #1 certificate SHA-256 digest: e648320071b8ab0de038f76790064b99461b67d7dbe7ce7506d12a5f4fa884d8" signing-certificate.txt
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'branch=%s\n' "$GITHUB_REF_NAME"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'versionName=0.7.126-debug\nversionCode=1126\n'
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'build_and_test=passed\n'
            printf 'signing=commonStable\n'
          } > build-metadata.txt

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 24hRecoder-v0.7.126-debug
          path: |
            release/24hRecoder-0.7.126-debug.apk
            release/24hRecoder-0.7.126-debug.apk.sha256
            release/signing-certificate.txt
            release/build-metadata.txt
          if-no-files-found: error

      - name: Publish signed APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.7.126-debug"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || {
              echo "Existing version tag points to a different commit" >&2
              exit 1
            }
          else
            git tag -a "$TAG" -m "24hRecoder 0.7.126-debug"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published for $TAG"
          else
            gh release create "$TAG"               release/24hRecoder-0.7.126-debug.apk               release/24hRecoder-0.7.126-debug.apk.sha256               release/signing-certificate.txt               release/build-metadata.txt               --verify-tag --prerelease               --title "24hRecoder 0.7.126-debug"               --notes "Fix repeated transcription queue Java exceptions, preserve pending audio and record failure stack traces. Physical-device verification is pending."
          fi
          mkdir -p release-check
          gh release download "$TAG" --pattern "24hRecoder-0.7.126-debug.apk" --dir release-check
          test "$(sha256sum release-check/24hRecoder-0.7.126-debug.apk | cut -d' ' -f1)" =                "$(sha256sum release/24hRecoder-0.7.126-debug.apk | cut -d' ' -f1)"
