name: Apply live streaming stability

on:
  push:
    branches:
      - agent/live-streaming-stability-0.7.20
    paths:
      - .github/workflows/apply-live-streaming-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-streaming-stability-0.7.20
      - name: Apply patch
        run: python .github/scripts/apply_live_streaming_stability.py
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize live Whisper state lifecycle and add crash diagnostics"
          git push origin HEAD:agent/live-streaming-stability-0.7.20
