name: Normalize queue pause service

on:
  push:
    branches:
      - agent/pause-backlog-during-live-0.7.17

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore service baseline and add manual pause guards
        run: |
          git checkout 8b7cbad2c9ca785d07e8231317e19e3177389b31 -- app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionQueueService.java
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionQueueService.java')
          s = p.read_text()
          s = s.replace(
              '    public static boolean kick(Context context) {\n        Context app = context.getApplicationContext();\n',
              '    public static boolean kick(Context context) {\n        Context app = context.getApplicationContext();\n        if (TranscriptionScheduler.isQueuePaused(app)) {\n            AppLogger.event(app, "TRANSCRIPTION_DIRECT_QUEUE_KICK_IGNORED_QUEUE_PAUSED");\n            return false;\n        }\n', 1)
          s = s.replace(
              '    public int onStartCommand(Intent intent, int flags, int startId) {\n        promote("文字起こしキューを処理中");',
              '    public int onStartCommand(Intent intent, int flags, int startId) {\n        if (TranscriptionScheduler.isQueuePaused(this)) {\n            AppLogger.event(getApplicationContext(), "TRANSCRIPTION_DIRECT_QUEUE_START_SKIPPED_QUEUE_PAUSED");\n            stopForeground(STOP_FOREGROUND_REMOVE);\n            stopSelf();\n            return START_NOT_STICKY;\n        }\n        promote("文字起こしキューを処理中");', 1)
          s = s.replace(
              '    private void drainQueue() {\n        Context context = getApplicationContext();\n',
              '    private void drainQueue() {\n        Context context = getApplicationContext();\n        if (TranscriptionScheduler.isQueuePaused(context)) {\n            AppLogger.event(context, "TRANSCRIPTION_DIRECT_QUEUE_DRAIN_SKIPPED_QUEUE_PAUSED");\n            return;\n        }\n', 1)
          s = s.replace(
              '            while (System.currentTimeMillis() - serviceStartedAtMs < MAX_SERVICE_RUNTIME_MS) {\n                SegmentRecord next = nextQueuedRecord(context);',
              '            while (System.currentTimeMillis() - serviceStartedAtMs < MAX_SERVICE_RUNTIME_MS) {\n                if (TranscriptionScheduler.isQueuePaused(context)) {\n                    AppLogger.event(context, "TRANSCRIPTION_DIRECT_QUEUE_PAUSED_AFTER_CURRENT_ITEM");\n                    return;\n                }\n                SegmentRecord next = nextQueuedRecord(context);', 1)
          s = s.replace(
              '        for (int attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {\n            String selectedModelId = WhisperModelManager.selectedModelId(context);',
              '        for (int attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {\n            if (TranscriptionScheduler.isQueuePaused(context)) {\n                log(context, "TRANSCRIPTION_DIRECT_QUEUE_ITEM_HELD_QUEUE_PAUSED", segmentId, audioFile,\n                        "QUEUED_ITEM_RETAINED", forceRetranscribe, attempt, null,\n                        WhisperModelManager.selectedModelId(context), LocalWhisperEngine.engineId(context));\n                return;\n            }\n            String selectedModelId = WhisperModelManager.selectedModelId(context);', 1)
          s = s.replace(
              '            details.put("vadReady", WhisperModelManager.isVadReady(context));\n',
              '            details.put("vadReady", WhisperModelManager.isVadReady(context));\n            details.put("queuePaused", TranscriptionScheduler.isQueuePaused(context));\n', 1)
          p.write_text(s)
          PY
      - name: Commit normalized service
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionQueueService.java
          git commit -m 'Keep queue pause explicit in direct runner'
          git push origin HEAD:agent/pause-backlog-during-live-0.7.17
