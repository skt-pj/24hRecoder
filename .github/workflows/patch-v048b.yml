name: Patch v0.4.8 retry

on:
  push:
    branches:
      - work/default-large-v3-q5-v0.4.8

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v0.4.8 patch workflow retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/default-large-v3-q5-v0.4.8
          fetch-depth: 0
      - name: Apply v0.4.8 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/WhisperModelManager.java'
          replace(path,
              '    public static final String MODEL_LARGE_V3_Q5 = "large-v3-q5";\n\n',
              '    public static final String MODEL_LARGE_V3_Q5 = "large-v3-q5";\n    public static final String MODEL_DEFAULT = MODEL_LARGE_V3_Q5;\n\n')
          replace(path,
              '    // Standard automatic transcription remains multilingual Whisper base. Model comparison is\n    // deliberately separate so experiments never replace the user\'s canonical transcript unless\n    // the normal retranscription action is used.\n    public static final String MODEL_ID = "whisper.cpp-v1.9.1/base+silero-v6.2.0";\n    public static final String MODEL_FILE_NAME = "ggml-base.bin";\n    public static final long ASR_EXPECTED_BYTES = 147_951_465L;\n    public static final String ASR_EXPECTED_SHA1 = "465707469ff3a37a2b9b8d8f89f2f99de7299dac";\n    public static final String ASR_EXPECTED_SHA256 =\n            "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe";\n',
              '    // Canonical automatic transcription now prioritizes recognition quality and uses\n    // multilingual Whisper large-v3 Q5. Comparison remains separate and never overwrites the\n    // canonical transcript unless the normal/manual transcription path is invoked.\n    public static final String MODEL_ID = "whisper.cpp-v1.9.1/large-v3-q5_0+silero-v6.2.0";\n    public static final String MODEL_FILE_NAME = "ggml-large-v3-q5_0.bin";\n    public static final long ASR_EXPECTED_BYTES = 1_081_140_203L;\n    public static final String ASR_EXPECTED_SHA256 =\n            "d75795ecff3f83b5faa89d1900604ad8c780abd5739fae406de19f23ecd98ad1";\n')
          replace(path, 'return modelFile(context, MODEL_BASE);', 'return modelFile(context, MODEL_DEFAULT);')
          replace(path, 'return isModelReady(context, MODEL_BASE);', 'return isModelReady(context, MODEL_DEFAULT);')
          replace(path, 'enqueueModelDownload(context, MODEL_BASE);', 'enqueueModelDownload(context, MODEL_DEFAULT);')
          replace(path, 'String unique = MODEL_BASE.equals(modelId) ? UNIQUE_DOWNLOAD : "download-whisper-model:" + modelId;',
                        'String unique = MODEL_DEFAULT.equals(modelId) ? UNIQUE_DOWNLOAD : "download-whisper-model:" + modelId;')
          replace(path, 'File asr = downloadModel(context, MODEL_BASE);', 'File asr = downloadModel(context, MODEL_DEFAULT);')
          replace(path, 'connection.setRequestProperty("User-Agent", "24hRecoder/0.4.7");',
                        'connection.setRequestProperty("User-Agent", "24hRecoder/0.4.8");')

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/LocalWhisperEngine.java'
          replace(path,
              '    public static final String ENGINE_ID = "whisper.cpp-v1.9.1/base+frontend-v1+silero-v6.2.0";',
              '    public static final String ENGINE_ID = "whisper.cpp-v1.9.1/large-v3-q5_0+frontend-v1+silero-v6.2.0";')
          replace(path,
              '        return transcribePrepared(context, prepared, WhisperModelManager.MODEL_BASE);',
              '        return transcribePrepared(context, prepared, WhisperModelManager.MODEL_DEFAULT);')

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/WhisperModelDownloadWorker.java'
          replace(path, '            modelId = WhisperModelManager.MODEL_BASE;',
                        '            modelId = WhisperModelManager.MODEL_DEFAULT;')
          replace(path, 'if (WhisperModelManager.MODEL_BASE.equals(modelId)) {',
                        'if (WhisperModelManager.MODEL_DEFAULT.equals(modelId)) {', count=2)
          replace(path,
              '        // small/Kotoba are explicitly requested comparison assets and can be ~500 MiB. Promote\n        // those user-triggered transfers to WorkManager\'s foreground dataSync service so a slow\n        // network is not constrained by the normal short Worker execution window. The standard\n        // base/VAD bootstrap keeps the existing background behavior because it may be scheduled by\n        // MY_PACKAGE_REPLACED without a visible user action.\n        if (!WhisperModelManager.MODEL_BASE.equals(modelId)) {',
              '        // Large comparison/default assets can exceed 1 GiB. Promote non-base transfers to\n        // WorkManager\'s foreground dataSync service so a slow network is not constrained by a\n        // normal short Worker execution window.\n        if (!WhisperModelManager.MODEL_BASE.equals(modelId)) {')

          path = 'app/src/main/cpp/whisper_jni.cpp'
          replace(path,
              '        const float t0_seconds = whisper_vad_segments_get_segment_t0(segments, i);\n        const float t1_seconds = whisper_vad_segments_get_segment_t1(segments, i);\n        const long long start_ms = std::llround(t0_seconds * 1000.0);\n        const long long end_ms = std::llround(t1_seconds * 1000.0);',
              '        // whisper.cpp stores/returns VAD segment timestamps in centiseconds.\n        // Convert cs -> ms by multiplying by 10 (not 1000).\n        const float t0_centiseconds = whisper_vad_segments_get_segment_t0(segments, i);\n        const float t1_centiseconds = whisper_vad_segments_get_segment_t1(segments, i);\n        const long long start_ms = std::llround(t0_centiseconds * 10.0);\n        const long long end_ms = std::llround(t1_centiseconds * 10.0);')
          replace(path,
              '         << ",\\\"threshold\\\":0.5"\n         << ",\\\"segmentCount\\\":" << segment_count',
              '         << ",\\\"threshold\\\":0.5"\n         << ",\\\"timebase\\\":\\\"whisper-vad-centiseconds-to-ms\\\""\n         << ",\\\"segmentCount\\\":" << segment_count')

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/ModelComparisonWorker.java'
          replace(path, '            root.put("schemaVersion", 2);', '            root.put("schemaVersion", 3);')
          replace(path,
              '            root.put("startedAtMs", startedAt);\n            JSONArray requested = new JSONArray();',
              '            root.put("startedAtMs", startedAt);\n            root.put("defaultModelId", WhisperModelManager.MODEL_DEFAULT);\n            JSONArray requested = new JSONArray();')

          path = 'app/src/main/java/com/sktpj/recorder24h/transcription/TranscriptionWorker.java'
          replace(path,
              '                metrics.put("inferenceMs", response.inferenceMs);\n                metrics.put("queueWaitMs", queueWaitMs);',
              '                metrics.put("inferenceMs", response.inferenceMs);\n                metrics.put("modelLoadMs", response.modelLoadMs);\n                metrics.put("whisperFullMs", response.whisperFullMs);\n                metrics.put("modelId", response.modelId);\n                metrics.put("modelLabel", response.modelLabel);\n                metrics.put("modelBytes", response.modelBytes);\n                metrics.put("queueWaitMs", queueWaitMs);')

          path = 'app/src/main/java/com/sktpj/recorder24h/ModelComparisonCard.kt'
          replace(path,
              '    var selectedIds by remember(record.segmentId) {\n        mutableStateOf(\n            specs.filter { WhisperModelManager.isComparisonReady(context, it.id) }\n                .map { it.id }\n                .toSet()\n        )\n    }',
              '    var selectedIds by remember(record.segmentId) {\n        val defaultId = WhisperModelManager.MODEL_DEFAULT\n        mutableStateOf(\n            if (WhisperModelManager.isComparisonReady(context, defaultId)) setOf(defaultId)\n            else emptySet()\n        )\n    }')
          replace(path,
              '                                Text(spec.label, fontWeight = FontWeight.SemiBold)',
              '                                Text(\n                                    if (spec.id == WhisperModelManager.MODEL_DEFAULT) "${spec.label}（デフォルト）" else spec.label,\n                                    fontWeight = FontWeight.SemiBold\n                                )')
          replace(path,
              '                "この記録の元音声だけを同じ前処理・同じSilero VAD条件で比較します。内容と発話の取りこぼしを最優先で確認し、速度は補助指標として表示します。比較結果は通常の文字起こしを上書きしません。",',
              '                "この記録の元音声だけを同じ前処理・同じSilero VAD条件で比較します。large-v3 Q5をデフォルト選択し、内容と発話の取りこぼしを最優先で確認します。速度は補助指標です。比較結果は通常の文字起こしを上書きしません。",')

          path = 'app/src/main/java/com/sktpj/recorder24h/MainActivity.kt'
          replace(path, 'Whisper baseモデルのダウンロードを開始します',
                        'Whisper large-v3 Q5モデルのダウンロードを開始します')
          replace(path, 'Text("base / 多言語 / ${formatMb(WhisperModelManager.EXPECTED_BYTES)}")',
                        'Text("large-v3 Q5 / 多言語 / デフォルト / ${formatMb(WhisperModelManager.EXPECTED_BYTES)}")')
          replace(path, 'Text("Whisper baseモデルをダウンロード")',
                        'Text("Whisper large-v3 Q5モデルをダウンロード")')
          replace(path, 'versionName ?: "0.4.0-debug"', 'versionName ?: "0.4.8-debug"')
          replace(path, 'catch (_: Exception) { "0.4.0-debug" }', 'catch (_: Exception) { "0.4.8-debug" }')

          path = 'app/src/main/java/com/sktpj/recorder24h/service/BootReceiver.java'
          replace(path,
              '        // 0.4.2 devices already have the Whisper base model but not the Silero VAD model.\n        // MY_PACKAGE_REPLACED is the safest place to schedule the small missing model without\n        // requiring the user to discover a new setup button. The download worker verifies the\n        // model and then re-enqueues retained audio made by the older transcription engine.',
              '        // If the canonical ASR model is already present but the shared Silero VAD asset is\n        // missing after an app update, restore the VAD asset and then re-enqueue retained audio.\n        // A missing 1+ GiB canonical ASR model is not silently downloaded solely because of package\n        // replacement; normal setup/transcription flow requests it explicitly.')
          replace(path, 'PACKAGE_REPLACED_VAD_MODEL_MIGRATION_QUEUED',
                        'PACKAGE_REPLACED_VAD_ASSET_REPAIR_QUEUED')

          path = 'app/build.gradle'
          replace(path, '        versionCode 11\n        versionName \'0.4.7\'',
                        '        versionCode 12\n        versionName \'0.4.8\'')

          path = 'README.md'
          replace(path, '- 多言語Whisper `base`モデルを使用',
                        '- 多言語Whisper `large-v3 Q5`モデルを標準文字起こしに使用')
          replace(path,
              'VADモデルは`ggml-silero-v6.2.0.bin`を使用し、取得時に885,098 bytesとSHA-256 `2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987`を検証します。Whisper baseと同じく`noBackupFilesDir/whisper/`へ保存し、作業データ1GBの論理上限には含めません。',
              'VADモデルは`ggml-silero-v6.2.0.bin`を使用し、取得時に885,098 bytesとSHA-256 `2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987`を検証します。標準ASRのWhisper large-v3 Q5と同じく`noBackupFilesDir/whisper/`へ保存し、モデル本体は作業データ1GBの論理上限には含めません。')
          replace(path,
              'エンジンIDは`whisper.cpp-v1.9.1/base+frontend-v1+silero-v6.2.0`とします。',
              '0.4.8-debugでは標準文字起こしをWhisper large-v3 Q5へ変更し、エンジンIDを`whisper.cpp-v1.9.1/large-v3-q5_0+frontend-v1+silero-v6.2.0`とします。')
          replace(path,
              'Whisper ASRには`ggml-base.bin`、発話検出には`ggml-silero-v6.2.0.bin`を使用します。既にbaseがある端末を0.4.3以降へ更新した場合は不足しているVADモデルだけを取得します。取得後は各モデルのサイズとハッシュを検証します。',
              '標準Whisper ASRには`ggml-large-v3-q5_0.bin`、発話検出には`ggml-silero-v6.2.0.bin`を使用します。large-v3 Q5は1,081,140,203 bytesとSHA-256 `d75795ecff3f83b5faa89d1900604ad8c780abd5739fae406de19f23ecd98ad1`を検証します。base/small/medium Q5/Kotoba Q5は比較用として引き続き利用できます。')

          marker = '## 文字起こしキュー\n'
          s = Path(path).read_text()
          note = '''### 0.4.8: large-v3 Q5既定化とVAD診断時刻修正\n\n実録音の比較でbase/smallよりlarge-v3 Q5の日本語出力が相対的にまともだったため、速度より内容を優先し、通常の確定文字起こしもlarge-v3 Q5を使用します。0.4.7の比較ログでSilero VADの独立診断時刻が100倍になっていた不具合も修正しました。whisper.cpp v1.9.1のVAD segment APIはcentisecond単位を返すため、ms変換は`* 10`です。修正後は5分音源のVAD区間とWhisper出力時刻を同じms timebaseで直接比較できます。\n\n同じ実録音では、正しいtimebaseに直すとVADは約16.59〜73.84秒に6区間を検出し、base/small/medium Q5/large-v3 Q5は最終VAD付近まで出力する一方、Kotoba-Whisper v2.0 Q5は約21.62秒で出力が止まることが分かります。Kotobaの長音声経路は比較診断対象として残し、標準モデルにはしません。\n\n'''
          if marker not in s:
              raise SystemExit('README marker missing')
          Path(path).write_text(s.replace(marker, note + marker, 1))
          PY

          git rm .github/workflows/patch-v048.yml .github/workflows/patch-v048b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "Set large-v3 Q5 default and fix VAD diagnostic timebase"
          git push origin HEAD:work/default-large-v3-q5-v0.4.8
