name: Apply record list browsing context restoration

on:
  push:
    branches: ["agent/record-list-scroll-restore"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[history-context-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/record-list-scroll-restore
          fetch-depth: 0

      - name: Patch history browsing context
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sktpj/recorder24h/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    var dashboard by remember { mutableStateOf(readDashboard(context)) }\n    val historyListState = rememberLazyListState()\n',
                  '    var dashboard by remember { mutableStateOf(readDashboard(context)) }\n    val historyListState = rememberLazyListState()\n    var historyQuery by remember { mutableStateOf("") }\n    var historyFilter by remember { mutableStateOf(HistoryFilter.ALL) }\n'
              ),
              (
                  '                        section == AppSection.HISTORY -> HistoryScreen(\n                            records = records,\n                            listState = historyListState,\n                            onSelect = { selectedId = it.segmentId }\n                        )\n',
                  '                        section == AppSection.HISTORY -> HistoryScreen(\n                            records = records,\n                            listState = historyListState,\n                            query = historyQuery,\n                            filter = historyFilter,\n                            onQueryChange = { historyQuery = it },\n                            onFilterChange = { historyFilter = it },\n                            onSelect = { selectedId = it.segmentId }\n                        )\n'
              ),
              (
                  'private fun HistoryScreen(\n    records: List<SegmentRecord>,\n    listState: LazyListState,\n    onSelect: (SegmentRecord) -> Unit\n) {\n    var query by remember { mutableStateOf("") }\n    var filter by remember { mutableStateOf(HistoryFilter.ALL) }\n',
                  'private fun HistoryScreen(\n    records: List<SegmentRecord>,\n    listState: LazyListState,\n    query: String,\n    filter: HistoryFilter,\n    onQueryChange: (String) -> Unit,\n    onFilterChange: (HistoryFilter) -> Unit,\n    onSelect: (SegmentRecord) -> Unit\n) {\n'
              ),
              (
                  '                onValueChange = { query = it },\n',
                  '                onValueChange = onQueryChange,\n'
              ),
              (
                  '                    FilterChip(selected = filter == item, onClick = { filter = item }, label = { Text(item.label) })\n',
                  '                    FilterChip(selected = filter == item, onClick = { onFilterChange(item) }, label = { Text(item.label) })\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'MainActivity replacement expected once, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-history-context-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve record-list browsing context [history-context-fix]"
          git push origin HEAD:agent/record-list-scroll-restore
