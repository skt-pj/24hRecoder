plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.sktpj.recorder24h'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.sktpj.recorder24h'
        minSdk 29
        targetSdk 36
        versionCode 1005
        versionName '0.7.5'
        // Normal local transcription model is user-selectable in Settings.
        // AI analysis can switch between OpenAI GPT-5.6 Luna and local Gemma 4 E2B.
        // Recording input verifies actual Bluetooth routing and falls back to the device mic if routing fails.
        // Record-list scroll/search/filter context survives a detail-screen round trip.
        // User-triggered queue requests run immediately in a mediaProcessing FGS.
        // Automatic background transcription still uses WorkManager with battery-not-low.
        // AI queue items represent exact target periods and semantic data-wait/retry state.
        // Hourly AI reruns select an hour directly; minute selection is intentionally unavailable.

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            // CI applies a fixed development-only signing certificate after assembleDebug.
            // Do not use that certificate for production releases.
            signingConfig null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.k2-fsa:sherpa-onnx:1.13.4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.14.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
