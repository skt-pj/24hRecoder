plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.sktpj.recorder24h'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.sktpj.recorder24h'
        minSdk 29
        targetSdk 36
        versionCode 1021
        versionName '0.7.21'
        // Normal local transcription model is user-selectable in Settings.
        // AI analysis can switch between OpenAI GPT-5.6 Luna and local Gemma 4 E2B.
        // Dense Gemma hourly input is split near conversation gaps with overlap, then synthesized from deduplicated evidence.
        // Long local Gemma analysis is promoted to mediaProcessing foreground work and resumes completed chunk evidence after interruption.
        // Recording input verifies actual Bluetooth routing and falls back to the device mic if routing fails.
        // Record-list scroll/search/filter context survives a detail-screen round trip.
        // User-triggered queue requests run immediately in a mediaProcessing FGS.
        // Automatic background transcription uses one WorkManager drain lane with battery-not-low.
        // Interrupted TRANSCRIBING state is recovered to QUEUED on main-process restart.
        // AI queue items represent exact target periods and semantic data-wait/retry state.
        // Queue order is user-editable; the top item has the highest execution priority.
        // AudioRecord PCM supplies a conservative realtime activity gate before candidate-only Silero VAD.
        // Low-SNR accepted speech can be denoised with AndroidDeepFilterNet before ASR without compacting time.
        // ASR/VAD/denoise/speaker paths are explicitly user-selectable; backend failure never auto-falls back.
        // Transcription execution is explicitly selectable between retained five-minute postprocess and full live streaming.
        // Full streaming runs ASR in a dedicated process so heavy inference cannot block the AudioRecord loop.
        // The persisted transcription backlog has explicit pause/resume; pause aborts current postprocess inference.
        // Record history exposes a live view backed by durable rolling full-streaming final utterances.
        // Live Whisper keeps model weights resident but allocates/frees inference state per utterance to bound memory.
        // Streaming ASR logs prior process exit reason and memory/stage breadcrumbs for native crash diagnosis.
        // Full streaming can explicitly choose persistent live Whisper or the normal postprocess JNI per utterance.
        // The standard live route uses nativeTranscribeDetailed without automatic backend fallback.

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            // CI applies a fixed development-only signing certificate after assembleDebug.
            // Do not use that certificate for production releases.
            signingConfig null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.k2-fsa:sherpa-onnx:1.13.4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.14.0'
    implementation 'io.github.kaleyravideo:android-deepfilternet:0.0.8'

    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
