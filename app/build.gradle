plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/live-history-backpressure-0.7.30.gradle')
apply from: rootProject.file('gradle/vulkan-diagnostics-0.7.34.gradle')
apply from: rootProject.file('gradle/vulkan-diagnostics-ui-fix-0.7.34.gradle')

android {
    namespace 'com.sktpj.recorder24h'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.sktpj.recorder24h'
        minSdk 29
        targetSdk 36
        versionCode 1030
        versionName '0.7.30'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.k2-fsa:sherpa-onnx:1.13.4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.14.0'
    implementation 'io.github.kaleyravideo:android-deepfilternet:0.0.8'
    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
